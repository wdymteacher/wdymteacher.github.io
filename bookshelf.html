.","type":"type","items":[{"q":"If I ___ (kill) her, I could help a hundred people.","blanks":1,"ans":["killed"]},{"q":"If Raskolnikov had money, his sister ___ (not have to) marry Luzhin.","blanks":1,"ans":["wouldn't have to"]},{"q":"If I ___ (be) Raskolnikov, I ___ (go) back to the university.","blanks":2,"ans":["were","would go"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Raskolnikov was a rich student.","ans":"F","note":""},{"q":"He thought extraordinary people could break the rules.","ans":"T","note":""},{"q":"Dounia wanted to marry Luzhin because she loved him.","ans":"F","note":"to help her brother"}]}]},{"title":"The Crime","label":"Part 2","paras":["On a hot July evening, Raskolnikov took an axe from the porter's room and hid it under his coat. He climbed the stairs to the old woman's apartment. His heart was beating so loudly that he thought everyone could hear it. He gave her a false object to pawn, and while she was looking at it, he killed her.","Then everything went wrong. While he was searching for her money with shaking hands, he heard a noise. Lizaveta, the gentle sister, had come home unexpectedly. She saw everything. Raskolnikov killed her too — an innocent woman who had never hurt anyone. Then two men came up the stairs and knocked on the door. By pure luck, they went downstairs to get help, and Raskolnikov escaped.","He took only a few small things and a purse. He didn't even look inside. The next day, he hid everything under a stone in a courtyard. He never used the money.","Back in his room, he fell into a long, terrible fever. For days, he didn't know what was real and what was a dream. His friend Razumikhin took care of him. When Raskolnikov woke up, he was terrified: did he say anything during the fever? Did anyone suspect him? He had wanted to prove he was extraordinary. But he felt only fear, sickness and a terrible loneliness — as if he had cut himself off from all humanity."],"quotes":[],"words":"<i>axe</i> (a tool with a heavy blade for cutting wood) · <i>pawn</i> (to give an object to get money) · <i>innocent</i> (not guilty of anything) · <i>purse</i> (a small bag for money) · <i>fever</i> (a high body temperature)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["axe","pawn","innocent","purse","fever"],"opts":[["a","a small bag for money"],["b","high body temperature"],["c","a tool for cutting wood"],["d","to give an object to get money"],["e","not guilty"]],"ans":["c","d","e","a","b"]},{"id":"B","title":"B. Grammar: past continuous vs past simple.","instr":"Choose.","type":"choose","items":[{"segs":["While he ",["searched","was searching"]," for the money, he ",["heard","was hearing"]," a noise."],"ans":[["was searching"],["heard"]]},{"segs":["Lizaveta ",["came","was coming"]," home while he ",["was","was being"]," still there."],"ans":[["came"],["was"]]},{"segs":["Two men ",["knocked","were knocking"]," on the door while he ",["hid","was hiding"]," inside."],"ans":[["knocked"],["was hiding"]]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Raskolnikov kill Lizaveta?","model":"Because she came home and saw everything."},{"q":"What did he do with the money?","model":"He hid it under a stone and never used it."},{"q":"How did he feel after the crime?","model":"He felt fear, sickness and terrible loneliness."}]}]},{"title":"Sonia","label":"Part 3","paras":["Before the crime, in a dirty bar, Raskolnikov had met a drunk old man, Marmeladov. Marmeladov told him his sad story. He had lost his job because of drink, and his family was starving. His daughter from his first marriage, Sonia, a quiet girl of eighteen, had been forced to sell herself on the streets to buy food for her stepmother and the little children.","A few days after the crime, Marmeladov was hit by a horse and carriage in the street. Raskolnikov carried him home, where he died. Without thinking, Raskolnikov gave the family all the money he had. There he saw Sonia for the first time. She was thin and pale, with gentle blue eyes.","Raskolnikov was strangely attracted to her. They had both \"stepped over the line,\" he thought — she with her body, he with the axe. One night, he went to her small room. He asked her to read him the story of Lazarus from the Bible — the man Jesus brought back from death. Sonia read with a trembling voice. Raskolnikov watched her. How could she keep her faith and her goodness after so much suffering?","Then he fell on his knees and kissed her foot. Sonia was shocked. \"I did not bow down to you, I bowed down to all the suffering of humanity,\" he said."],"quotes":["<i>\"Pain and suffering are always inevitable for a large intelligence and a deep heart.\"</i> — Raskolnikov"],"words":"<i>starving</i> (very hungry because there is no food) · <i>carriage</i> (a vehicle pulled by horses) · <i>attracted</i> (feeling interest in someone) · <i>faith</i> (strong belief, especially in God) · <i>suffering</i> (great pain, physical or emotional)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>starving, carriage, attracted, faith, suffering</i>.","type":"bank","items":[{"q":"Marmeladov's family had no food. They were ___.","blanks":1,"ans":["starving"]},{"q":"Marmeladov was hit by a horse and ___.","blanks":1,"ans":["carriage"]},{"q":"Raskolnikov was strangely ___ to Sonia.","blanks":1,"ans":["attracted"]},{"q":"Sonia kept her ___ in God.","blanks":1,"ans":["faith"]},{"q":"Raskolnikov bowed down to the ___ of humanity.","blanks":1,"ans":["suffering"]}],"bank":["starving","carriage","attracted","faith","suffering"]},{"id":"B","title":"B. Grammar: relative clauses.","instr":"Complete with <i>who</i>, <i>which</i> or <i>where</i>.","type":"bank","items":[{"q":"Sonia was the girl ___ read him the story of Lazarus.","blanks":1,"ans":["who"]},{"q":"The bar ___ he met Marmeladov was dirty.","blanks":1,"ans":["where"]},{"q":"The money ___ he gave the family was all he had.","blanks":1,"ans":["which"]}],"bank":["who","which","where"]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Raskolnikov met Marmeladov in a bar.","ans":"T","note":""},{"q":"Raskolnikov used the stolen money to help the family.","ans":"F","note":"he gave his own money"},{"q":"Sonia read him a story from the Bible.","ans":"T","note":""}]}]},{"title":"The Detective","label":"Part 4","paras":["The detective in charge of the case was Porfiry Petrovich, a small, fat, friendly man who laughed a lot. But behind his smile, he was very intelligent. He didn't have any real evidence against Raskolnikov. Instead, he played with him like a cat with a mouse.","Porfiry had read an article that Raskolnikov had written for a magazine, about \"extraordinary men\" who can break the law. In their conversations, Porfiry talked about the article, about criminals, about psychology. He never accused Raskolnikov directly, but every word was a trap. Raskolnikov's nerves were destroyed. He knew that Porfiry knew.","At the same time, Raskolnikov's mother and sister arrived in St. Petersburg. Raskolnikov stopped Dounia's marriage to Luzhin, who was a mean and selfish man. Razumikhin fell in love with Dounia. But Raskolnikov couldn't feel happy with his family. He felt that a wall separated him from everyone he loved.","Finally, he told Sonia the truth. \"I wanted to become a Napoleon,\" he said. \"That is why I killed.\" Sonia cried for him, not for herself. \"What have you done — what have you done to yourself?\" she said. She told him that there was only one way: \"Go at once, this very minute, stand at the crossroads, bow down, first kiss the earth which you have defiled, and then bow down to all the world and say to all men aloud, 'I am a murderer!'\""],"quotes":[],"words":"<i>evidence</i> (facts that show something is true) · <i>trap</i> (a trick to catch someone) · <i>nerves</i> (your ability to stay calm) · <i>crossroads</i> (a place where two roads cross) · <i>defile</i> (to make something dirty or impure)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["detective","police","evidence","piano"],"ans":"piano","note":""},{"opts":["trap","trick","game","honesty"],"ans":"honesty","note":""},{"opts":["murder","crime","kill","kiss"],"ans":"kiss","note":""}]},{"id":"B","title":"B. Grammar: reported questions.","instr":"Report the questions.","type":"type","items":[{"q":"Porfiry: \"Did you write the article?\" → Porfiry asked if Raskolnikov ___ the article.","blanks":1,"ans":["had written"]},{"q":"Sonia: \"What have you done?\" → Sonia asked what he ___.","blanks":1,"ans":["had done"]},{"q":"Raskolnikov: \"Am I extraordinary?\" → He wondered if he ___ extraordinary.","blanks":1,"ans":["was"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"How did Porfiry try to catch Raskolnikov?","model":"By talking with him and setting psychological traps, without accusing him directly."},{"q":"Why did Raskolnikov stop Dounia's marriage?","model":"Because Luzhin was a mean, selfish man and Dounia was marrying him only to help her brother."},{"q":"What did Sonia tell Raskolnikov to do?","model":"To kiss the earth, bow down to the world and say aloud that he was a murderer (to confess)."}]}]},{"title":"Punishment and Resurrection","label":"Part 5","paras":["Porfiry visited Raskolnikov one last time. \"I know it was you,\" he said calmly. \"But I'm not going to arrest you yet. Confess. It will be better for you. You are still young. What you need now is fresh air, fresh air, fresh air!\" He gave Raskolnikov a few days.","Raskolnikov walked through the city, unable to decide. He went to the market, kneeled down and kissed the dirty ground, as Sonia had told him. People laughed at him. Then he went to the police station. On the stairs, he almost turned back — but he saw Sonia waiting in the courtyard, looking at him with desperate eyes. He went in and said: \"It was I killed the old pawnbroker woman and her sister Lizaveta with an axe and robbed them.\"","He was sent to prison in Siberia for eight years. Sonia followed him and lived in the town near the prison. She visited him often. At first, Raskolnikov was cold and proud. He still didn't regret his idea; he only regretted that he wasn't strong enough to live with it. The other prisoners hated him, but they loved Sonia.","Then, one spring morning, by the river, Sonia sat next to him. Suddenly, something changed in him. He threw himself at her feet and cried, holding her knees. For the first time, he understood that he loved her. They still had seven years of prison in front of them, but it didn't matter. A new life was beginning — \"the story of the gradual renewal of a man.\""],"quotes":[],"words":"<i>confess</i> (to say that you did something wrong) · <i>kneel / kneeled</i> (to go down on your knees) · <i>regret</i> (to feel sorry about something you did) · <i>resurrection</i> (coming back to life) · <i>renewal</i> (starting again, becoming new)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>confess, kneeled, regret, resurrection, renewal</i>.","type":"bank","items":[{"q":"Porfiry told Raskolnikov to ___.","blanks":1,"ans":["confess"]},{"q":"At the market, he ___ down and kissed the ground.","blanks":1,"ans":["kneeled"]},{"q":"At first, he didn't ___ his idea.","blanks":1,"ans":["regret"]},{"q":"Lazarus's story is about ___.","blanks":1,"ans":["resurrection"]},{"q":"The end of the book is about the ___ of a man.","blanks":1,"ans":["renewal"]}],"bank":["confess","kneeled","regret","resurrection","renewal"]},{"id":"B","title":"B. Grammar: passive.","instr":"Rewrite in the passive.","type":"type","items":[{"q":"They sent him to Siberia. → He ___ to Siberia.","blanks":1,"ans":["was sent"]},{"q":"The prisoners loved Sonia. → Sonia ___ by the prisoners.","blanks":1,"ans":["was loved"]},{"q":"Porfiry didn't arrest him. → He ___ by Porfiry.","blanks":1,"ans":["wasn't arrested"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Can a good result justify a bad action? What do you think?"},{"q":"What is the real \"punishment\" in this book: prison, or something else?"},{"q":"Why do you think Sonia was so important for Raskolnikov?"}]}]}]},{"id":"divine","title":"The Divine Comedy","level":"B1","author":"Dante Alighieri (c. 1320)","color":"#c98a2b","intro":["A B1 prose version of <i>The Divine Comedy</i> by Dante Alighieri (written around 1308–1321), based on the English translation by Henry Wadsworth Longfellow (1867, public domain), in 5 parts. The poem tells the story of an imaginary journey through the three worlds of the afterlife: <i>Inferno</i> (Hell), <i>Purgatorio</i> (Purgatory) and <i>Paradiso</i> (Heaven). Dante himself is the traveler. Each of the three books ends with the same word: <i>stars</i>. The quotes are from Longfellow's translation."],"parts":[{"title":"The Dark Wood","label":"Part 1","paras":["In the year 1300, when he was thirty-five years old — halfway through a normal life — Dante found himself lost in a dark forest. He didn't know how he had got there. He had lost the right path. It was night, and he was very afraid.","At sunrise, he saw a hill with the sun shining on its top, and he started to climb it. But three wild animals blocked his way: a leopard, a lion and a hungry she-wolf. The wolf was the most terrible of all, and it pushed him back down into the darkness.","Then a figure appeared. It was the spirit of Virgil, the great Roman poet whom Dante admired more than anyone. Virgil explained that he had been sent by Beatrice, the woman Dante had loved in his youth, who had died and was now in Heaven. She was worried about Dante and wanted to save him. To escape from the dark forest, Virgil said, Dante had to take another road: a journey through Hell, Purgatory and finally Heaven.","They arrived at a great gate. Above it were written some terrible words. The last line said: \"All hope abandon, ye who enter in!\" Dante was frightened, but Virgil took his hand, and they went in together."],"quotes":["<i>\"Midway upon the journey of our life / I found myself within a forest dark, / For the straightforward pathway had been lost.\"</i>"],"words":"<i>afterlife</i> (life after death, in some religions) · <i>halfway</i> (in the middle) · <i>block</i> (to stop someone from passing) · <i>spirit</i> (the soul of a dead person) · <i>abandon</i> (to leave something completely)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>afterlife, halfway, blocked, spirit, abandon</i>.","type":"bank","items":[{"q":"The poem is a journey through the ___.","blanks":1,"ans":["afterlife"]},{"q":"At thirty-five, Dante was ___ through his life.","blanks":1,"ans":["halfway"]},{"q":"Three wild animals ___ his way.","blanks":1,"ans":["blocked"]},{"q":"Virgil was the ___ of a great Roman poet.","blanks":1,"ans":["spirit"]},{"q":"The gate said: \"All hope ___, ye who enter in!\"","blanks":1,"ans":["abandon"]}],"bank":["afterlife","halfway","blocked","spirit","abandon"]},{"id":"B","title":"B. Grammar: past perfect.","instr":"Complete.","type":"type","items":[{"q":"Dante didn't know how he ___ (get) to the forest.","blanks":1,"ans":["had got"]},{"q":"He ___ (lose) the right path.","blanks":1,"ans":["had lost"]},{"q":"Virgil said Beatrice ___ (send) him.","blanks":1,"ans":["had sent"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Dante was lost in a dark forest.","ans":"T","note":""},{"q":"The three animals helped Dante climb the hill.","ans":"F","note":""},{"q":"Beatrice sent Virgil to help Dante.","ans":"T","note":""}]}]},{"title":"Into Hell","label":"Part 2","paras":["Dante's Hell is a gigantic hole in the earth, like an upside-down cone, with nine circles. The higher circles are for less serious sins; the deeper you go, the worse the sins and the punishments are. In each place, the punishment matches the sin.","First, Dante and Virgil crossed the river Acheron in the boat of Charon, an old man with eyes of fire. In the first circle, Limbo, they found the great men of the ancient world who had lived before Christianity: Homer, Socrates, Plato. They didn't suffer, but they could never see God. This was Virgil's place too.","In the second circle, a violent wind blew the souls of lovers around and around, forever, just as their passion had carried them away in life. There Dante met Francesca, a young woman from Rimini, with her lover, Paolo. They had fallen in love while reading a romantic book together, and Francesca's husband had killed them both. Francesca told her story with such sadness that Dante fainted.","In the next circles, Dante saw the gluttons lying in cold, dirty rain; the greedy pushing heavy rocks against each other; and the angry fighting in a muddy river. He was full of pity, but Virgil reminded him that these punishments were the justice of God."],"quotes":["<i>\"There is no greater sorrow / Than to be mindful of the happy time / In misery.\"</i> — Francesca"],"words":"<i>sin</i> (an action that is wrong in religious law) · <i>circle</i> (a round shape; here, a level of Hell) · <i>passion</i> (a very strong feeling, especially love) · <i>faint</i> (to lose consciousness for a short time) · <i>pity</i> (sadness for someone else's suffering)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["sin","circle","passion","faint","pity"],"opts":[["a","a very strong feeling"],["b","to lose consciousness"],["c","a wrong action in religion"],["d","sadness for someone's suffering"],["e","a round shape; a level"]],"ans":["c","e","a","b","d"]},{"id":"B","title":"B. Grammar: the + comparative, the + comparative.","instr":"Complete.","type":"type","items":[{"q":"The deeper you go, the ___ (bad) the sins are.","blanks":1,"ans":["worse"]},{"q":"The more serious the sin, the ___ (terrible) the punishment.","blanks":1,"ans":["more terrible"]},{"q":"The more Dante listened, the ___ (sad) he felt.","blanks":1,"ans":["sadder"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What is Dante's Hell shaped like?","model":"A gigantic hole like an upside-down cone, with nine circles."},{"q":"Who were the people in Limbo?","model":"Great men of the ancient world who lived before Christianity, like Homer and Plato."},{"q":"How did Francesca and Paolo fall in love?","model":"While reading a romantic book together."}]}]},{"title":"The Bottom of Hell","label":"Part 3","paras":["As they went deeper, Hell became more horrible. They passed a city of fire, a river of boiling blood, a forest where the souls had become trees that cried when someone broke their branches, and a desert of burning sand under a rain of fire.","In the eighth circle, the place of liars and tricksters, Dante met Ulysses, the Greek hero, inside a flame. Ulysses told him about his last voyage. When he was old, he convinced his men to sail beyond the known world, past the end of the Mediterranean. \"Consider ye the seed from which ye sprang,\" he told them. \"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge.\" They sailed for five months — until a storm destroyed their ship near a mysterious mountain.","At the very bottom of Hell, there was no fire. It was ice. Here were the traitors, frozen in a lake. In the center was Lucifer, the fallen angel, a gigantic monster with three faces and six wings. His wings made a cold wind that kept the lake frozen. In his three mouths, he was eating the three worst traitors in history: Judas, who betrayed Jesus, and Brutus and Cassius, who betrayed Julius Caesar.","Virgil told Dante to hold on to his back. Then he climbed down Lucifer's body, through the center of the Earth, and up the other side, along a long, dark tunnel. Finally, they came out into the open air, on the other side of the world."],"quotes":["<i>\"Thence we came forth to rebehold the stars.\"</i> — the last line of <i>Inferno</i>"],"words":"<i>trickster</i> (a person who deceives others) · <i>voyage</i> (a long journey by sea) · <i>virtue</i> (moral goodness) · <i>traitor</i> (a person who betrays their friends or country) · <i>frozen</i> (turned into ice; very cold)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>tricksters, voyage, virtue, traitors, frozen</i>.","type":"bank","items":[{"q":"The eighth circle was for liars and ___.","blanks":1,"ans":["tricksters"]},{"q":"Ulysses told Dante about his last ___.","blanks":1,"ans":["voyage"]},{"q":"\"You were made for ___ and knowledge.\"","blanks":1,"ans":["virtue"]},{"q":"At the bottom of Hell were the ___.","blanks":1,"ans":["traitors"]},{"q":"They were ___ in a lake of ice.","blanks":1,"ans":["frozen"]}],"bank":["tricksters","voyage","virtue","traitors","frozen"]},{"id":"B","title":"B. Grammar: passive (present simple).","instr":"Rewrite in the passive.","type":"type","items":[{"q":"Lucifer's wings keep the lake frozen. → The lake ___ frozen by Lucifer's wings.","blanks":1,"ans":["is kept"]},{"q":"A violent wind blows the lovers. → The lovers ___ by a violent wind.","blanks":1,"ans":["are blown"]},{"q":"Lucifer eats the three traitors. → The three traitors ___ by Lucifer.","blanks":1,"ans":["are eaten"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The bottom of Hell is full of fire.","ans":"F","note":"it is ice"},{"q":"Ulysses sailed beyond the known world.","ans":"T","note":""},{"q":"Dante and Virgil left Hell by climbing over Lucifer's body.","ans":"T","note":""}]}]},{"title":"The Mountain of Purgatory","label":"Part 4","paras":["On the other side of the world, there was an island with a high mountain: Purgatory. Here, the souls were not lost forever. They had repented before they died, and now they had to clean their souls before entering Heaven. Unlike Hell, Purgatory was a place of hope. The souls sang as they climbed.","An angel wrote seven P's on Dante's forehead — P for <i>peccatum</i>, the Latin word for \"sin.\" The mountain had seven terraces, one for each of the seven deadly sins: pride, envy, anger, laziness, greed, gluttony and lust. On each terrace, the souls corrected their sin by doing the opposite. The proud carried enormous stones on their backs, to learn humility. The envious had their eyes closed with wire. At the end of each terrace, an angel removed one P from Dante's forehead, and the climbing became easier.","At the top of the mountain was the Earthly Paradise, the beautiful garden where Adam and Eve had lived. There, in a magnificent procession, Beatrice appeared, dressed in white, green and red. Dante turned to Virgil to share his emotion — but Virgil had disappeared. As a pagan, he could not go into Heaven. Dante cried for his guide.","Beatrice spoke to Dante severely about his mistakes after her death. Dante felt ashamed and cried. Then he drank from two rivers: one made him forget his sins, the other made him remember all the good he had done. Now he was ready."],"quotes":["<i>\"Pure and disposed to mount unto the stars.\"</i> — the last line of <i>Purgatorio</i>"],"words":"<i>repent</i> (to feel sorry for your sins) · <i>forehead</i> (the part of your face above your eyes) · <i>terrace</i> (a flat level on the side of a hill) · <i>humility</i> (the opposite of pride) · <i>procession</i> (a line of people moving in a ceremony)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["pride","envy","anger","humility"],"ans":"humility","note":""},{"opts":["mountain","terrace","hill","river"],"ans":"river","note":""},{"opts":["angel","soul","spirit","stone"],"ans":"stone","note":""}]},{"id":"B","title":"B. Grammar: had to / could.","instr":"Complete with <i>had to</i>, <i>could</i> or <i>couldn't</i>.","type":"bank","items":[{"q":"The souls ___ clean their souls before Heaven.","blanks":1,"ans":["had to"]},{"q":"As a pagan, Virgil ___ go into Heaven.","blanks":1,"ans":["couldn't"]},{"q":"After the rivers, Dante ___ go up to Heaven.","blanks":1,"ans":["could"]}],"bank":["had to","could","couldn't"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"How was Purgatory different from Hell?","model":"It was a place of hope; the souls were not lost forever."},{"q":"What did the seven P's mean?","model":"The seven deadly sins (P for peccatum, \"sin\")."},{"q":"Why did Virgil disappear?","model":"Because, as a pagan, he could not go into Heaven."}]}]},{"title":"Paradise","label":"Part 5","paras":["With Beatrice as his new guide, Dante flew up into the sky. Heaven had nine spheres that turned around the Earth: the Moon, Mercury, Venus, the Sun, Mars, Jupiter, Saturn, the Fixed Stars and the Primum Mobile. In each sphere, Dante met blessed souls who appeared to him as lights. In the Sun, he met wise philosophers and saints, who formed circles of light, dancing and singing. In Mars, the souls of warriors formed a gigantic cross. In Jupiter, the souls of just rulers formed the shape of an eagle.","The higher they went, the brighter the light became, and the more beautiful Beatrice's smile was. Several times, Dante thought he couldn't bear so much light. Everything in Paradise was music, light and love.","Beyond all the spheres was the Empyrean, the true Heaven, outside space and time. Here, all the blessed souls sat together in an enormous white rose. Beatrice went to take her place in it, and a new guide, Saint Bernard, prayed to the Virgin Mary to help Dante see God.","In the final moment, Dante looked into the eternal light. He saw three circles of light, and in one of them, a human face. He tried to understand it, but his mind was not strong enough. Then, in a flash, he understood — and his will and his desire turned in harmony, like a wheel, moved by love. Words cannot describe it. The poem ends there, with the love that moves everything in the universe."],"quotes":["<i>\"The Love which moves the sun and the other stars.\"</i> — the last line of the poem"],"words":"<i>sphere</i> (a round object like a ball) · <i>blessed</i> (holy; living in Heaven) · <i>warrior</i> (a soldier, a fighter) · <i>bear</i> (to accept something difficult) · <i>eternal</i> (lasting forever)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>spheres, blessed, warriors, bear, eternal</i>.","type":"bank","items":[{"q":"Heaven had nine ___ that turned around the Earth.","blanks":1,"ans":["spheres"]},{"q":"Dante met ___ souls who looked like lights.","blanks":1,"ans":["blessed"]},{"q":"In Mars, the ___ formed a cross.","blanks":1,"ans":["warriors"]},{"q":"Dante thought he couldn't ___ so much light.","blanks":1,"ans":["bear"]},{"q":"Finally, he looked into the ___ light.","blanks":1,"ans":["eternal"]}],"bank":["spheres","blessed","warriors","bear","eternal"]},{"id":"B","title":"B. Grammar: the + comparative, the + comparative.","instr":"Complete.","type":"type","items":[{"q":"The higher they went, the ___ (bright) the light became.","blanks":1,"ans":["brighter"]},{"q":"The closer Dante got to God, the ___ (happy) he felt.","blanks":1,"ans":["happier"]},{"q":"The more he looked, the ___ (little) he could describe.","blanks":1,"ans":["less"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"If you wrote your own <i>Inferno</i> today, which \"sins\" would you include?"},{"q":"Why do you think all three books end with the word \"stars\"?"},{"q":"Who would be your guide on a difficult journey? Why?"}]}]}]},{"id":"prince","title":"The Prince","level":"B1–B2","author":"Niccolò Machiavelli (1513)","color":"#1f2a5c","intro":["A B1/B2 version of <i>The Prince</i> by Niccolò Machiavelli (written in 1513), based on the English translation by W. K. Marriott (1908, public domain). It explains the main ideas of the book in 5 parts. The quotes are from Marriott's translation.","Machiavelli was a diplomat in Florence, Italy. In 1512, the powerful Medici family returned to power, and Machiavelli lost his job. He was even arrested and tortured. Living in the countryside, he wrote <i>The Prince</i> as a practical guide for rulers, hoping the Medici would give him a job again. The book became one of the most famous — and most controversial — books about politics ever written. Today, the word <i>Machiavellian</i> describes someone who is clever and dishonest to get what they want."],"parts":[{"title":"How to Get and Keep Power","label":"Part 1","paras":["Machiavelli begins by explaining that there are two kinds of states: republics, which are governed by the people, and principalities, which are governed by one ruler, a prince. In this book, he only talks about principalities.","Some princes inherit their power from their families. For them, keeping power is relatively easy: they just need to follow the traditions of their ancestors and avoid making the people angry. But new princes, who take a state by force or by luck, have a much harder job. People who were treated well by the old ruler will be their enemies, and the people who helped them get power will expect too many rewards.","Machiavelli gives very practical advice. When a prince conquers a new territory, he should go and live there himself, so he can see problems early. If he has to hurt people, he should do it all at once, at the beginning, and not little by little. Benefits, on the other hand, should be given little by little, so people enjoy them more."],"quotes":["<i>\"Injuries ought to be done all at one time, so that, being tasted less, they offend less; benefits ought to be given little by little, so that the flavour of them may last longer.\"</i>"],"words":"<i>rule / ruler</i> (to govern a country / the person who governs) · <i>inherit</i> (to receive something from your family when they die) · <i>ancestor</i> (a family member who lived a long time ago) · <i>conquer</i> (to take a place by force) · <i>reward</i> (something you receive for doing something good)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>inherited, conquered, ancestors, rewards, ruler</i>.","type":"bank","items":[{"q":"A prince is a ___ who governs alone.","blanks":1,"ans":["ruler"]},{"q":"Some princes ___ their power from their fathers.","blanks":1,"ans":["inherited"]},{"q":"They followed the traditions of their ___.","blanks":1,"ans":["ancestors"]},{"q":"The army ___ the city in two days.","blanks":1,"ans":["conquered"]},{"q":"His friends expected big ___ for their help.","blanks":1,"ans":["rewards"]}],"bank":["inherited","conquered","ancestors","rewards","ruler"]},{"id":"B","title":"B. Grammar: should / shouldn't for advice.","instr":"Complete with Machiavelli's advice. Use: <i>should, shouldn't</i>.","type":"bank","items":[{"q":"A new prince ___ live in the territory he conquers.","blanks":1,"ans":["should"]},{"q":"He ___ hurt people little by little.","blanks":1,"ans":["shouldn't"]},{"q":"He ___ give benefits little by little.","blanks":1,"ans":["should"]}],"bank":["should","shouldn't"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What are the two kinds of states?","model":"Republics and principalities."},{"q":"Why is it harder for a new prince to keep power?","model":"Because people loyal to the old ruler will be enemies, and his helpers expect too many rewards."},{"q":"Why should benefits be given little by little?","model":"So that people enjoy them more / longer."}]}]},{"title":"An Army of Your Own","label":"Part 2","paras":["For Machiavelli, the most important foundations of any state are good laws and good armies. And you cannot have good laws without good armies.","In his time, many Italian cities paid foreign soldiers, called mercenaries, to fight for them. Machiavelli hated this system. Mercenaries, he said, are \"disunited, ambitious and without discipline.\" They are brave with friends and cowards with enemies. They are happy to take your money in times of peace, but when war comes, they run away or betray you. According to Machiavelli, this was the main reason why Italy had been invaded and ruined.","The solution, he argued, was simple: a prince must have his own army, made of his own citizens. Citizens fight for their homes and their families, so they are loyal. A wise prince should also never stop thinking about war, even in peacetime. He should train his body by hunting and study history to learn from the victories and mistakes of great leaders of the past."],"quotes":["<i>\"A prince ought to have no other aim or thought, nor select anything else for his study, than war and its rules and discipline.\"</i>"],"words":"<i>foundation</i> (the base that supports something) · <i>mercenary</i> (a soldier who fights for money, not for his country) · <i>betray</i> (to be disloyal to someone who trusts you) · <i>citizen</i> (a person who belongs to a country or city) · <i>loyal</i> (always supporting someone)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["mercenary","betray","loyal","citizen","invade"],"opts":[["a","to enter a country by force"],["b","always supporting someone"],["c","a soldier who fights for money"],["d","a person who belongs to a country"],["e","to be disloyal"]],"ans":["c","e","b","d","a"]},{"id":"B","title":"B. Grammar: defining relative clauses.","instr":"Join the sentences with <i>who</i> or <i>which</i>.","type":"type","items":[{"q":"Mercenaries are soldiers. They fight for money. → ___","blanks":1,"ans":["Mercenaries are soldiers who fight for money"]},{"q":"A prince needs an army. The army is made of his own citizens. → ___","blanks":1,"ans":["A prince needs an army which is made of his own citizens"]},{"q":"He should study leaders. They won great victories. → ___","blanks":1,"ans":["He should study leaders who won great victories"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Machiavelli thought mercenaries were reliable.","ans":"F","note":""},{"q":"He believed citizens are more loyal soldiers.","ans":"T","note":""},{"q":"A prince should think about war only during wars.","ans":"F","note":""}]}]},{"title":"Better to Be Loved or Feared?","label":"Part 3","paras":["In the most famous chapters of the book, Machiavelli talks about the qualities a prince should have. And here he says something shocking for his time: he wants to describe the world as it really is, not as it should be. A man who always tries to be good, he says, will be destroyed among so many people who are not good. So a prince must learn how <i>not</i> to be good, and use this knowledge when necessary.","Should a prince be generous? Not too much, says Machiavelli. A generous prince will spend all his money, then he will have to increase taxes, and the people will hate him. It is better to be seen as a little mean.","Then comes the famous question: is it better to be loved or feared? Ideally, both. But since it's difficult to be both, it is much safer to be feared than loved. People are ungrateful and changeable. They love you when things are going well, but they forget you when you need them. Fear, on the other hand, is maintained by the threat of punishment, and it never fails.","However, there is one important condition: a prince must never be <i>hated</i>. To avoid hatred, he must not take his citizens' property or their women. As Machiavelli writes, men forget the death of their father more quickly than the loss of their inheritance."],"quotes":["<i>\"It is much safer to be feared than loved, when, of the two, either must be dispensed with.\"</i>"],"words":"<i>generous</i> (happy to give money and things to others) · <i>mean</i> (not generous) · <i>ungrateful</i> (not thankful) · <i>threat</i> (a warning that something bad will happen) · <i>punishment</i> (something bad you get because you did something wrong)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Opposites. Match.","type":"match","left":["generous","loved","grateful","safe"],"opts":[["a","dangerous"],["b","ungrateful"],["c","mean"],["d","hated"]],"ans":["c","d","b","a"]},{"id":"B","title":"B. Grammar: it is better to... than to... / it is safer to...","instr":"Complete with your own ideas.","type":"type","items":[{"q":"Machiavelli says it is safer ___ than ___.","blanks":2,"ans":["to be feared","to be loved"]},{"q":"For a prince, it is better ___ than ___.","blanks":2,"ans":["*","*"]},{"q":"In my opinion, for a teacher, it is better ___ than ___.","blanks":2,"ans":["*","*"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why shouldn't a prince be too generous?","model":"Because he will spend all his money, raise taxes and be hated."},{"q":"Why is fear safer than love, according to Machiavelli?","model":"Because people are ungrateful, and fear is kept by the threat of punishment."},{"q":"What must a prince do to avoid being hated?","model":"Not take the citizens' property or their women."}]}]},{"title":"The Fox and the Lion","label":"Part 4","paras":["Should a prince keep his promises? Everyone agrees that it is admirable when a prince is honest. But experience shows, says Machiavelli, that the princes who did great things were the ones who did not care much about keeping their word. They knew how to deceive people, and in the end they won against those who were honest.","There are two ways of fighting: with laws, which is the human way, and with force, which is the way of animals. A prince must know how to use both. And from the animals, he should imitate two: the fox and the lion. The lion cannot protect himself from traps, and the fox cannot defend himself from wolves. So a prince must be a fox to recognize traps, and a lion to frighten wolves.","A wise prince, therefore, should not keep a promise when it goes against his interests. If all men were good, this advice would be wrong. But because they are bad and would not keep their promises to you, you don't have to keep yours to them.","The most important thing is appearance. A prince doesn't need to have all the good qualities — mercy, faithfulness, honesty, religion — but he must <i>seem</i> to have them. Everyone sees what you appear to be; few really know what you are. And in the end, people judge by the results."],"quotes":["<i>\"Every one sees what you appear to be, few really know what you are.\"</i>"],"words":"<i>admirable</i> (deserving respect) · <i>deceive</i> (to make someone believe something false) · <i>imitate</i> (to copy) · <i>appearance</i> (how something or someone looks) · <i>mercy</i> (kindness toward someone you could punish)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>deceive, imitate, appearance, mercy, admirable</i>.","type":"bank","items":[{"q":"It is ___ when a ruler keeps his word.","blanks":1,"ans":["admirable"]},{"q":"A clever prince knows how to ___ people.","blanks":1,"ans":["deceive"]},{"q":"He should ___ the fox and the lion.","blanks":1,"ans":["imitate"]},{"q":"For Machiavelli, ___ is more important than reality.","blanks":1,"ans":["appearance"]},{"q":"A good king sometimes shows ___ to his enemies.","blanks":1,"ans":["mercy"]}],"bank":["deceive","imitate","appearance","mercy","admirable"]},{"id":"B","title":"B. Grammar: second conditional.","instr":"Complete.","type":"type","items":[{"q":"If all men ___ (be) good, this advice would be wrong.","blanks":1,"ans":["were"]},{"q":"If a prince ___ (be) only a lion, he would fall into traps.","blanks":1,"ans":["were"]},{"q":"If I ___ (be) a prince, I ___ (keep / not keep) my promises because ___.","blanks":3,"ans":["were","*","*"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What are the two ways of fighting?","model":"With laws (human) and with force (animal)."},{"q":"Why does a prince need to be both a fox and a lion?","model":"The fox recognizes traps; the lion frightens wolves."},{"q":"Why is appearance so important?","model":"Because people see what you appear to be, and few know what you really are."}]}]},{"title":"Fortune, Advisers and Italy","label":"Part 5","paras":["A prince is also judged by the people around him. The first impression people have of a ruler's intelligence comes from the men he chooses as ministers. A good minister thinks about the prince, not about himself. And a prince must avoid flatterers, people who only say what he wants to hear. The best solution is to choose a few wise men and allow only them to speak the truth, and only when he asks.","But how much control do we really have over our lives? Machiavelli believes that fortune controls about half of our actions, and the other half is controlled by us. He compares fortune to a violent river: when it floods, it destroys everything. But in calm times, people can build dams and canals to prepare for the next flood. Fortune shows its power where nobody has prepared to resist it.","The prince who succeeds is the one who adapts his behavior to the times. And when in doubt, Machiavelli says, it is better to be bold than cautious.","In the last chapter, Machiavelli's tone changes completely. He makes a passionate appeal to the Medici family to unite Italy and free it from the foreign armies that had invaded and divided it. After so much cold analysis, the book ends with a cry of hope and patriotism."],"quotes":["<i>\"Fortune is the arbiter of one-half of our actions, but she still leaves us to direct the other half.\"</i>"],"words":"<i>adviser / minister</i> (a person who gives advice to a leader) · <i>flatterer</i> (a person who says nice things that are not true to please someone) · <i>fortune</i> (luck; things that happen by chance) · <i>flood</i> (when a lot of water covers the land) · <i>bold</i> (brave, ready to take risks)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["bold","brave","daring","cautious"],"ans":"cautious","note":""},{"opts":["adviser","minister","counselor","enemy"],"ans":"enemy","note":""},{"opts":["fortune","luck","chance","plan"],"ans":"plan","note":""}]},{"id":"B","title":"B. Grammar: modal verbs of obligation and advice.","instr":"Choose.","type":"choose","items":[{"segs":["A prince ",["must","mustn't"]," choose wise ministers."],"ans":[["must"]]},{"segs":["He ",["should","shouldn't"]," listen to flatterers."],"ans":[["shouldn't"]]},{"segs":["People ",["have to","don't have to"]," prepare for floods in calm times."],"ans":[["have to"]]}]},{"id":"C","title":"C. Discuss.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Do you think politicians today follow Machiavelli's advice? Give an example."},{"q":"Is it better to be loved or feared — as a boss, a teacher or a parent?"},{"q":"How much of our life is controlled by fortune? Do you agree with \"half and half\"?"}]}]}]},{"id":"origin","title":"On the Origin of Species","level":"B1–B2","author":"Charles Darwin (1859)","color":"#5aa36b","intro":["A B1/B2 version of <i>On the Origin of Species</i> by Charles Darwin (first published in 1859, public domain). It explains the main ideas of the book in 5 parts. The quotes are from Darwin's original text.","In 1831, a young Englishman called Charles Darwin joined a ship, the HMS <i>Beagle</i>, on a five-year voyage around the world. He was only 22. During the trip, he collected thousands of plants, animals and fossils, especially in South America and on the Galápagos Islands. Back in England, he spent more than twenty years thinking about what he had seen before he finally published his theory. At that time, most people believed that every species had been created separately and had never changed. Darwin's book suggested something completely different: that species change slowly over time. It changed science forever."],"parts":[{"title":"Pigeons and Breeders","label":"Part 1","paras":["Darwin doesn't start his book with exotic animals from faraway islands. He starts with something everyone in England knew well: farm animals, garden plants and pigeons.","Darwin himself kept pigeons and became friends with pigeon breeders. He was amazed by how different the breeds were. Some had enormous chests, others had fan-shaped tails, others had strange short beaks. If a scientist found these birds in the wild, he said, he would probably think they were different species. And yet, all of them came from one single wild species: the rock pigeon.","How did this happen? Breeders choose the birds they like best — for example, the ones with the longest tail feathers — and only let those birds have babies. They repeat this for many generations. Each time, the difference is very small, but after many years, the small differences add up and produce a completely new breed. Darwin called this <i>selection</i> by man.","This was the key to his whole theory. If humans can change animals so much in just a few centuries, what could nature do in millions of years?"],"quotes":["<i>\"The key is man's power of accumulative selection: nature gives successive variations; man adds them up in certain directions useful to him.\"</i>"],"words":"<i>breed</i> (n: a type of animal; v: to keep animals to produce babies) · <i>breeder</i> (a person who breeds animals) · <i>species</i> (a group of animals or plants of the same kind) · <i>generation</i> (all the animals born around the same time) · <i>add up</i> (to become bigger little by little)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>breeders, species, generations, add up, breeds</i>.","type":"bank","items":[{"q":"There are hundreds of dog ___, like poodles and bulldogs.","blanks":1,"ans":["breeds"]},{"q":"Pigeon ___ choose the birds they like best.","blanks":1,"ans":["breeders"]},{"q":"Lions and tigers are different ___.","blanks":1,"ans":["species"]},{"q":"Small changes ___ over time.","blanks":1,"ans":["add up"]},{"q":"This happened over many ___.","blanks":1,"ans":["generations"]}],"bank":["breeders","species","generations","add up","breeds"]},{"id":"B","title":"B. Grammar: the passive (present simple and past simple).","instr":"Rewrite in the passive.","type":"type","items":[{"q":"Breeders choose the best birds. → The best birds ___ by breeders.","blanks":1,"ans":["are chosen"]},{"q":"Darwin collected thousands of fossils. → Thousands of fossils ___ by Darwin.","blanks":1,"ans":["were collected"]},{"q":"People keep pigeons all over the world. → Pigeons ___ all over the world.","blanks":1,"ans":["are kept"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Darwin start his book with pigeons?","model":"Because everyone knew pigeons, and they show how much humans can change animals."},{"q":"Which species do all pigeon breeds come from?","model":"The rock pigeon."},{"q":"What question did this lead Darwin to?","model":"If humans can change animals so much in a few centuries, what could nature do in millions of years?"}]}]},{"title":"The Struggle for Existence","label":"Part 2","paras":["Nature looks peaceful: birds singing, trees full of fruit. But Darwin asks us to look again. Many of those singing birds eat insects and seeds, and many of their eggs and babies are eaten by other animals. Behind the beauty, there is a constant fight to survive.","Why? Because living things produce many more babies than can possibly survive. Darwin gives the example of the elephant, the slowest-breeding animal he knew. Even so, he calculated that if all the babies of one pair of elephants survived, after about 750 years there would be nearly nineteen million elephants from that single pair! Of course, this doesn't happen. There is not enough food or space for all of them.","So every year, most young plants and animals die. Some are eaten, some die of hunger or cold, some are killed by disease. Darwin called this the <i>struggle for existence</i>. He explained that he used the expression in a large sense: it's not only about animals fighting. A plant at the edge of a desert is also struggling against the dry weather, and two dogs are struggling for the same piece of food in times of hunger."],"quotes":["<i>\"A struggle for existence inevitably follows from the high rate at which all organic beings tend to increase.\"</i>"],"words":"<i>survive</i> (to continue to live) · <i>struggle</i> (a big effort or fight) · <i>existence</i> (the state of being alive) · <i>disease</i> (an illness) · <i>edge</i> (the outside limit of a place)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["survive","struggle","disease","hunger","edge"],"opts":[["a","an illness"],["b","the feeling of needing food"],["c","the outside limit"],["d","to continue to live"],["e","a big fight or effort"]],"ans":["d","e","a","b","c"]},{"id":"B","title":"B. Grammar: quantifiers (much, many, more, most).","instr":"Choose.","type":"choose","items":[{"segs":["Living things produce ",["much","many"]," more babies than can survive."],"ans":[["many"]]},{"segs":["There isn't ",["much","many"]," food in the desert."],"ans":[["much"]]},{"segs":["",["Most","More"]," young animals die in their first year."],"ans":[["Most"]]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Darwin thought nature was always peaceful.","ans":"F","note":""},{"q":"The elephant example shows how fast animals could multiply.","ans":"T","note":""},{"q":"For Darwin, the struggle for existence is only about animals fighting.","ans":"F","note":""}]}]},{"title":"Natural Selection","label":"Part 3","paras":["Now Darwin puts the two ideas together. First: individuals of the same species are never exactly the same — there are always small differences, or <i>variations</i>. Second: there is a struggle for existence, and most individuals die young.","So who survives? If an animal has a small variation that helps it — slightly longer legs to run from predators, or a color that hides it better — it has a better chance of surviving and having babies. And its babies will often inherit the same useful variation. On the other hand, a variation that is harmful, even a little, will usually disappear.","This is what Darwin called <i>natural selection</i>. It works like the pigeon breeder, but nature is the one choosing. And while a human breeder only looks at the outside of an animal and works for a few years, nature looks at every detail, inside and out, and works for millions of years, all day and every day.","Darwin compared the history of life to a great tree. The green branches at the top are the species living today; the dead branches below are species that are now extinct. All of them grew from the same trunk — which means that all living things are related."],"quotes":["<i>\"This preservation of favourable variations and the rejection of injurious variations, I call Natural Selection.\"</i>"],"words":"<i>variation</i> (a small difference) · <i>predator</i> (an animal that kills and eats other animals) · <i>harmful</i> (bad, causing damage) · <i>extinct</i> (no longer existing) · <i>related</i> (part of the same family)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>extinct, predators, variation, harmful, related</i>.","type":"bank","items":[{"q":"Dinosaurs are ___. There aren't any today.","blanks":1,"ans":["extinct"]},{"q":"Lions and wolves are ___.","blanks":1,"ans":["predators"]},{"q":"Every individual has some small ___.","blanks":1,"ans":["variation"]},{"q":"A ___ variation will usually disappear.","blanks":1,"ans":["harmful"]},{"q":"According to Darwin, all living things are ___.","blanks":1,"ans":["related"]}],"bank":["extinct","predators","variation","harmful","related"]},{"id":"B","title":"B. Grammar: first conditional.","instr":"Complete.","type":"type","items":[{"q":"If an animal ___ (have) a useful variation, it ___ (have) a better chance of surviving.","blanks":2,"ans":["has","will have"]},{"q":"If it ___ (survive), its babies ___ (inherit) the variation.","blanks":2,"ans":["survives","will inherit"]},{"q":"If a variation ___ (be) harmful, it ___ (disappear).","blanks":2,"ans":["is","will disappear"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What two ideas does Darwin put together?","model":"Variation and the struggle for existence."},{"q":"How is nature different from a human breeder?","model":"Nature looks at every detail, inside and out, and works for millions of years."},{"q":"What does the \"tree of life\" show?","model":"That all living things are related and come from the same origin."}]}]},{"title":"Islands Far Away","label":"Part 4","paras":["Some of the strongest evidence for Darwin's theory came from islands, especially the Galápagos, a group of volcanic islands in the Pacific Ocean, about 1,000 kilometers from the coast of South America.","When Darwin visited them, he noticed something strange. Most of the birds, reptiles and plants there didn't exist anywhere else in the world. And yet, they looked very similar to the species of South America, the nearest continent. Why would a creator make island species that looked like their neighbors on the continent, and not like the species of other islands with the same climate? Darwin's answer was simple: a long time ago, some animals and seeds arrived from South America — flying, swimming or floating on wood — and then changed slowly in their new home.","Even more interesting, the species were often different from one island to another, although the islands were very close. Each island had its own food and conditions, so natural selection pushed each population in a different direction. The famous example today is the Galápagos finches, small birds with beaks of different shapes for different foods.","Darwin also noticed what was <i>missing</i> on faraway islands. There were almost no frogs or land mammals, which cannot cross the sea easily. But there were many birds, insects and bats, which can fly there."],"quotes":[],"words":"<i>evidence</i> (facts that show something is true) · <i>coast</i> (the land next to the sea) · <i>neighbor</i> (someone or something that is near) · <i>float</i> (to stay on top of water) · <i>beak</i> (the hard mouth of a bird)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>beaks, evidence, coast, float, neighbors</i>.","type":"bank","items":[{"q":"Wood can ___ on water for a long time.","blanks":1,"ans":["float"]},{"q":"The islands are far from the ___.","blanks":1,"ans":["coast"]},{"q":"The finches have ___ of different shapes.","blanks":1,"ans":["beaks"]},{"q":"Darwin found a lot of ___ for his theory.","blanks":1,"ans":["evidence"]},{"q":"Island species looked like their ___ on the continent.","blanks":1,"ans":["neighbors"]}],"bank":["beaks","evidence","coast","float","neighbors"]},{"id":"B","title":"B. Grammar: although / but / so.","instr":"Join the sentences.","type":"type","items":[{"q":"The islands were very close. The species were different. (although) → ___","blanks":1,"ans":["Although the islands were very close, the species were different"]},{"q":"Frogs can't cross the sea. There are no frogs on far islands. (so) → ___","blanks":1,"ans":["Frogs can't cross the sea, so there are no frogs on far islands"]},{"q":"Bats are mammals. They can fly to islands. (but) → ___","blanks":1,"ans":["Bats are mammals, but they can fly to islands"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Galápagos species look like South American species?","model":"Because their ancestors came from South America."},{"q":"Why were species different from island to island?","model":"Because each island had different food and conditions."},{"q":"Why are there bats but almost no frogs on faraway islands?","model":"Because bats can fly, and frogs can't cross the sea."}]}]},{"title":"Difficulties and the Tangled Bank","label":"Part 5","paras":["Darwin was an honest scientist. He knew his theory had problems, and he dedicated whole chapters to them. How could something as complex as the eye be produced by small, accidental changes? Why don't we find fossils of every step between one species and another?","His answers were careful. About the eye, he showed that in living animals there are many types of eyes, from a simple spot that can only feel light to the complex eye of an eagle. Each small step is useful to the animal that has it, so natural selection could produce a perfect eye little by little. About the fossils, he explained that fossils form only in rare conditions, so the record we have is like a book with most of its pages missing.","In the last pages, Darwin asks the reader to imagine a \"tangled bank\": a piece of land by a river, covered with plants, with birds singing in the bushes, insects flying around and worms moving through the earth. All these different living things depend on each other, and all of them were produced by the same natural laws.","For Darwin, this idea did not make nature less beautiful. On the contrary, he found it magnificent that, from such a simple beginning, so many wonderful forms of life had appeared — and were still appearing."],"quotes":["<i>\"There is grandeur in this view of life.\"</i>"],"words":"<i>complex</i> (with many parts; not simple) · <i>accidental</i> (happening by chance) · <i>fossil</i> (the remains of an old plant or animal in rock) · <i>tangled</i> (twisted together in a messy way) · <i>depend on</i> (to need someone or something)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["complex","complicated","detailed","simple"],"ans":"simple","note":""},{"opts":["accidental","by chance","planned","random"],"ans":"planned","note":""},{"opts":["fossil","bone","remains","bird song"],"ans":"bird song","note":""}]},{"id":"B","title":"B. Grammar: present perfect vs. past simple.","instr":"Choose.","type":"choose","items":[{"segs":["Darwin ",["published","has published"]," his book in 1859."],"ans":[["published"]]},{"segs":["Scientists ",["found","have found"]," millions of fossils since then."],"ans":[["have found"]]},{"segs":["I ",["never read","have never read"]," a science book in English."],"ans":[["have never read"]]}]},{"id":"C","title":"C. Discuss.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Why do you think Darwin's ideas shocked people in 1859?"},{"q":"Does knowing how nature works make it more or less beautiful for you?"},{"q":"Can you think of an animal that is well adapted to where it lives? Describe it."}]}]}]}];
const LEVELS=[['A1–A2','First steps: short, simple stories.'],['A2','Easy English: everyday words, mostly past simple.'],['B1','More detail, longer sentences, more grammar.'],['B1–B2','Big ideas in clear English.']];
const KEY='wdym-books';
let ST={};try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){ST={}}
ST.b=ST.b||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/<[^>]+>/g,'').replace(/\([^)]*\)/g,'').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function bs(id){return ST.b[id]=ST.b[id]||{p:{}}}
function ps(id,i){const b=bs(id);return b.p[i]=b.p[i]||{e:{}}}
function partDone(bk,i){const p=bs(bk.id).p[i];return !!(p&&p.done)}
function doneCount(bk){return bk.parts.filter((_,i)=>partDone(bk,i)).length}
function unlocked(bk,i){return i===0||partDone(bk,i-1)}
function bookOpen(bk){return !bk.opens||today()>=bk.opens}
function show(v){['shelfV','bookV','partV'].forEach(x=>$(x).classList.toggle('hidden',x!==v));window.scrollTo(0,0)}
let CUR=null,CP=0,SKIP=false;
function setHash(h){if(decodeURIComponent(location.hash.slice(1))!==h){SKIP=true;location.hash=h}}

function renderShelf(){
  let h='';
  const last=ST.last&&BOOKS.find(b=>b.id===ST.last);
  if(last&&doneCount(last)<last.parts.length){
    const n=doneCount(last);
    $('cont').innerHTML=`<div class="card" style="background:var(--yellow2)"><p class="sec">Continue reading</p><div class="row" style="justify-content:space-between"><div><b class="fat" style="font-size:1.25rem">${esc(last.title)}</b><div class="note">${n} of ${last.parts.length} parts done</div></div><button class="btn" id="contBtn">${esc(last.parts[n].label)} →</button></div></div>`;
    $('contBtn').onclick=()=>openPart(last,n);
  }else $('cont').innerHTML='';
  for(const [lv,desc] of LEVELS){
    const bks=BOOKS.filter(b=>b.level===lv);if(!bks.length)continue;
    h+=`<div class="lvl"><h2 class="fat">${lv}</h2><span>${desc}</span></div><div class="shelf">`;
    for(const b of bks){
      const n=doneCount(b),t=b.parts.length,op=bookOpen(b);
      const st=!op?`🔒 Opens on ${new Date(b.opens+'T12:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}`:n===t?'✓ Finished!':n?`${n} of ${t} parts done`:`${t} parts`;
      h+=`<button class="bk${op?'':' locked'}" data-id="${b.id}"><div class="sp" style="background:${b.color||'#ebb3e6'}"></div><div><h3>${esc(b.title)}</h3><p>${esc(b.author||'')}</p><div class="st">${st}</div>${op&&n?`<div class="bar"><i style="width:${n/t*100}%"></i></div>`:''}</div></button>`;
    }
    h+='</div>';
  }
  $('shelf').innerHTML=h;
  document.querySelectorAll('.bk').forEach(el=>el.onclick=()=>{const b=BOOKS.find(x=>x.id===el.dataset.id);if(!bookOpen(b)){alertBox(el,'This book opens on January 1, 2027. See you then!');return}openBook(b)});
  show('shelfV');
}
function alertBox(el,msg){const st=el.querySelector('.st');const o=st.textContent;st.textContent=msg;setTimeout(()=>st.textContent=o,2600)}

function openBook(b){
  CUR=b;setHash(b.id);
  $('bT').textContent=b.title;$('bA').textContent=b.author||'';$('bLvl').textContent='Level '+b.level;
  $('bIntro').innerHTML='<p class="sec">About this book</p>'+b.intro.map(p=>`<p style="margin:0 0 10px">${p}</p>`).join('');
  const n=doneCount(b),t=b.parts.length;
  $('bProg').textContent=n===t?'✓ You finished this book!':`${n} of ${t} parts done`;
  $('bBar').style.width=(n/t*100)+'%';
  $('bGo').textContent=n===t?'Read again →':n?`Continue: ${b.parts[n].label} →`:'Start reading →';
  $('bGo').onclick=()=>openPart(b,n===t?0:n);
  $('parts').innerHTML=b.parts.map((p,i)=>{const d=partDone(b,i),u=unlocked(b,i);return `<button class="pt${d?' done':''}${u?'':' lock'}" data-i="${i}"><span class="n">${d?'✓':u?i+1:'🔒'}</span><div><h3>${esc(p.title)}</h3><p>${esc(p.label)}</p></div><span class="s">${d?'Done':u?'Open':'Locked'}</span></button>`}).join('');
  document.querySelectorAll('.pt').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(!unlocked(b,i)){el.querySelector('p').textContent=`Finish the exercises in ${b.parts[i-1].label} first.`;return}openPart(b,i)});
  show('bookV');
}

function openPart(b,i){
  if(!unlocked(b,i))return openBook(b);
  CUR=b;CP=i;ST.last=b.id;save();setHash(b.id+'/'+(i+1));
  const p=b.parts[i];
  $('pBook').textContent=b.title;$('pLbl').textContent=p.label+' of '+b.parts.length;$('pT').textContent=p.title;
  let h=p.paras.map(x=>`<p>${x}</p>`).join('');
  h+=p.quotes.map(q=>`<div class="quote">${q}</div>`).join('');
  if(p.words)h+=`<div class="words"><b>New words:</b> ${p.words}</div>`;
  $('pText').innerHTML=h;
  $('pEx').innerHTML='';
  p.ex.forEach((e,k)=>$('pEx').appendChild(renderEx(b,i,e,k)));
  updEnd();
  show('partV');
}

function exSt(b,i,e){const p=ps(b.id,i);return p.e[e.id]=p.e[e.id]||{v:{}}}
function updEnd(){
  const b=CUR,i=CP,p=b.parts[i],pst=ps(b.id,i);
  const all=p.ex.every(e=>pst.e[e.id]&&pst.e[e.id].done);
  if(all&&!pst.done){pst.done=true;save();}
  const last=i===b.parts.length-1;
  if(all){
    $('pEnd').innerHTML=`<div class="done-box"><p class="fat" style="font-size:1.4rem;margin:0 0 6px">${last?'🎉 You finished the book!':'⭐ Great job! '+esc(b.parts[i+1].label)+' is open.'}</p><div class="row" style="justify-content:center">${last?'<button class="btn" id="endShelf">Choose another book →</button>':'<button class="btn" id="nextP">Read '+esc(b.parts[i+1].label)+' →</button>'}</div></div>`;
    if(last)$('endShelf').onclick=()=>{setHash('');renderShelf()};else $('nextP').onclick=()=>openPart(b,i+1);
  }else{
    const left=p.ex.filter(e=>!(pst.e[e.id]&&pst.e[e.id].done)).map(e=>e.id).join(', ');
    $('pEnd').innerHTML=last?'':`<div class="lockmsg">🔒 ${esc(b.parts[i+1].label)} opens when you finish exercise${left.length>1?'s':''} ${left}.</div>`;
  }
}

function renderEx(b,i,e,k){
  const st=exSt(b,i,e),box=document.createElement('div');box.className='ex';
  box.innerHTML=`<h3>${esc(e.title)}<span class="exst"></span></h3><p class="ins">${e.instr}</p>`;
  const body=document.createElement('div');box.appendChild(body);
  const foot=document.createElement('div');foot.className='row';box.appendChild(foot);
  const mark=()=>{box.querySelector('.exst').innerHTML=st.done?'<span style="color:var(--good)">✓ done</span>':''};
  const finish=()=>{st.done=true;save();mark();updEnd()};
  const checkBtn=(fn,label='Check')=>{const bt=document.createElement('button');bt.className='btn sm';bt.textContent=label;bt.onclick=fn;foot.appendChild(bt);return bt};
  const T=e.type;
  if(T==='bank'||T==='type'){
    if(T==='bank')body.innerHTML=`<div class="bank">${e.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
    const ins=[];
    e.items.forEach((q,n)=>{
      const d=document.createElement('div');d.className='it';
      if(q.example){d.innerHTML=`<span class="num">${n+1}.</span>${q.q} <span class="pill">example</span>`;body.appendChild(d);return}
      let html=q.q,j=0;const mk=()=>{const key=n+'_'+(j++);if(T==='bank')return `<select data-k="${key}"><option value="">…</option>${e.bank.map(w=>`<option>${esc(w)}</option>`).join('')}</select>`;return `<input class="tx${q.q.includes('→')||q.q.replace(/<[^>]+>/g,'').length<14?' wide':''}" data-k="${key}" autocomplete="off" spellcheck="false">`};
      if(/_{3,}/.test(html))html=html.replace(/_{3,}/g,()=>mk());else html=html+' '+mk();
      d.innerHTML=`<span class="num">${n+1}.</span>${html}<span class="fb"></span>`;body.appendChild(d);
      d.querySelectorAll('[data-k]').forEach((el,jj)=>{el.value=st.v[el.dataset.k]||'';el.oninput=el.onchange=()=>{st.v[el.dataset.k]=el.value;el.classList.remove('no','ok');save()};ins.push({el,q,jj,d})});
    });
    checkBtn(()=>{
      let all=true;const msgs=new Map();
      ins.forEach(({el,q,jj,d})=>{
        const want=q.ans?(q.ans.length===q.blanks?[q.ans[jj]]:q.ans):null;
        const v=norm(el.value);let ok=false,rev=false;
        if(!v){all=false;el.classList.add('no');el.classList.remove('ok');return}
        if(!want||want[0]==='*')ok=true;else ok=want.some(w=>w.split(/\s+or\s+|\//).some(a=>norm(a)===v));
        if(!ok&&T==='type'){el.dataset.miss=(+el.dataset.miss||0)+1;if(+el.dataset.miss>=2)rev=true}
        el.classList.toggle('ok',ok);el.classList.toggle('no',!ok);
        if(!ok&&!rev)all=false;
        if(!ok)msgs.set(d,rev?'ans':(msgs.get(d)==='ans'?'ans':'try'));else if(!msgs.has(d))msgs.set(d,'');
      });
      msgs.forEach((m,d)=>{const fb=d.querySelector('.fb'),q=e.items[[...body.querySelectorAll('.it')].indexOf(d)];if(m==='ans'&&q&&q.ans){fb.className='model';fb.innerHTML='Answer: '+esc(q.ans.filter(a=>a!=='*').join(' / '))}else if(m==='try'){fb.className='fb';fb.textContent='Not quite. Check and try again.'}else{fb.className='fb';fb.textContent=''}});
      if(all)finish();
    });
  }
  else if(T==='choose'){
    const groups=[];
    e.items.forEach((q,n)=>{
      const d=document.createElement('div');d.className='it';let g=0;
      d.innerHTML=`<span class="num">${n+1}.</span>`+q.segs.map(s=>{if(typeof s==='string')return s;const gi=g++;return `<span class="grp">${s.map(o=>`<button class="ch" data-g="${n}_${gi}" data-o="${esc(o)}">${esc(o)}</button>`).join('/')}</span>`}).join('');
      body.appendChild(d);
      for(let gi=0;gi<g;gi++)groups.push({key:n+'_'+gi,ans:q.ans[gi]});
    });
    body.querySelectorAll('.ch').forEach(c=>{if(st.v[c.dataset.g]===c.dataset.o)c.classList.add('on');c.onclick=()=>{body.querySelectorAll(`[data-g="${c.dataset.g}"]`).forEach(x=>x.classList.remove('on','right','wrong'));c.classList.add('on');st.v[c.dataset.g]=c.dataset.o;save()}});
    checkBtn(()=>{let all=true;groups.forEach(g=>{const v=st.v[g.key];const el=body.querySelector(`[data-g="${g.key}"].on`);const ok=v&&g.ans.includes(v);if(el){el.classList.toggle('right',ok);el.classList.toggle('wrong',!ok)}if(!ok)all=false});if(all)finish()});
  }
  else if(T==='tf'){
    e.items.forEach((q,n)=>{
      const d=document.createElement('div');d.className='it';
      d.innerHTML=`<span class="num">${n+1}.</span>${q.q}<span class="tf"><button class="ch" data-v="T">True</button><button class="ch" data-v="F">False</button></span><span class="fb"></span>`;
      body.appendChild(d);
      const fb=d.querySelector('.fb');
      const set=(v,silent)=>{d.querySelectorAll('.ch').forEach(x=>x.classList.remove('right','wrong','on'));const el=d.querySelector(`[data-v="${v}"]`);const ok=v===q.ans;el.classList.add(ok?'right':'wrong');fb.className=ok?'fb g':'fb';fb.textContent=ok?(q.note?'✓ '+q.note:'✓'):'Try again!';};
      if(st.v[n])set(st.v[n],1);
      d.querySelectorAll('.ch').forEach(c=>c.onclick=()=>{st.v[n]=c.dataset.v;save();set(c.dataset.v);if(e.items.every((q,m)=>st.v[m]===q.ans))finish()});
    });
  }
  else if(T==='match'){
    e.left.forEach((w,n)=>{
      const d=document.createElement('div');d.className='it';
      d.innerHTML=`<span class="num">${n+1}.</span><b>${esc(w)}</b> → <select data-k="${n}"><option value="">…</option>${e.opts.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select>`;
      body.appendChild(d);
      const s=d.querySelector('select');s.value=st.v[n]||'';s.onchange=()=>{st.v[n]=s.value;s.classList.remove('ok','no');save()};
    });
    checkBtn(()=>{let all=true;body.querySelectorAll('select').forEach(s=>{const ok=s.value===e.ans[+s.dataset.k];s.classList.toggle('ok',ok);s.classList.toggle('no',!ok);if(!ok)all=false});if(all)finish()});
  }
  else if(T==='odd'){
    e.items.forEach((q,n)=>{
      const d=document.createElement('div');d.className='it';
      d.innerHTML=`<span class="num">${n+1}.</span>`+q.opts.map(o=>`<button class="ch" data-o="${esc(o)}">${esc(o)}</button>`).join(' ')+'<span class="fb"></span>';
      body.appendChild(d);const fb=d.querySelector('.fb');
      const set=v=>{d.querySelectorAll('.ch').forEach(x=>x.classList.remove('right','wrong'));const el=[...d.querySelectorAll('.ch')].find(x=>x.dataset.o===v);if(!el)return;const ok=v===q.ans;el.classList.add(ok?'right':'wrong');fb.className=ok?'fb g':'fb';fb.textContent=ok?(q.note?'✓ '+q.note:'✓'):'Try again!'};
      if(st.v[n])set(st.v[n]);
      d.querySelectorAll('.ch').forEach(c=>c.onclick=()=>{st.v[n]=c.dataset.o;save();set(c.dataset.o);if(e.items.every((q,m)=>st.v[m]===q.ans))finish()});
    });
  }
  else{ // open
    e.items.forEach((q,n)=>{
      const d=document.createElement('div');d.className='it';d.style.lineHeight='1.5';
      d.innerHTML=`<span class="num">${n+1}.</span>${q.q}<textarea data-k="${n}" placeholder="Write your answer in English…"></textarea><span class="fb"></span>`;
      body.appendChild(d);
      const ta=d.querySelector('textarea');ta.value=st.v[n]||'';ta.oninput=()=>{st.v[n]=ta.value;save()};
      if(st.done&&q.model){const fb=d.querySelector('.fb');fb.className='model';fb.innerHTML='Possible answer: '+esc(q.model)}
    });
    checkBtn(()=>{let all=true;body.querySelectorAll('.it').forEach((d,n)=>{const q=e.items[n],v=(st.v[n]||'').trim(),fb=d.querySelector('.fb');if(v.split(/\s+/).filter(Boolean).length<2){all=false;fb.className='fb';fb.textContent='Write a little more (at least two words).'}else if(q.model){fb.className='model';fb.innerHTML='Possible answer: '+esc(q.model)}else{fb.className='fb g';fb.textContent='✓ Thanks! There are many possible answers.'}});if(all)finish()},'Done');
  }
  mark();
  return box;
}

<!-- wdym daily tracker -->
<script>
(function(){
  var K='wdym-daily',page=(location.pathname.split('/').pop()||'index.html').toLowerCase(),last=0,act=0;
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function poke(){last=Date.now()}
  ['pointerdown','keydown','touchstart','wheel'].forEach(function(e){addEventListener(e,poke,{passive:true,capture:true})});
  setInterval(function(){
    if(document.hidden||Date.now()-last>45000) return;
    act+=5;
    try{
      var s=JSON.parse(localStorage.getItem(K)||'{}'),d=today();s.days=s.days||{};
      var r=s.days[d]=s.days[d]||{};
      r[page]=(r[page]||0)+5;
      var ks=Object.keys(s.days).sort();while(ks.length>60){delete s.days[ks.shift()]}
      localStorage.setItem(K,JSON.stringify(s));
    }catch(e){}
  },5000);
})();
</script>
