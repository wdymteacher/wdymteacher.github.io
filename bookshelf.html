.","blanks":1,"ans":["peacefully"]},{"q":"Professor Bhaer proposed under his ___.","blanks":1,"ans":["umbrella"]},{"q":"The family met for the apple ___.","blanks":1,"ans":["harvest"]},{"q":"Jo's life was different from her ___ dreams.","blanks":1,"ans":["childhood"]},{"q":"After Amy married, Jo felt ___.","blanks":1,"ans":["lonely"]}],"bank":["peacefully","umbrella","harvest","childhood","lonely"]},{"id":"B","title":"B. Grammar: passive with \"left / given\".","instr":"Rewrite in the passive.","type":"type","items":[{"q":"Aunt March left Plumfield to Jo. → Plumfield ___ to Jo.","blanks":1,"ans":["was left"]},{"q":"They turned the house into a school. → The house ___ into a school.","blanks":1,"ans":["was turned"]},{"q":"Mr. Laurence gave Beth a piano. → Beth ___ a piano.","blanks":1,"ans":["was given"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Which sister are you most like: Meg, Jo, Beth or Amy? Why?"},{"q":"Should Jo have married Laurie? Why or why not?"},{"q":"What does \"growing up\" mean for the March sisters?"}]}]}]},{"id":"pride","title":"Pride and Prejudice","level":"B1","author":"Jane Austen (1813)","color":"#ebb3e6","intro":["A B1 version of <i>Pride and Prejudice</i> by Jane Austen (1813, public domain), in 5 parts. The story happens in the English countryside around 1800, when a good marriage was the most important thing in a young woman's life. The quotes are from Austen's original text.","<b>Who's who</b><br>• <b>Elizabeth (Lizzy) Bennet</b> — the second of five sisters; intelligent and quick to judge<br>• <b>Jane Bennet</b> — the oldest sister; kind and beautiful<br>• <b>Mr. and Mrs. Bennet</b> — their parents; she wants her daughters married, he prefers his books<br>• <b>Mr. Darcy</b> — a very rich, proud young man<br>• <b>Mr. Bingley</b> — Darcy's friend; cheerful and friendly<br>• <b>Mr. Wickham</b> — a charming soldier"],"parts":[{"title":"A Rich Young Man Arrives","label":"Part 1","paras":["Mrs. Bennet had one big worry in life: she had five daughters, and none of them was married. The family wasn't poor, but when Mr. Bennet died, the house would go to a male cousin, and the girls would have almost nothing. So when she heard that a rich young man, Mr. Bingley, had rented a big house near their village, she was very excited. \"A single man of large fortune,\" she told her husband. \"What a fine thing for our girls!\"","Soon there was a ball in the village, and Mr. Bingley came with his sisters and his friend, Mr. Darcy. Bingley was friendly and danced every dance. He danced twice with Jane, the oldest Bennet sister, and everyone could see that he liked her very much.","Mr. Darcy was even richer than Bingley — and much more handsome. But he was cold and proud. He danced only with Bingley's sisters and refused to speak to anyone else. Bingley tried to convince him to dance with Elizabeth, but Darcy looked at her and said, loud enough for her to hear: \"She is tolerable, but not handsome enough to tempt me.\"","Elizabeth laughed about it with her friends, but she didn't forget it. From that night, everyone in the village decided that Mr. Darcy was the most disagreeable man in the world."],"quotes":["<i>\"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.\"</i>"],"words":"<i>fortune</i> (a large amount of money) · <i>ball</i> (a big formal party with dancing) · <i>proud</i> (thinking you are better than other people) · <i>tolerable</i> (OK, but not very good) · <i>disagreeable</i> (unpleasant, not friendly)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>fortune, ball, proud, tolerable, disagreeable</i>.","type":"bank","items":[{"q":"Mr. Bingley was rich. He had a large ___.","blanks":1,"ans":["fortune"]},{"q":"There was a ___ in the village with music and dancing.","blanks":1,"ans":["ball"]},{"q":"Darcy thought he was better than everyone. He was very ___.","blanks":1,"ans":["proud"]},{"q":"Darcy said Elizabeth was only ___, not beautiful.","blanks":1,"ans":["tolerable"]},{"q":"Everyone decided Darcy was the most ___ man in the world.","blanks":1,"ans":["disagreeable"]}],"bank":["fortune","ball","proud","tolerable","disagreeable"]},{"id":"B","title":"B. Grammar: comparatives and superlatives.","instr":"Complete with the right form.","type":"type","items":[{"q":"Darcy was (rich) ___ than Bingley.","blanks":1,"ans":["richer"]},{"q":"Jane was the (old) ___ of the five sisters.","blanks":1,"ans":["oldest"]},{"q":"Bingley was (friendly) ___ than Darcy.","blanks":1,"ans":["friendlier / more friendly"]},{"q":"Darcy was the (disagreeable) ___ man in the village.","blanks":1,"ans":["most disagreeable"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Mrs. Bennet wanted her daughters to get married.","ans":"T","note":""},{"q":"Bingley danced twice with Elizabeth.","ans":"F","note":"he danced with Jane"},{"q":"Elizabeth heard what Darcy said about her.","ans":"T","note":""}]}]},{"title":"First Impressions","label":"Part 2","paras":["Jane and Bingley saw each other often, and they were clearly falling in love. Meanwhile, something strange was happening to Mr. Darcy. The more he looked at Elizabeth, the more he liked her. He noticed her beautiful dark eyes and her intelligent conversation. She was not afraid of him, and she was not trying to please him — which was new for Darcy. But Elizabeth had no idea. For her, he was still the proud man from the ball.","Then a new person arrived: Mr. Wickham, a young soldier. He was handsome, charming and easy to talk to, and Elizabeth liked him immediately. Wickham told her a sad story. He had grown up with Darcy, he said, because his father worked for Darcy's family. Darcy's father had promised Wickham a good job in the church, but after the old man died, Darcy had refused to give it to him, out of jealousy. Elizabeth believed every word. Now she had a real reason to hate Darcy.","There were other problems too. Mr. Collins, the cousin who would inherit the Bennets' house, came to visit. He was a silly, boring clergyman, and he asked Elizabeth to marry him. She said no, and her mother was furious. A few days later, Collins married Elizabeth's best friend, Charlotte Lucas, who wanted a comfortable home more than love.","And then the worst news: Bingley suddenly left for London, with his sisters and Darcy. He didn't come back. Jane was heartbroken, and Elizabeth suspected that Bingley's sisters and Darcy had separated him from Jane."],"quotes":[],"words":"<i>impression</i> (the opinion you have when you meet someone for the first time) · <i>charming</i> (very pleasant and attractive) · <i>jealousy</i> (the feeling of wanting what someone else has) · <i>clergyman</i> (a priest in the Church of England) · <i>heartbroken</i> (extremely sad because of love)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["charming","impression","heartbroken","jealousy","suspect"],"opts":[["a","very sad because of love"],["b","to think something bad is probably true"],["c","very pleasant and attractive"],["d","the opinion you have at first"],["e","wanting what someone else has"]],"ans":["c","d","a","e","b"]},{"id":"B","title":"B. Grammar: past perfect.","instr":"Complete with the past perfect.","type":"type","items":[{"q":"Wickham said he ___ (grow up) with Darcy.","blanks":1,"ans":["had grown up"]},{"q":"Darcy's father ___ (promise) Wickham a job.","blanks":1,"ans":["had promised"]},{"q":"Elizabeth thought Darcy ___ (separate) Bingley from Jane.","blanks":1,"ans":["had separated"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Darcy start to like Elizabeth?","model":"Because of her beautiful eyes and intelligent conversation, and because she wasn't afraid of him."},{"q":"What story did Wickham tell Elizabeth?","model":"That Darcy had refused him the job his father had promised."},{"q":"Why did Charlotte marry Mr. Collins?","model":"Because she wanted a comfortable home."}]}]},{"title":"A Surprising Proposal","label":"Part 3","paras":["In the spring, Elizabeth went to visit Charlotte and Mr. Collins in their new home. Near their house lived Lady Catherine de Bourgh, a rich and very bossy woman — and Darcy's aunt. By chance, Darcy was visiting her at the same time. He came to see Elizabeth often, but he didn't say much. She didn't understand why.","Then she learned something terrible. A friend of Darcy's told her, proudly, that Darcy had recently saved Bingley from a very bad marriage. Elizabeth knew he was talking about Jane. She was so angry that she cried.","That same evening, Darcy came to see her alone. He walked around the room nervously. Then he said: \"In vain have I struggled. It will not do. My feelings will not be repressed. You must allow me to tell you how ardently I admire and love you.\" Elizabeth was shocked. But Darcy continued, and he explained that he loved her <i>against</i> his own will, because her family was so inferior to his.","Elizabeth refused him angrily. \"You are the last man in the world whom I could ever be prevailed on to marry,\" she said. She accused him of destroying Jane's happiness and of treating Wickham cruelly. Darcy became pale and left the room."],"quotes":["<i>\"In vain have I struggled. It will not do. My feelings will not be repressed. You must allow me to tell you how ardently I admire and love you.\"</i>"],"words":"<i>proposal</i> (when someone asks you to marry them) · <i>bossy</i> (always telling people what to do) · <i>in vain</i> (without success) · <i>inferior</i> (worse or less important) · <i>accuse</i> (to say that someone did something wrong)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>proposal, bossy, inferior, accused, in vain</i>.","type":"bank","items":[{"q":"Lady Catherine always told people what to do. She was very ___.","blanks":1,"ans":["bossy"]},{"q":"Darcy tried not to love her, but ___.","blanks":1,"ans":["in vain"]},{"q":"He thought her family was ___ to his.","blanks":1,"ans":["inferior"]},{"q":"Elizabeth ___ him of destroying Jane's happiness.","blanks":1,"ans":["accused"]},{"q":"Elizabeth was shocked by Darcy's ___.","blanks":1,"ans":["proposal"]}],"bank":["proposal","bossy","inferior","accused","in vain"]},{"id":"B","title":"B. Grammar: reported speech.","instr":"Report what they said.","type":"type","items":[{"q":"Darcy: \"I love you.\" → Darcy said that he ___ her.","blanks":1,"ans":["loved"]},{"q":"Elizabeth: \"I will never marry you.\" → Elizabeth said that she ___ him.","blanks":1,"ans":["would never marry"]},{"q":"Elizabeth: \"You destroyed my sister's happiness.\" → She said that he ___ her sister's happiness.","blanks":1,"ans":["had destroyed"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Darcy was Lady Catherine's nephew.","ans":"T","note":""},{"q":"Elizabeth was happy when Darcy proposed.","ans":"F","note":""},{"q":"Darcy said her family was inferior to his.","ans":"T","note":""}]}]},{"title":"The Letter and Pemberley","label":"Part 4","paras":["The next morning, Darcy gave Elizabeth a long letter. In it, he answered her accusations. About Jane, he admitted that he had separated Bingley from her. Jane always seemed calm and polite, and he honestly believed she didn't love his friend. Also, the Bennet family often behaved badly in public — especially Mrs. Bennet and the two youngest sisters, Kitty and Lydia.","About Wickham, the letter told a very different story. Darcy had given Wickham a lot of money instead of the job in the church. Wickham had spent it all on gambling. Then he had tried to run away with Darcy's fifteen-year-old sister, Georgiana, to get her fortune.","Elizabeth read the letter again and again. Slowly, she understood that it was true. She had believed Wickham because he was charming, and she had hated Darcy because he had hurt her pride. \"Till this moment, I never knew myself,\" she thought. She, who was so proud of her intelligence, had been completely blind.","In the summer, Elizabeth traveled with her aunt and uncle, the Gardiners. They visited Pemberley, Darcy's beautiful house, because they thought he was away. But Darcy arrived unexpectedly. To Elizabeth's surprise, he was a different man: polite, warm and kind to her aunt and uncle. His servants said he was the best master in the world. Elizabeth began to feel something new for him."],"quotes":[],"words":"<i>accusation</i> (a statement that someone did something wrong) · <i>admit</i> (to say that something bad is true) · <i>gambling</i> (playing games for money) · <i>pride</i> (a good opinion of yourself) · <i>unexpectedly</i> (in a way that surprises you)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["polite","warm","kind","cruel"],"ans":"cruel","note":""},{"opts":["letter","note","message","ball"],"ans":"ball","note":""},{"opts":["pride","vanity","arrogance","humility"],"ans":"humility","note":""}]},{"id":"B","title":"B. Grammar: third conditional.","instr":"Complete.","type":"type","items":[{"q":"If Elizabeth hadn't read the letter, she ___ (not know) the truth.","blanks":1,"ans":["wouldn't have known"]},{"q":"If Darcy ___ (not stop) Wickham, Georgiana would have married him.","blanks":1,"ans":["hadn't stopped"]},{"q":"If the Gardiners had known Darcy was at home, they ___ (not visit) Pemberley.","blanks":1,"ans":["wouldn't have visited"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Darcy separate Bingley from Jane?","model":"Because he believed Jane didn't love Bingley (and the Bennet family behaved badly)."},{"q":"What did Wickham try to do with Georgiana?","model":"He tried to run away with her to get her fortune."},{"q":"How was Darcy different at Pemberley?","model":"He was polite, warm and kind."}]}]},{"title":"Lydia, Lady Catherine and a Happy Ending","label":"Part 5","paras":["At Pemberley, Elizabeth received terrible news. Her sister Lydia, who was only sixteen, had run away with Wickham. They weren't married. In those days, this was a huge scandal: it could destroy the reputation of the whole family, and no respectable man would marry the other sisters. Elizabeth told Darcy everything, and she thought she would never see him again.","But then, to everyone's surprise, Lydia and Wickham got married. Elizabeth later discovered the truth: Darcy had found them in London and paid Wickham's debts so that he would marry Lydia. He had done it secretly, for Elizabeth.","Soon after, Bingley returned and asked Jane to marry him. Then Lady Catherine arrived at the Bennets' house, furious. She had heard a rumor that Darcy wanted to marry Elizabeth. \"Promise me you will never accept him!\" she ordered. Elizabeth refused to promise anything.","When Darcy heard about this, he had hope again. He came to see Elizabeth, and they went for a long walk. \"My affections and wishes are unchanged,\" he said. This time, Elizabeth told him that her feelings were very different now. They both admitted their mistakes: he had been too proud, and she had judged too quickly. Jane married Bingley, Elizabeth married Darcy, and Mrs. Bennet was the happiest mother in England."],"quotes":[],"words":"<i>scandal</i> (something that shocks people and damages a reputation) · <i>reputation</i> (the opinion people have about someone) · <i>debt</i> (money that you owe) · <i>rumor</i> (a story that may not be true) · <i>judge</i> (to form an opinion about someone)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>scandal, reputation, debts, rumor, judged</i>.","type":"bank","items":[{"q":"Lydia's escape was a big ___.","blanks":1,"ans":["scandal"]},{"q":"It could destroy the family's ___.","blanks":1,"ans":["reputation"]},{"q":"Darcy paid Wickham's ___.","blanks":1,"ans":["debts"]},{"q":"Lady Catherine heard a ___ about Darcy and Elizabeth.","blanks":1,"ans":["rumor"]},{"q":"Elizabeth admitted that she had ___ Darcy too quickly.","blanks":1,"ans":["judged"]}],"bank":["scandal","reputation","debts","rumor","judged"]},{"id":"B","title":"B. Grammar: passive.","instr":"Choose the right form.","type":"choose","items":[{"segs":["Wickham's debts ",["paid","were paid"]," by Darcy."],"ans":[["were paid"]]},{"segs":["Lady Catherine ",["heard","was heard"]," a rumor."],"ans":[["heard"]]},{"segs":["Elizabeth ",["asked","was asked"]," to promise something."],"ans":[["was asked"]]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Who is more to blame: Darcy (pride) or Elizabeth (prejudice)? Why?"},{"q":"Have you ever had a wrong first impression of someone?"},{"q":"How is marriage different today from Jane Austen's time?"}]}]}]},{"id":"sense","title":"Sense and Sensibility","level":"B1","author":"Jane Austen (1811)","color":"#c9a7e3","intro":["A B1 version of <i>Sense and Sensibility</i>, Jane Austen's first novel (1811, public domain), in 5 parts. It is the story of two sisters: Elinor, who has <i>sense</i> (she thinks carefully and controls her feelings), and Marianne, who has <i>sensibility</i> (she feels everything strongly and shows it).","<b>Who's who</b><br>• <b>Elinor Dashwood</b> — 19, the older sister; calm and sensible<br>• <b>Marianne Dashwood</b> — 16, the romantic sister<br>• <b>Mrs. Dashwood</b> — their mother<br>• <b>Edward Ferrars</b> — a shy, kind young man; Elinor loves him<br>• <b>John Willoughby</b> — a handsome, exciting young man<br>• <b>Colonel Brandon</b> — a quiet, serious man of 35<br>• <b>Lucy Steele</b> — a young woman with a secret"],"parts":[{"title":"A New Home","label":"Part 1","paras":["When Mr. Dashwood died, the law said that his big house, Norland Park, had to go to his son from his first marriage, John. Before he died, Mr. Dashwood asked John to take care of his second wife and their three daughters, Elinor, Marianne and Margaret. John promised. But his wife, Fanny, was selfish and greedy, and she convinced him to give them almost nothing.","Life at Norland became uncomfortable. The only good thing was Fanny's brother, Edward Ferrars, who came to stay. Edward was shy and not very handsome, but he was kind, honest and intelligent. He and Elinor spent a lot of time together, and they started to fall in love. Marianne didn't understand it. \"He reads poetry with no feeling at all!\" she said. \"I could never love a man like that.\"","Fanny noticed the romance and didn't like it. Edward's mother was very rich, and she wanted him to marry a rich, important woman — not a poor Dashwood girl. Fanny made this very clear to Mrs. Dashwood.","So the Dashwood women decided to leave. A cousin, Sir John Middleton, offered them a small house, Barton Cottage, in Devonshire, far away. Elinor was sad to say goodbye to Edward, but, as always, she hid her feelings. Marianne, on the other hand, cried loudly as she said goodbye to every tree at Norland."],"quotes":[],"words":"<i>sense</i> (good judgment; thinking carefully) · <i>sensibility</i> (the ability to feel emotions strongly) · <i>greedy</i> (always wanting more money or things) · <i>selfish</i> (thinking only about yourself) · <i>cottage</i> (a small house in the countryside)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>greedy, selfish, cottage, sense, sensibility</i>.","type":"bank","items":[{"q":"Fanny only thought about herself. She was ___.","blanks":1,"ans":["selfish"]},{"q":"She always wanted more money. She was ___.","blanks":1,"ans":["greedy"]},{"q":"The family moved to a small ___ in Devonshire.","blanks":1,"ans":["cottage"]},{"q":"Elinor thinks carefully. She has ___.","blanks":1,"ans":["sense"]},{"q":"Marianne feels everything strongly. She has ___.","blanks":1,"ans":["sensibility"]}],"bank":["greedy","selfish","cottage","sense","sensibility"]},{"id":"B","title":"B. Grammar: had to / didn't have to.","instr":"Complete.","type":"type","items":[{"q":"By law, the house ___ go to John.","blanks":1,"ans":["had to"]},{"q":"The Dashwood women ___ find a new home.","blanks":1,"ans":["had to"]},{"q":"John ___ give them money, so he gave them almost nothing.","blanks":1,"ans":["didn't have to"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"John gave his sisters a lot of money.","ans":"F","note":""},{"q":"Marianne thought Edward was very romantic.","ans":"F","note":""},{"q":"Elinor showed her feelings when she left Norland.","ans":"F","note":""}]}]},{"title":"Willoughby","label":"Part 2","paras":["At Barton, the Dashwoods met their new neighbors. Sir John Middleton was cheerful and loved parties. His friend, Colonel Brandon, was quiet and serious. He was thirty-five, and he fell in love with Marianne the first time he heard her play the piano. But for Marianne, a man of thirty-five was old. \"He talks about flannel waistcoats!\" she laughed.","One rainy day, Marianne was running down a hill when she fell and hurt her ankle. Suddenly, a handsome young man appeared, picked her up in his arms and carried her home. His name was John Willoughby. He was everything Marianne dreamed of: young, romantic and passionate. He loved the same poets and the same music as she did.","Willoughby visited every day. He and Marianne read poems together, danced and went for long rides. Marianne didn't hide her feelings at all. Everyone thought they were engaged. Elinor was worried. \"You should be more careful,\" she told her sister. But Marianne thought it was wrong to hide true love.","Then, one morning, Willoughby came to say goodbye. He had to go to London, he said, and he didn't know when he would come back. He looked strange and uncomfortable. He didn't say anything about marriage. Marianne cried for days."],"quotes":["<i>\"The more I know of the world, the more am I convinced that I shall never see a man whom I can really love.\"</i> — Marianne"],"words":"<i>cheerful</i> (happy and positive) · <i>ankle</i> (the part between your foot and your leg) · <i>passionate</i> (with very strong feelings) · <i>engaged</i> (having promised to marry) · <i>convinced</i> (completely sure)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["cheerful","passionate","ankle","convinced","engaged"],"opts":[["a","completely sure"],["b","having promised to marry"],["c","happy and positive"],["d","with very strong feelings"],["e","the part between your foot and leg"]],"ans":["c","d","e","a","b"]},{"id":"B","title":"B. Grammar: past simple vs past continuous.","instr":"Choose.","type":"choose","items":[{"segs":["Marianne ",["ran","was running"]," down a hill when she ",["fell","was falling"],"."],"ans":[["was running"],["fell"]]},{"segs":["Willoughby ",["walked","was walking"]," nearby when he ",["saw","was seeing"]," her."],"ans":[["was walking"],["saw"]]},{"segs":["While they ",["read","were reading"]," poems, Elinor ",["worried","was worrying"],"."],"ans":[["were reading"],["worried"]]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why didn't Marianne like Colonel Brandon?","model":"Because he was thirty-five, and she thought he was old."},{"q":"How did Marianne meet Willoughby?","model":"She fell and hurt her ankle, and he carried her home."},{"q":"Why was Elinor worried about Marianne?","model":"Because Marianne showed her feelings and everyone thought they were engaged."}]}]},{"title":"Secrets","label":"Part 3","paras":["Two young women came to stay with the Middletons: the Steele sisters. The younger one, Lucy, was pretty and sweet, but not very well educated. One day, she asked Elinor to walk with her. \"Can I tell you a secret?\" she said. \"I've been engaged to Edward Ferrars for four years.\"","Elinor felt as if the ground was moving under her feet. Lucy showed her a small picture of Edward and a letter in his handwriting. It was true. Edward had met Lucy when he was very young, and they had promised to marry. Nobody knew, because Edward's mother would never accept a poor girl like Lucy. Elinor understood: Lucy suspected her feelings for Edward, and she was telling her the secret to warn her.","Elinor had promised to keep the secret. So she said nothing to her mother or her sisters. She smiled, she talked politely, and she suffered in silence. Nobody knew what she was feeling.","In the winter, the two sisters went to London with Mrs. Jennings, Sir John's mother-in-law. Marianne was excited: she was sure she would see Willoughby there. She wrote him letter after letter. He didn't answer."],"quotes":[],"words":"<i>secret</i> (something you don't tell other people) · <i>handwriting</i> (the way someone writes with a pen) · <i>suspect</i> (to think something is probably true) · <i>warn</i> (to tell someone about a possible problem) · <i>suffer</i> (to feel pain or sadness)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>secret, handwriting, warn, suffered, suspected</i>.","type":"bank","items":[{"q":"Lucy told Elinor a big ___.","blanks":1,"ans":["secret"]},{"q":"The letter was in Edward's ___.","blanks":1,"ans":["handwriting"]},{"q":"Lucy ___ that Elinor loved Edward.","blanks":1,"ans":["suspected"]},{"q":"She wanted to ___ Elinor to stay away from him.","blanks":1,"ans":["warn"]},{"q":"Elinor ___ in silence.","blanks":1,"ans":["suffered"]}],"bank":["secret","handwriting","warn","suffered","suspected"]},{"id":"B","title":"B. Grammar: present perfect simple and continuous.","instr":"Complete.","type":"type","items":[{"q":"\"I ___ (be) engaged to Edward for four years,\" said Lucy.","blanks":1,"ans":["have been"]},{"q":"Marianne ___ (write) letters to Willoughby all week.","blanks":1,"ans":["has been writing"]},{"q":"Elinor ___ (keep) the secret for months.","blanks":1,"ans":["has been keeping"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Lucy and Edward had a secret engagement.","ans":"T","note":""},{"q":"Elinor told her mother about Lucy's secret.","ans":"F","note":""},{"q":"Willoughby answered Marianne's letters.","ans":"F","note":""}]}]},{"title":"Broken Hearts","label":"Part 4","paras":["At a party in London, Marianne finally saw Willoughby. She ran to him happily, but he was cold and polite, as if they were strangers. The next day, he sent her a short, formal letter: he was sorry if she had misunderstood his intentions, and he was going to marry another woman. The woman was Miss Grey, who had a fortune of fifty thousand pounds. Willoughby had spent all his money, and he needed a rich wife.","Marianne was destroyed. She cried all day and stopped eating. Then Colonel Brandon came to see Elinor with a sad story. Years before, Willoughby had treated a young girl in Brandon's care very badly: he had made her fall in love with him, and then he had left her alone and in trouble. Willoughby was not the romantic hero Marianne had imagined.","Soon, Lucy's secret came out. Edward's mother was furious. She ordered Edward to break his engagement and marry a rich woman. But Edward was an honest man, and he refused to break his promise to Lucy. So his mother gave all his money to his younger brother, Robert.","Only then did Marianne learn that Elinor had known about Edward and Lucy for months. \"How could you hide it?\" she asked. Elinor explained that she had felt the same pain, but she hadn't wanted to make everyone around her suffer too. For the first time, Marianne understood her sister."],"quotes":[],"words":"<i>formal</i> (serious and official, not friendly) · <i>intention</i> (what you plan to do) · <i>pounds</i> (British money) · <i>hero</i> (the main good character in a story) · <i>refuse</i> (to say no)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["cold","formal","polite","warm"],"ans":"warm","note":""},{"opts":["money","fortune","pounds","letter"],"ans":"letter","note":""},{"opts":["hero","villain","gentleman","friend"],"ans":"villain","note":""}]},{"id":"B","title":"B. Grammar: modal verbs of deduction (must / can't).","instr":"Choose.","type":"choose","items":[{"segs":["Willoughby is marrying a rich woman. He ",["must","can't"]," need money."],"ans":[["must"]]},{"segs":["Marianne is crying all day. She ",["must","can't"]," be very sad."],"ans":[["must"]]},{"segs":["Elinor is smiling, but she ",["must","can't"]," be happy. She loves Edward."],"ans":[["can't"]]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why was Willoughby going to marry Miss Grey?","model":"Because he had spent all his money and she was rich."},{"q":"What did Edward's mother do when she learned about Lucy?","model":"She gave all his money to his brother Robert."},{"q":"What did Marianne learn about her sister?","model":"That Elinor had known about Edward and Lucy for months and suffered in silence."}]}]},{"title":"Sense, Sensibility and Love","label":"Part 5","paras":["On the way home, the sisters stayed at Cleveland, the country house of Mrs. Jennings's daughter. Marianne went for long walks in the wet grass, thinking about Willoughby, and she became very ill with a fever. For days, everyone thought she would die. Elinor never left her side, and Colonel Brandon rode through the night to bring Mrs. Dashwood.","During that night, Willoughby arrived. He had heard that Marianne was dying. He told Elinor that he had truly loved Marianne, but he had chosen money. Now he was unhappy in his marriage. Elinor felt a little sorry for him, but she knew he had made his own choice.","Marianne recovered slowly. She had changed. \"I want to be more like you, Elinor,\" she said. \"I want to think about other people, not only about my own feelings.\"","Back at Barton, a servant brought news: \"Mr. Ferrars is married!\" Elinor was sure he meant Edward. But then Edward himself appeared at the door. Lucy had married his brother Robert — who now had all the money! Edward was free. He asked Elinor to marry him, and this time she could not hide her feelings: she cried with happiness. Colonel Brandon gave Edward a job as a clergyman, and they lived near each other. And a few years later, Marianne, who had once said she could only love once, married Colonel Brandon and loved him with all her heart."],"quotes":[],"words":"<i>fever</i> (a high body temperature when you are ill) · <i>recover</i> (to become healthy again) · <i>ride / rode</i> (to travel on a horse) · <i>servant</i> (a person who works in someone's house) · <i>free</i> (not engaged or married)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>fever, recovered, rode, servant, free</i>.","type":"bank","items":[{"q":"Marianne became very ill with a ___.","blanks":1,"ans":["fever"]},{"q":"Colonel Brandon ___ through the night.","blanks":1,"ans":["rode"]},{"q":"Slowly, Marianne ___.","blanks":1,"ans":["recovered"]},{"q":"A ___ brought news about Mr. Ferrars.","blanks":1,"ans":["servant"]},{"q":"Lucy married Robert, so Edward was ___.","blanks":1,"ans":["free"]}],"bank":["fever","recovered","rode","servant","free"]},{"id":"B","title":"B. Grammar: wish + past perfect (regrets).","instr":"Complete.","type":"type","items":[{"q":"Willoughby wishes he ___ (choose) love, not money.","blanks":1,"ans":["had chosen"]},{"q":"Marianne wishes she ___ (not / walk) in the wet grass.","blanks":1,"ans":["hadn't walked"]},{"q":"Elinor wishes she ___ (tell) Marianne the truth earlier.","blanks":1,"ans":["had told"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Are you more like Elinor (sense) or Marianne (sensibility)? Why?"},{"q":"Is it better to show your feelings or to hide them?"},{"q":"Was Willoughby a bad person, or only weak?"}]}]}]},{"id":"gatsby","title":"The Great Gatsby","level":"B1","author":"F. Scott Fitzgerald (1925)","color":"#2f6f8f","intro":["A B1 version of <i>The Great Gatsby</i> by F. Scott Fitzgerald (1925), in 5 parts. The book is in the public domain in Brazil (since 2011) and in the United States (since 2021). The story happens in the summer of 1922, near New York, in the age of jazz, parties and easy money. The narrator is Nick Carraway. The quotes are from the original text.","<b>Who's who</b><br>• <b>Nick Carraway</b> — the narrator; a young man from the Midwest<br>• <b>Jay Gatsby</b> — Nick's mysterious, very rich neighbor<br>• <b>Daisy Buchanan</b> — Nick's beautiful cousin<br>• <b>Tom Buchanan</b> — Daisy's husband; rich and aggressive<br>• <b>Jordan Baker</b> — Daisy's friend, a golf player<br>• <b>Myrtle and George Wilson</b> — a couple who live in a poor area; Myrtle is Tom's lover"],"parts":[{"title":"The Green Light","label":"Part 1","paras":["In the spring of 1922, Nick Carraway moved to New York to work in the bond business. He rented a small house in West Egg, a village on Long Island where people with \"new money\" lived. Next to his house there was an enormous mansion. It belonged to a man called Gatsby, but nobody really knew who he was.","Across the bay, in elegant East Egg, lived Nick's cousin Daisy and her husband, Tom Buchanan. Nick went to dinner at their beautiful house. Daisy was charming, with a low, exciting voice. Tom was strong, rich and arrogant. During dinner, the phone rang, and Tom left the table. Jordan Baker, Daisy's friend, whispered to Nick: \"Tom's got some woman in New York.\" Everybody knew, but nobody said anything.","That night, back home, Nick saw his neighbor for the first time. A man was standing alone on his lawn in the dark, looking across the water. He stretched out his arms toward a small green light at the end of a dock on the other side of the bay. Then he disappeared."],"quotes":["<i>\"Whenever you feel like criticizing any one, just remember that all the people in this world haven't had the advantages that you've had.\"</i> — Nick's father"],"words":"<i>mansion</i> (a very big, expensive house) · <i>bay</i> (a part of the sea with land around it) · <i>arrogant</i> (thinking you are better than everyone) · <i>lawn</i> (an area of short grass) · <i>dock</i> (a structure where boats stop)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>mansion, bay, arrogant, lawn, dock</i>.","type":"bank","items":[{"q":"Gatsby lived in an enormous ___.","blanks":1,"ans":["mansion"]},{"q":"The Buchanans lived on the other side of the ___.","blanks":1,"ans":["bay"]},{"q":"Tom thought he was better than everyone. He was ___.","blanks":1,"ans":["arrogant"]},{"q":"Gatsby was standing on his ___ in the dark.","blanks":1,"ans":["lawn"]},{"q":"The green light was at the end of a ___.","blanks":1,"ans":["dock"]}],"bank":["mansion","bay","arrogant","lawn","dock"]},{"id":"B","title":"B. Grammar: there was / there were.","instr":"Complete.","type":"type","items":[{"q":"___ a small green light across the water.","blanks":1,"ans":["There was"]},{"q":"___ many rich people in West Egg.","blanks":1,"ans":["There were"]},{"q":"___ a phone call during dinner.","blanks":1,"ans":["There was"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Daisy was Nick's cousin.","ans":"T","note":""},{"q":"Tom was faithful to Daisy.","ans":"F","note":""},{"q":"Gatsby looked at a green light across the bay.","ans":"T","note":""}]}]},{"title":"The Parties","label":"Part 2","paras":["Every weekend that summer, Gatsby's mansion was full of people. Cars came from New York, and hundreds of guests danced to an orchestra, drank champagne and swam in the pool until the morning. Most of them were never invited — they just came. And everyone had a story about the host: \"He killed a man once,\" said one girl. \"He was a German spy in the war,\" said another.","One Saturday, Nick received a real invitation. At the party, he talked to a young man about the war. \"I'm Gatsby,\" the man said suddenly. He had a wonderful smile that made you feel special. Nick was surprised: he had expected an older, fatter man.","Meanwhile, Tom took Nick to New York to meet his lover, Myrtle Wilson. On the way, they passed the \"valley of ashes,\" a gray, dirty place between the city and Long Island. Myrtle's husband, George, had a car garage there. He was poor, tired and had no idea about his wife. In the city, Myrtle had a party in a small apartment that Tom paid for. When she shouted Daisy's name, Tom broke her nose with his hand.","Then Jordan told Nick Gatsby's secret. Five years before, during the war, Gatsby had been a young officer, and he and Daisy had fallen in love. Then he went to Europe to fight, and Daisy married Tom, who was very rich. Gatsby had bought his mansion only to be across the bay from her. All the parties were for Daisy — he hoped she would come one day. Now he wanted Nick, her cousin, to invite her to tea."],"quotes":[],"words":"<i>guest</i> (a person invited to a party) · <i>host</i> (the person who gives a party) · <i>spy</i> (a person who secretly gets information for another country) · <i>lover</i> (a person you have a romantic relationship with, outside marriage) · <i>ashes</i> (the gray powder left after a fire)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["guest","host","spy","lover","ashes"],"opts":[["a","the gray powder after a fire"],["b","a person invited to a party"],["c","someone who gets secret information"],["d","the person who gives a party"],["e","a romantic partner outside marriage"]],"ans":["b","d","c","e","a"]},{"id":"B","title":"B. Grammar: past perfect.","instr":"Complete.","type":"type","items":[{"q":"Five years before, Gatsby and Daisy ___ (fall) in love.","blanks":1,"ans":["had fallen"]},{"q":"Daisy ___ (marry) Tom while Gatsby was in Europe.","blanks":1,"ans":["had married"]},{"q":"Gatsby ___ (buy) the mansion to be near her.","blanks":1,"ans":["had bought"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What did people say about Gatsby at his parties?","model":"That he had killed a man and that he had been a German spy."},{"q":"Who was Myrtle Wilson?","model":"Tom's lover, George Wilson's wife."},{"q":"Why did Gatsby give so many parties?","model":"Because he hoped Daisy would come one day."}]}]},{"title":"Gatsby and Daisy","label":"Part 3","paras":["Nick invited Daisy to tea. Gatsby was terribly nervous. He sent a man to cut Nick's grass and filled the little house with flowers. When Daisy arrived, it was raining, and the first minutes were very uncomfortable. Gatsby almost broke a clock. But when Nick came back half an hour later, everything was different. Daisy's face was wet with tears, and Gatsby was shining with happiness.","Gatsby showed Daisy his mansion. He threw his beautiful shirts on the table, one after another — silk, linen, in all colors. Daisy put her face in them and cried. \"They're such beautiful shirts,\" she said. \"It makes me sad because I've never seen such beautiful shirts before.\"","Later, Nick learned the truth about Gatsby. His real name was James Gatz, and he was the son of poor farmers from North Dakota. At seventeen, he had invented a new person, \"Jay Gatsby,\" with a perfect past. He had made his fortune after the war, probably with illegal business. Everything — the house, the clothes, the parties — was part of the dream he had created to win Daisy back.","Nick told Gatsby, \"You can't repeat the past.\" Gatsby looked at him in surprise. \"Can't repeat the past? Why of course you can!\" He wanted Daisy to tell Tom that she had never loved him. Then they could go back to Louisville and get married, just as if the last five years had never happened."],"quotes":["<i>\"Can't repeat the past? Why of course you can!\"</i> — Gatsby"],"words":"<i>tears</i> (water from your eyes when you cry) · <i>silk</i> (a soft, expensive material) · <i>invent</i> (to create something new) · <i>illegal</i> (against the law) · <i>win back</i> (to get something again after losing it)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>tears, silk, invented, illegal, win back</i>.","type":"bank","items":[{"q":"Daisy's face was wet with ___.","blanks":1,"ans":["tears"]},{"q":"Gatsby had shirts made of ___.","blanks":1,"ans":["silk"]},{"q":"James Gatz ___ a new person: Jay Gatsby.","blanks":1,"ans":["invented"]},{"q":"He probably made his money with ___ business.","blanks":1,"ans":["illegal"]},{"q":"Everything was part of his plan to ___ Daisy.","blanks":1,"ans":["win back"]}],"bank":["tears","silk","invented","illegal","win back"]},{"id":"B","title":"B. Grammar: too / enough.","instr":"Complete with <i>too</i> or <i>enough</i>.","type":"bank","items":[{"q":"Gatsby was ___ nervous to sit still.","blanks":1,"ans":["too"]},{"q":"Daisy didn't wait long ___ for Gatsby.","blanks":1,"ans":["enough"]},{"q":"The past is ___ far away to repeat.","blanks":1,"ans":["too"]}],"bank":["too","enough"]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The tea at Nick's house was easy and relaxed from the beginning.","ans":"F","note":""},{"q":"Gatsby's family was very rich.","ans":"F","note":""},{"q":"Gatsby believed he could repeat the past.","ans":"T","note":""}]}]},{"title":"The Hottest Day of the Summer","label":"Part 4","paras":["On the hottest day of the summer, everyone was at the Buchanans' house: Daisy, Tom, Gatsby, Jordan and Nick. It was too hot to stay inside, so they decided to drive to New York. Gatsby talked about Daisy's voice. \"Her voice is full of money,\" he said suddenly. Tom was watching them, and he started to understand.","They took a room at the Plaza Hotel. The heat was terrible, and so was the conversation. Tom attacked Gatsby: \"Who are you, anyhow?\" Gatsby answered: \"Your wife doesn't love you. She's never loved you. She loves me.\" He wanted Daisy to say it. But Daisy couldn't. \"I did love him once — but I loved you too,\" she said. Then Tom told everyone that Gatsby was a criminal who sold illegal alcohol. Daisy moved away from Gatsby, and Nick saw that the dream was dying.","They drove home in two cars. Gatsby and Daisy were in Gatsby's yellow car. As they passed the valley of ashes, Myrtle Wilson ran into the road, because she thought Tom was in the yellow car. The car hit her and didn't stop. Myrtle died immediately.","Later that night, Nick found Gatsby hiding in the Buchanans' garden. \"Was Daisy driving?\" Nick asked. \"Yes,\" said Gatsby. \"But of course I'll say I was.\" He stayed outside all night, watching Daisy's window, to protect her. But inside the house, Daisy and Tom were sitting together at the kitchen table, talking quietly, like two people with a plan."],"quotes":[],"words":"<i>heat</i> (high temperature) · <i>criminal</i> (a person who commits crimes) · <i>alcohol</i> (drinks like wine and whisky) · <i>hit</i> (to crash into something) · <i>protect</i> (to keep someone safe)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["heat","hot","sun","snow"],"ans":"snow","note":""},{"opts":["car","garage","road","champagne"],"ans":"champagne","note":""},{"opts":["criminal","police","illegal","crime","flower"],"ans":"flower","note":""}]},{"id":"B","title":"B. Grammar: reported speech.","instr":"Report what they said.","type":"type","items":[{"q":"Gatsby: \"Her voice is full of money.\" → Gatsby said that her voice ___ full of money.","blanks":1,"ans":["was"]},{"q":"Daisy: \"I loved you too.\" → Daisy said that she ___ Tom too.","blanks":1,"ans":["had loved"]},{"q":"Gatsby: \"I'll say I was driving.\" → Gatsby said that he ___ say he was driving.","blanks":1,"ans":["would"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What did Gatsby want Daisy to say at the hotel?","model":"That she had never loved Tom."},{"q":"Who was driving the yellow car?","model":"Daisy."},{"q":"Why did Myrtle run into the road?","model":"Because she thought Tom was in the yellow car."}]}]},{"title":"Boats Against the Current","label":"Part 5","paras":["George Wilson was destroyed by his wife's death. He wanted to know who was driving the yellow car. Tom told him: the car belonged to Gatsby. The next afternoon, Gatsby went for a swim in his pool for the first time that summer. He was still waiting for a call from Daisy. Wilson found him there and shot him. Then he shot himself.","Nick organized the funeral. He called everyone — all the hundreds of people who had come to Gatsby's parties. Nobody came. Daisy and Tom had left on a trip, without leaving an address. Only Gatsby's old father came from Minnesota, and one man who had been to the parties. Mr. Gatz showed Nick a little book from Gatsby's childhood, with a schedule to improve himself: exercise, study, \"be better to parents.\"","Some months later, Nick met Tom in the street. Tom wasn't sorry about anything. \"They were careless people, Tom and Daisy,\" Nick thought. \"They smashed up things and creatures and then retreated back into their money.\" Nick decided to go back home, to the Midwest.","On his last night, Nick walked to Gatsby's empty mansion and looked at the green light across the bay. He thought about Gatsby's dream, and about how he had believed in a future that moved further away every year. And so we all go forward, he thought, but the past is always pulling us back."],"quotes":["<i>\"So we beat on, boats against the current, borne back ceaselessly into the past.\"</i>"],"words":"<i>funeral</i> (the ceremony when someone is buried) · <i>schedule</i> (a plan of what to do and when) · <i>careless</i> (not thinking about the results of your actions) · <i>smash</i> (to break violently) · <i>current</i> (the movement of water in a river or sea)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>funeral, schedule, careless, smashed, current</i>.","type":"bank","items":[{"q":"Almost nobody came to Gatsby's ___.","blanks":1,"ans":["funeral"]},{"q":"As a boy, Gatsby wrote a ___ to improve himself.","blanks":1,"ans":["schedule"]},{"q":"Nick thought Tom and Daisy were ___ people.","blanks":1,"ans":["careless"]},{"q":"They ___ things and then hid behind their money.","blanks":1,"ans":["smashed"]},{"q":"A boat moving against the ___ goes slowly.","blanks":1,"ans":["current"]}],"bank":["funeral","schedule","careless","smashed","current"]},{"id":"B","title":"B. Grammar: third conditional.","instr":"Complete.","type":"type","items":[{"q":"If Daisy hadn't married Tom, she ___ (marry) Gatsby.","blanks":1,"ans":["would have married"]},{"q":"If Tom ___ (not tell) Wilson about the car, Wilson wouldn't have found Gatsby.","blanks":1,"ans":["hadn't told"]},{"q":"If Gatsby had forgotten the past, he ___ (be) happier.","blanks":1,"ans":["would have been"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Why is Gatsby \"great\"? Is he really great?"},{"q":"Was Daisy a victim or was she careless?"},{"q":"Can money buy happiness? What does this book say?"}]}]}]},{"id":"dorian","title":"The Picture of Dorian Gray","level":"B1","author":"Oscar Wilde (1891)","color":"#6b4c8a","intro":["A B1 version of <i>The Picture of Dorian Gray</i> by Oscar Wilde (1891, public domain), in 5 parts. The language is simplified, but the story keeps its dark atmosphere and some of Wilde's most famous lines."],"parts":[{"title":"The Portrait and the Wish","label":"Part 1","paras":["On a sunny afternoon in London, the painter Basil Hallward was finishing a portrait in his studio. His friend, Lord Henry Wotton, was lying on a sofa, smoking. \"It's the best thing you've ever done, Basil,\" said Lord Henry. \"You must show it to everyone.\" But Basil refused. \"I've put too much of myself into it,\" he said.","The young man in the portrait was Dorian Gray. He was twenty years old, incredibly handsome and completely innocent. When Dorian arrived at the studio, Lord Henry started talking to him. He spoke beautifully, and his ideas were shocking. \"Youth is the only thing worth having,\" he said. \"You have only a few years in which to live really. When your youth goes, your beauty will go with it.\"","Dorian had never heard anyone talk like this. When Basil finished the portrait, Dorian looked at it, and for the first time he understood how beautiful he was. But then he remembered Lord Henry's words. One day he would be old, ugly and wrinkled, but the painting would always stay young.","\"How sad it is!\" he said. \"If only it were the other way! If only I could stay young, and the picture could grow old! I would give everything for that. I would give my soul for that!\""],"quotes":["<i>\"The only way to get rid of a temptation is to yield to it.\"</i> — Lord Henry"],"words":"<i>portrait</i> (a painting of a person) · <i>youth</i> (the time when you are young) · <i>wrinkled</i> (with lines on the skin because of age) · <i>soul</i> (the spiritual part of a person) · <i>temptation</i> (a strong wish to do something, often something wrong)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>portrait, youth, wrinkled, temptation, innocent</i>.","type":"bank","items":[{"q":"Basil painted a ___ of Dorian.","blanks":1,"ans":["portrait"]},{"q":"Lord Henry said that ___ was the only thing worth having.","blanks":1,"ans":["youth"]},{"q":"Dorian was afraid of becoming old and ___.","blanks":1,"ans":["wrinkled"]},{"q":"At the beginning, Dorian was pure and ___.","blanks":1,"ans":["innocent"]},{"q":"Lord Henry said you should give in to ___.","blanks":1,"ans":["temptation"]}],"bank":["portrait","youth","wrinkled","temptation","innocent"]},{"id":"B","title":"B. Grammar: wish / if only + past.","instr":"Rewrite the sentences.","type":"type","items":[{"q":"Dorian is going to get old. → <i>He wishes he wouldn't get old. / If only he could stay young.</i>","blanks":1,"example":true},{"q":"Basil can't show the painting. → Basil wishes ___","blanks":1,"ans":["Basil wishes he could show the painting"]},{"q":"Dorian isn't like the picture. → If only Dorian ___","blanks":1,"ans":["If only Dorian were like the picture"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why didn't Basil want to show the portrait?","model":"Because he had put too much of himself into it."},{"q":"How did Lord Henry's words change Dorian?","model":"He started to worry about youth and beauty."},{"q":"What was Dorian's wish?","model":"To stay young while the picture grew old."}]}]},{"title":"Sibyl Vane","label":"Part 2","paras":["After that day, Dorian spent a lot of time with Lord Henry, who taught him to live only for pleasure and beauty. One evening, Dorian went into a small, poor theater, and he saw a young actress called Sibyl Vane. She was playing Juliet in <i>Romeo and Juliet</i>, and she was magnificent. Dorian fell in love with her immediately. He went to see her every night, and soon they were engaged.","Dorian invited Basil and Lord Henry to see Sibyl act. But that night, Sibyl acted terribly. She spoke without any feeling, and the audience laughed at her. Dorian was ashamed. After the play, Sibyl explained, happily: \"Before I met you, acting was my only reality. But now I know what real love is. I can't pretend anymore.\"","Dorian was furious. \"You have killed my love,\" he said coldly. \"You were wonderful because you were an artist. Without your art, you are nothing.\" Sibyl cried and begged him to stay, but he left her.","When Dorian got home, he looked at his portrait. Something had changed. There was a cruel line around the mouth. He was horrified. Had his wish come true? He decided to be good: he would go back to Sibyl and marry her. But the next day, Lord Henry brought him terrible news. Sibyl had killed herself the night before."],"quotes":[],"words":"<i>pleasure</i> (a feeling of happiness and enjoyment) · <i>engaged</i> (having promised to marry) · <i>ashamed</i> (feeling bad because of something embarrassing) · <i>beg</i> (to ask for something in a desperate way) · <i>cruel</i> (wanting to make others suffer)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["ashamed","beg","cruel","engaged","pretend"],"opts":[["a","to act as if something is true when it isn't"],["b","having promised to marry"],["c","feeling bad and embarrassed"],["d","to ask desperately"],["e","wanting others to suffer"]],"ans":["c","d","e","b","a"]},{"id":"B","title":"B. Grammar: past perfect.","instr":"Complete with the past perfect.","type":"type","items":[{"q":"When Dorian looked at the portrait, something ___ (change).","blanks":1,"ans":["had changed"]},{"q":"Sibyl ___ (never / know) real love before she met Dorian.","blanks":1,"ans":["had never known"]},{"q":"Lord Henry told Dorian that Sibyl ___ (die) the night before.","blanks":1,"ans":["had died"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Sibyl act badly that night?","model":"Because she had discovered real love and couldn't pretend."},{"q":"How did Dorian react?","model":"He was cruel and left her."},{"q":"What change did Dorian see in the portrait?","model":"A cruel line around the mouth."}]}]},{"title":"The Secret in the Attic","label":"Part 3","paras":["Dorian felt guilty for a short time, but Lord Henry convinced him to forget. \"Sibyl's death was like a beautiful tragedy in a play,\" he said. And Dorian decided not to feel anything.","He understood that the portrait was now his conscience. Every bad thing he did would appear on the painting, not on his face. Afraid that someone would see it, he covered it with a purple cloth and locked it in the old schoolroom at the top of his house. Only he had the key.","Years passed. Lord Henry gave Dorian a strange yellow book, and Dorian became obsessed with it. He lived for pleasure, collecting jewels, perfumes and beautiful objects. People in London started to tell terrible stories about him. Young men who were his friends had their lives destroyed. Some went to prison; one killed himself. But Dorian still had the face of an innocent twenty-year-old, so many people refused to believe the rumors.","Sometimes, Dorian went up to the attic. He looked at the portrait, which was becoming older and uglier every year, and he compared it with his own beautiful face in a mirror. Sometimes he felt pleasure, and sometimes he felt terror."],"quotes":["<i>\"Each of us has heaven and hell in him.\"</i> — Dorian Gray"],"words":"<i>guilty</i> (feeling bad because you did something wrong) · <i>conscience</i> (the voice inside you that says what is right and wrong) · <i>obsessed</i> (thinking about something all the time) · <i>rumor</i> (a story that people tell, which may not be true)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>guilty, conscience, obsessed, rumors</i>.","type":"bank","items":[{"q":"Dorian felt ___ after Sibyl's death, but only for a short time.","blanks":1,"ans":["guilty"]},{"q":"The portrait became his ___.","blanks":1,"ans":["conscience"]},{"q":"He was ___ with the yellow book.","blanks":1,"ans":["obsessed"]},{"q":"People told ___ about his life.","blanks":1,"ans":["rumors"]}],"bank":["guilty","conscience","obsessed","rumors"]},{"id":"B","title":"B. Grammar: relative clauses (who / which / where).","instr":"Complete.","type":"type","items":[{"q":"Lord Henry gave him a book ___ changed his life.","blanks":1,"ans":["which/that"]},{"q":"The friends ___ knew Dorian had terrible lives.","blanks":1,"ans":["who"]},{"q":"The attic was the place ___ he hid the portrait.","blanks":1,"ans":["where"]},{"q":"The portrait, ___ was locked away, was getting older.","blanks":1,"ans":["which"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Dorian put the portrait in the living room.","ans":"F","note":""},{"q":"Dorian's face showed his bad actions.","ans":"F","note":""},{"q":"Many people didn't believe the stories about Dorian.","ans":"T","note":""}]}]},{"title":"Basil Sees the Truth","label":"Part 4","paras":["On the night before his 38th birthday, Dorian met Basil in the street. Basil was going to Paris, but he wanted to talk to Dorian first. \"People are saying awful things about you,\" Basil said. \"I can't believe them when I see your face. But I need to know your soul.\"","Dorian laughed bitterly. \"You want to see my soul? Come with me.\" He took Basil to the attic and pulled the cloth off the portrait. Basil cried out in horror. The face in the painting was old, cruel and monstrous. But it was still his painting; it was his own brushwork and his own signature.","\"Pray, Dorian, pray!\" Basil said. \"It's not too late.\" But at that moment, Dorian felt an uncontrollable hatred for Basil. He blamed the painter for everything. He picked up a knife from the table and killed his old friend.","Afterwards, Dorian was calm. He blackmailed a scientist, Alan Campbell, an old friend who knew a terrible secret, and forced him to destroy Basil's body. Nobody ever discovered what had happened. Later, Alan Campbell killed himself too. And on the portrait, there was now a red stain on one of the hands, like blood."],"quotes":[],"words":"<i>awful</i> (very bad) · <i>hatred</i> (a very strong feeling of not liking someone) · <i>blame</i> (to say that someone is responsible for something bad) · <i>blackmail</i> (to make someone do something by threatening to tell their secret) · <i>stain</i> (a dirty mark that is difficult to clean)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>blamed, awful, stain, blackmailed, hatred</i>.","type":"bank","items":[{"q":"People were saying ___ things about Dorian.","blanks":1,"ans":["awful"]},{"q":"Dorian felt ___ for Basil.","blanks":1,"ans":["hatred"]},{"q":"He ___ Basil for everything.","blanks":1,"ans":["blamed"]},{"q":"Dorian ___ Alan Campbell.","blanks":1,"ans":["blackmailed"]},{"q":"There was a red ___ on the portrait's hand.","blanks":1,"ans":["stain"]}],"bank":["blamed","awful","stain","blackmailed","hatred"]},{"id":"B","title":"B. Grammar: reported speech.","instr":"Report what they said.","type":"type","items":[{"q":"Basil: \"I'm going to Paris.\" → Basil said that he ___","blanks":1,"ans":["was going to Paris"]},{"q":"Basil: \"I need to know your soul.\" → Basil said that he ___","blanks":1,"ans":["needed to know his soul"]},{"q":"Dorian: \"I will show you my soul.\" → Dorian said that he ___","blanks":1,"ans":["would show him his soul"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Basil want to talk to Dorian?","model":"Because people were saying awful things about him."},{"q":"What did Basil see in the attic?","model":"A monstrous, old, cruel face in the painting."},{"q":"How did the portrait change after the murder?","model":"There was a red stain, like blood, on one hand."}]}]},{"title":"The End of Dorian Gray","label":"Part 5","paras":["After Basil's death, Dorian could not find peace. He tried to forget in opium dens in the dark parts of London. One night, a sailor recognized him there. It was James Vane, Sibyl's brother, who had promised to kill the man who destroyed his sister. But Dorian escaped: \"Look at my face,\" he said. \"I'm only twenty. How could I be that man? Your sister died eighteen years ago!\" James let him go. Weeks later, James was accidentally shot during a hunting party at Dorian's country house.","Now Dorian decided to change. He wanted to be good. He even refused to seduce a young village girl, and he left her innocent. \"Maybe the portrait has become a little better,\" he thought.","He went up to the attic to look. But the portrait was even worse. Now there was a look of hypocrisy on the face. Dorian realized that his good action was not real kindness; it was only vanity and curiosity. The portrait was the evidence of everything he had done.","In a fury, he took the knife that had killed Basil and stabbed the painting. The servants heard a horrible cry. When they broke into the room, they found a magnificent portrait of their young master, as beautiful as the day it was painted. And on the floor lay a dead man with a knife in his heart. He was old, wrinkled and horrible. They only recognized him by the rings on his fingers."],"quotes":[],"words":"<i>peace</i> (calm, without worries) · <i>recognize</i> (to know who someone is when you see them) · <i>hypocrisy</i> (pretending to be good when you are not) · <i>vanity</i> (thinking too much about yourself and your appearance) · <i>evidence</i> (proof that something happened)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["vanity","hypocrisy","cruelty","kindness"],"ans":"kindness","note":""},{"opts":["portrait","painting","picture","knife"],"ans":"knife","note":""},{"opts":["young","beautiful","innocent","wrinkled"],"ans":"wrinkled","note":""}]},{"id":"B","title":"B. Grammar: third conditional.","instr":"Complete.","type":"type","items":[{"q":"If Dorian hadn't met Lord Henry, he ___ (not change) so much.","blanks":1,"ans":["wouldn't have changed"]},{"q":"If James had looked at the portrait, he ___ (recognize) Dorian.","blanks":1,"ans":["would have recognized"]},{"q":"If Dorian ___ (not make) the wish, his face would have grown old.","blanks":1,"ans":["hadn't made"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Who is most responsible for Dorian's actions: Dorian, Lord Henry or Basil? Why?"},{"q":"Would you like to stay young forever? What would you give for it?"},{"q":"Today, many people use filters on social media. Is there a connection with this story?"}]}]}]},{"id":"wuthering","title":"Wuthering Heights","level":"B1","author":"Emily Brontë (1847)","color":"#4f5683","intro":["A B1 version of <i>Wuthering Heights</i> by Emily Brontë (1847, public domain), in 5 parts. The story happens on the wild moors of Yorkshire, in the north of England, around two houses: Wuthering Heights and Thrushcross Grange.","<b>Who's who</b><br>• <b>Heathcliff</b> — an orphan boy who grows up at Wuthering Heights<br>• <b>Catherine (Cathy) Earnshaw</b> — the daughter of the family; she loves Heathcliff<br>• <b>Hindley Earnshaw</b> — Catherine's older brother; he hates Heathcliff<br>• <b>Edgar and Isabella Linton</b> — a rich brother and sister from Thrushcross Grange<br>• <b>Nelly Dean</b> — the housekeeper, who tells most of the story<br>• <b>Mr. Lockwood</b> — a visitor from London, who listens to Nelly's story"],"parts":[{"title":"A Stranger at Wuthering Heights","label":"Part 1","paras":["In 1801, a man from London called Mr. Lockwood rented a big house called Thrushcross Grange. He went to visit his landlord, Mr. Heathcliff, who lived at a farmhouse four miles away, on top of a hill. It was called Wuthering Heights, because it was always hit by strong, wild winds.","The people at Wuthering Heights were very strange and unfriendly. Heathcliff was dark, rude and cold. There was also a beautiful but angry young woman, and a rough young man who looked like a servant. Nobody seemed happy.","One evening, there was a heavy snowstorm, and Lockwood had to stay the night. He slept in an old room with a bed like a box. On the window, someone had scratched three names: Catherine Earnshaw, Catherine Heathcliff, Catherine Linton. That night, Lockwood had a terrible dream. A cold little hand came through the broken window and held his arm. \"Let me in! Let me in!\" cried a voice. \"I'm Catherine. I've come home. I've been lost on the moor for twenty years!\"","Lockwood screamed. Heathcliff ran into the room. When he heard about the dream, he opened the window and cried into the storm: \"Cathy, come in! Oh, do — once more! Oh, my heart's darling! Hear me this time, Catherine!\" But there was only snow and wind.","Back at the Grange, Lockwood asked his housekeeper, Nelly Dean, about Heathcliff. And Nelly began to tell him the story."],"quotes":[],"words":"<i>rent</i> (to pay money to live in a place) · <i>landlord</i> (the owner of the house you rent) · <i>rough</i> (not gentle or polite) · <i>moor</i> (a wild, open area of high land) · <i>scratch</i> (to make marks with something sharp)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>landlord, rough, moor, scratched, rented</i>.","type":"bank","items":[{"q":"Lockwood ___ a house called Thrushcross Grange.","blanks":1,"ans":["rented"]},{"q":"Heathcliff was his ___.","blanks":1,"ans":["landlord"]},{"q":"Someone had ___ names on the window.","blanks":1,"ans":["scratched"]},{"q":"The voice said she was lost on the ___.","blanks":1,"ans":["moor"]},{"q":"The young man had ___ manners.","blanks":1,"ans":["rough"]}],"bank":["landlord","rough","moor","scratched","rented"]},{"id":"B","title":"B. Grammar: past perfect.","instr":"Complete.","type":"type","items":[{"q":"Someone ___ (scratch) three names on the window.","blanks":1,"ans":["had scratched"]},{"q":"Catherine said she ___ (be) lost for twenty years.","blanks":1,"ans":["had been"]},{"q":"Lockwood didn't know what ___ (happen) in that house.","blanks":1,"ans":["had happened"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why was the house called Wuthering Heights?","model":"Because strong, wild winds always hit it."},{"q":"What did Lockwood see in his dream?","model":"A cold hand and Catherine's voice asking to come in."},{"q":"How did Heathcliff react?","model":"He opened the window and called Catherine."}]}]},{"title":"Heathcliff and Catherine","label":"Part 2","paras":["Many years before, Mr. Earnshaw, the owner of Wuthering Heights, came back from a trip to Liverpool with a strange gift: a dirty, dark-haired little boy he had found alone in the streets. Nobody knew where he came from. They called him Heathcliff.","Mr. Earnshaw loved the boy, maybe more than his own son, Hindley. Hindley was jealous, and he hated Heathcliff from the beginning. But Catherine, Mr. Earnshaw's daughter, became Heathcliff's best friend. The two children were wild and free. They spent whole days running on the moors together.","When Mr. Earnshaw died, Hindley became the master of the house. He treated Heathcliff like a servant: he didn't let him study, and he made him work on the farm.","One night, Catherine and Heathcliff ran to Thrushcross Grange to look through the windows of the rich Linton family. A dog attacked Catherine and hurt her leg, so she had to stay at the Grange for five weeks. When she came back, she was different. She wore elegant dresses and had perfect manners, like a lady. She laughed at Heathcliff because he was dirty. Heathcliff was deeply hurt. \"I'll be dirty if I want to,\" he said."],"quotes":[],"words":"<i>orphan</i> (a child whose parents are dead) · <i>master</i> (the man in charge of a house) · <i>treat</i> (to behave toward someone in a certain way) · <i>elegant</i> (beautiful and stylish) · <i>manners</i> (polite ways of behaving)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["orphan","master","elegant","manners","jealous"],"opts":[["a","beautiful and stylish"],["b","a child without parents"],["c","polite ways of behaving"],["d","unhappy because someone has what you want"],["e","the man in charge of a house"]],"ans":["b","e","a","c","d"]},{"id":"B","title":"B. Grammar: used to.","instr":"Complete with <i>used to</i> + verb.","type":"type","items":[{"q":"Catherine and Heathcliff ___ (run) on the moors all day.","blanks":1,"ans":["used to run"]},{"q":"Mr. Earnshaw ___ (love) Heathcliff more than Hindley.","blanks":1,"ans":["used to love"]},{"q":"Heathcliff ___ (be) Catherine's best friend.","blanks":1,"ans":["used to be"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Heathcliff was Mr. Earnshaw's son.","ans":"F","note":""},{"q":"Hindley treated Heathcliff badly.","ans":"T","note":""},{"q":"Catherine came back from the Grange looking like a lady.","ans":"T","note":""}]}]},{"title":"Catherine's Choice","label":"Part 3","paras":["As they grew up, Edgar Linton started to visit Catherine. He was rich, blond, gentle and well educated: the opposite of Heathcliff. One day, Edgar asked Catherine to marry him, and she said yes.","That night, in the kitchen, Catherine talked to Nelly. She didn't know that Heathcliff was listening in the shadows. \"I love Edgar because he's handsome and rich,\" she said. \"It would degrade me to marry Heathcliff now.\" Heathcliff heard those words, and he left the room. But he didn't hear the rest. \"He'll never know how I love him,\" Catherine continued. \"He's more myself than I am. Whatever our souls are made of, his and mine are the same.\"","That night, Heathcliff ran away from Wuthering Heights. Catherine looked for him in the rain all night, and she became very ill. For three years, nobody heard anything about him. Catherine married Edgar and went to live at Thrushcross Grange.","Then, one evening, Heathcliff came back. He was now a tall, strong, elegant man, and he had a lot of money. Nobody knew how he had got it. Catherine was overjoyed to see him. Edgar was not."],"quotes":["<i>\"Whatever our souls are made of, his and mine are the same.\"</i> — Catherine"],"words":"<i>degrade</i> (to make someone feel less important or respected) · <i>ill</i> (sick) · <i>overjoyed</i> (extremely happy) · <i>educated</i> (having studied a lot)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>ill, overjoyed, educated, degrade</i>.","type":"bank","items":[{"q":"Edgar was rich and well ___.","blanks":1,"ans":["educated"]},{"q":"Catherine said marrying Heathcliff would ___ her.","blanks":1,"ans":["degrade"]},{"q":"After looking for Heathcliff in the rain, she became very ___.","blanks":1,"ans":["ill"]},{"q":"When Heathcliff came back, Catherine was ___.","blanks":1,"ans":["overjoyed"]}],"bank":["ill","overjoyed","educated","degrade"]},{"id":"B","title":"B. Grammar: second conditional.","instr":"Complete.","type":"type","items":[{"q":"If Catherine married Heathcliff, she ___ (be) poor.","blanks":1,"ans":["would be"]},{"q":"If Heathcliff ___ (be) rich, Catherine would marry him.","blanks":1,"ans":["were"]},{"q":"If Edgar ___ (know) about her feelings, he would be very sad.","blanks":1,"ans":["knew"]},{"q":"If I ___ (be) Catherine, I would choose ___.","blanks":2,"ans":["were","*"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Catherine accept Edgar?","model":"Because he was handsome and rich."},{"q":"What part of the conversation did Heathcliff not hear?","model":"That she loved Heathcliff and that their souls were the same."},{"q":"How had Heathcliff changed when he came back?","model":"He was tall, strong, elegant and rich."}]}]},{"title":"Revenge","label":"Part 4","paras":["Heathcliff had come back for one reason: revenge. He wanted to destroy Hindley, who had treated him so badly, and Edgar, who had taken Catherine from him.","Hindley was now a widower. He drank too much and gambled. Heathcliff went to live at Wuthering Heights and played cards with him. Slowly, Hindley lost all his money, and Heathcliff won the house. Then Heathcliff took Hindley's little son, Hareton, and treated him as Hindley had once treated him: like an uneducated servant.","To hurt Edgar, Heathcliff ran away with Edgar's sister, Isabella, and married her. He didn't love her at all. He was cruel to her, and after some time she escaped to the south of England, where she had a son, Linton.","Meanwhile, Catherine was very ill. She couldn't choose between her husband and Heathcliff, and it was destroying her. Heathcliff came to see her one last time. They held each other and cried, and they said terrible and beautiful things to each other. That night, Catherine gave birth to a baby girl, also called Catherine (Cathy). A few hours later, Catherine died.","When Nelly told him, Heathcliff hit his head against a tree. \"Catherine Earnshaw, may you not rest as long as I am living!\" he cried. \"Be with me always — take any form — drive me mad! I cannot live without my life! I cannot live without my soul!\""],"quotes":[],"words":"<i>revenge</i> (hurting someone because they hurt you) · <i>widower</i> (a man whose wife has died) · <i>gamble</i> (to play games for money) · <i>give birth</i> (to have a baby)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>revenge, widower, gambled, gave birth</i>.","type":"bank","items":[{"q":"Heathcliff wanted ___ on Hindley and Edgar.","blanks":1,"ans":["revenge"]},{"q":"Hindley's wife had died. He was a ___.","blanks":1,"ans":["widower"]},{"q":"Hindley ___ and lost all his money.","blanks":1,"ans":["gambled"]},{"q":"Catherine ___ to a baby girl.","blanks":1,"ans":["gave birth"]}],"bank":["revenge","widower","gambled","gave birth"]},{"id":"B","title":"B. Grammar: passive (past simple).","instr":"Rewrite in the passive.","type":"type","items":[{"q":"Heathcliff won the house. → <i>The house was won by Heathcliff.</i>","blanks":1,"example":true},{"q":"Heathcliff took Hareton. → Hareton ___","blanks":1,"ans":["Hareton was taken by Heathcliff"]},{"q":"Heathcliff treated Isabella badly. → Isabella ___","blanks":1,"ans":["Isabella was treated badly by Heathcliff"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"How did Heathcliff get Wuthering Heights?","model":"He won it from Hindley playing cards."},{"q":"Why did Heathcliff marry Isabella?","model":"To hurt Edgar."},{"q":"What happened on the night Catherine died?","model":"She gave birth to a daughter and died."}]}]},{"title":"The Next Generation","label":"Part 5","paras":["The years passed, but Heathcliff never stopped thinking about Catherine, and he continued his revenge with the next generation. When Isabella died, he brought her son, Linton, to Wuthering Heights. Linton was weak, spoiled and always ill.","Heathcliff had a plan. He wanted Linton to marry young Cathy, Edgar's daughter, so he could own Thrushcross Grange too. He tricked Cathy, locked her in Wuthering Heights and forced the two young people to marry, while Edgar was dying at home. Soon after, Edgar died, and then Linton died too. Now Heathcliff owned both houses, and young Cathy was a prisoner at Wuthering Heights. She was angry and unhappy — she was the woman Lockwood had seen at the beginning.","But slowly, something changed. Cathy began to teach Hareton, the rough young man, how to read. They became friends, and then they fell in love. Heathcliff saw them together, and he saw Catherine's eyes in both of their faces. Suddenly, he didn't want revenge anymore. He stopped eating and sleeping. He walked on the moors at night, talking to someone nobody else could see.","One morning, Nelly found Heathcliff dead in the old bedroom, with the window open and the rain coming in. He was buried next to Catherine. Hareton and Cathy planned to marry and move to Thrushcross Grange. And the people of the village say that, on stormy nights, they can still see two figures walking together on the moors."],"quotes":[],"words":"<i>generation</i> (people born around the same time) · <i>spoiled</i> (a child who always gets what he wants) · <i>prisoner</i> (a person who is not free to leave) · <i>buried</i> (put in the ground after death)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["revenge","hatred","love","cruelty"],"ans":"love","note":""},{"opts":["moor","hill","kitchen","field"],"ans":"kitchen","note":""},{"opts":["weak","ill","spoiled","strong"],"ans":"strong","note":""}]},{"id":"B","title":"B. Grammar: so / such (a).","instr":"Complete with <i>so</i> or <i>such</i>.","type":"bank","items":[{"q":"Linton was ___ weak that he was always in bed.","blanks":1,"ans":["so"]},{"q":"Heathcliff was ___ a cruel man!","blanks":1,"ans":["such"]},{"q":"Cathy was ___ unhappy at Wuthering Heights.","blanks":1,"ans":["so"]}],"bank":["so","such"]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Is Heathcliff a villain or a victim? Why?"},{"q":"Was Catherine right to marry Edgar?"},{"q":"Is revenge ever a good idea? Give an example."}]}]}]},{"id":"crime","title":"Crime and Punishment","level":"B1","author":"Fyodor Dostoevsky (1866)","color":"#7a2e2e","intro":["A B1 version of <i>Crime and Punishment</i> by Fyodor Dostoevsky (1866), based on the English translation by Constance Garnett (1914, public domain), in 5 parts. The story happens in St. Petersburg, Russia, in a hot, dirty summer. It is a psychological novel: the most important action happens inside the mind of the main character. The quotes are from Garnett's translation. Content note: the story includes a murder.","<b>Who's who</b><br>• <b>Rodion Raskolnikov</b> — a poor former student<br>• <b>Sonia Marmeladov</b> — a poor, gentle young woman<br>• <b>Razumikhin</b> — Raskolnikov's loyal friend<br>• <b>Dounia and Pulcheria</b> — Raskolnikov's sister and mother<br>• <b>Porfiry Petrovich</b> — a clever detective"],"parts":[{"title":"An Idea","label":"Part 1","paras":["Rodion Raskolnikov was twenty-three years old. He had been a law student, but he had no money, so he had stopped going to the university. He lived in a tiny room under the roof, \"more like a cupboard than a room,\" and he hardly ate. He owed money to his landlady, and he was afraid to meet her on the stairs.","For weeks, a terrible idea had been growing in his mind. In his building, people talked about an old pawnbroker, Alyona Ivanovna. She lent money to poor people and kept their things — watches, rings — in exchange. She was rich, greedy and cruel, even to her own gentle sister, Lizaveta. Raskolnikov thought: \"If I killed her and took her money, I could do a hundred good things with it. One death, and a hundred lives saved. Isn't that simple arithmetic?\"","He also had a theory. He believed that humanity was divided into two groups: ordinary people, who must obey the rules, and extraordinary people, like Napoleon, who have the right to break the rules — even to kill — if it helps their great ideas. Raskolnikov wanted to know: was he ordinary, or extraordinary?","Then he received a letter from his mother. His sister, Dounia, was going to marry a rich, unpleasant man, Luzhin, only to help her poor brother. Raskolnikov felt sick with shame and anger. He knew he had to act."],"quotes":[],"words":"<i>owe</i> (to have to pay money back to someone) · <i>pawnbroker</i> (a person who lends money and keeps your things until you pay) · <i>greedy</i> (always wanting more money) · <i>ordinary</i> (normal, not special) · <i>obey</i> (to do what a rule or a person says)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>owed, pawnbroker, greedy, ordinary, obey</i>.","type":"bank","items":[{"q":"Raskolnikov ___ money to his landlady.","blanks":1,"ans":["owed"]},{"q":"The ___ lent money to poor people.","blanks":1,"ans":["pawnbroker"]},{"q":"She always wanted more money. She was ___.","blanks":1,"ans":["greedy"]},{"q":"He believed ___ people must follow the rules.","blanks":1,"ans":["ordinary"]},{"q":"Ordinary people must ___ the law.","blanks":1,"ans":["obey"]}],"bank":["owed","pawnbroker","greedy","ordinary","obey"]},{"id":"B","title":"B. Grammar: second conditional.","instr":"Complete
