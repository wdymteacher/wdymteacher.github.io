<style>
:root{--bg:#f8e6f5;--pink:#ebb3e6;--pink2:#f5d6f2;--blue:#9ccfdc;--blue2:#d7eef4;--yellow:#fbf06a;--yellow2:#fff8c4;--navy:#1f2a5c;--muted:#4f5683;--white:#fffdf9;--good:#2e9e6a;--bad:#d0284b;--mint:#c9f0dc;--orange:#f6b98a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--navy);background:var(--bg);min-height:100vh;line-height:1.5;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.5px);background-size:16px 16px}
.fat{font-family:'Fraunces',serif;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:900;letter-spacing:-.01em}
.hidden{display:none!important}
.top{position:fixed;top:12px;left:12px;z-index:50;display:flex;gap:8px}
.top a{font:700 14px 'DM Sans',system-ui,sans-serif;color:var(--navy);background:var(--white);border:2px solid var(--navy);border-radius:999px;padding:5px 14px;text-decoration:none;box-shadow:2px 2px 0 var(--navy)}
.wrap{max-width:820px;margin:0 auto;padding:60px 16px 70px}
.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--white);border:2px solid var(--navy);border-radius:999px;padding:3px 12px}
h1{font-size:clamp(2rem,7vw,3.1rem);margin:8px 0 4px;color:var(--pink);-webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:4px 4px 0 var(--navy);line-height:1.05}
h2{margin:0 0 6px;font-size:1.35rem}
.lead{margin:6px 0 16px;max-width:640px}
.card{background:var(--white);border:3px solid var(--navy);border-radius:22px;box-shadow:6px 6px 0 var(--navy);padding:18px;margin-bottom:18px}
.btn{font-family:'Fraunces',serif;font-weight:800;font-variation-settings:"SOFT" 100;font-size:1rem;border:2px solid var(--navy);border-radius:999px;padding:7px 16px;box-shadow:3px 3px 0 var(--navy);cursor:pointer;background:var(--yellow);color:var(--navy)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}.btn.alt{background:var(--white)}.btn.sm{font-size:.88rem;padding:4px 12px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.note{font-size:.88rem;color:var(--muted)}
.bar{height:12px;border:2px solid var(--navy);border-radius:999px;background:var(--white);overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
/* shelf */
.lvl{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl h2{margin:0}.lvl span{font-size:.9rem;color:var(--muted)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.bk{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--white);border:3px solid var(--navy);border-radius:16px;box-shadow:4px 4px 0 var(--navy);padding:10px 12px;min-height:96px}
.bk:hover,.bk:focus-visible{background:var(--yellow2)}
.bk .sp{border:2px solid var(--navy);border-radius:6px;position:relative;overflow:hidden}
.bk .sp:before,.bk .sp:after{content:'';position:absolute;left:0;right:0;height:5px;background:rgba(255,253,249,.75)}
.bk .sp:before{top:14px}.bk .sp:after{bottom:14px}
.bk h3{margin:0;font-family:'Fraunces',serif;font-weight:800;font-size:1.06rem;line-height:1.15}
.bk p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.bk .st{font-size:.8rem;font-weight:700;margin-top:4px}
.bk.locked{opacity:.65}
/* book */
.list{display:grid;gap:10px}
.pt{all:unset;cursor:pointer;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--white);border:3px solid var(--navy);border-radius:16px;box-shadow:4px 4px 0 var(--navy);padding:9px 14px}
.pt:hover,.pt:focus-visible{background:var(--yellow2)}
.pt .n{width:42px;height:42px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:900;font-size:1.1rem;background:var(--pink2)}
.pt.done .n{background:var(--mint)}
.pt.lock{cursor:not-allowed;background:#efe7ee;box-shadow:none;opacity:.8}
.pt h3{margin:0;font-size:1.05rem}.pt p{margin:0;font-size:.85rem;color:var(--muted)}
.pt .s{font-weight:700;font-size:.85rem;white-space:nowrap}
/* reading */
.story p{font-size:1.08rem;line-height:1.75;margin:0 0 14px}
.quote{border-left:5px solid var(--pink);background:var(--pink2);border-radius:0 14px 14px 0;padding:10px 14px;margin:0 0 14px;font-size:.98rem}
.words{background:var(--blue2);border-radius:14px;padding:10px 14px;font-size:.95rem}
.ex{border-top:2px dashed var(--navy);padding-top:14px;margin-top:14px}
.ex:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ex h3{margin:0 0 2px;font-family:'Fraunces',serif;font-size:1.12rem}
.ex .ins{margin:0 0 10px;color:var(--muted)}
.it{margin:0 0 12px;line-height:2.1}
.it .num{font-weight:700;margin-right:4px}
select,input.tx{font:inherit;font-weight:700;color:var(--navy);border:0;border-bottom:3px solid var(--navy);background:var(--blue2);border-radius:6px 6px 0 0;padding:1px 6px;max-width:70vw}
input.tx{width:10em}
input.tx.wide{width:min(26em,80vw)}
select:focus,input.tx:focus,textarea:focus{outline:3px solid var(--yellow)}
.ok select,.ok input.tx,select.ok,input.ok{background:var(--mint);border-color:var(--good)}
select.no,input.no{background:#ffd9df;border-color:var(--bad)}
.ch{all:unset;cursor:pointer;border:2px solid var(--navy);border-radius:10px;padding:0 8px;margin:0 2px;background:var(--white);font-weight:600;line-height:1.6;display:inline-block}
.ch.on{background:var(--yellow)}
.ch.right{background:var(--mint);border-color:var(--good)}.ch.wrong{background:#ffd9df;border-color:var(--bad)}
.grp{white-space:nowrap}
.tf{display:inline-flex;gap:6px;margin-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bank span{border:2px solid var(--navy);border-radius:999px;padding:1px 10px;background:var(--yellow2);font-weight:700;font-size:.9rem}
textarea{width:100%;min-height:70px;font:inherit;border:2px solid var(--navy);border-radius:12px;padding:8px 10px;background:var(--white);color:var(--navy);margin-top:4px}
.model{display:block;background:var(--mint);border-radius:10px;padding:4px 10px;font-size:.92rem;line-height:1.45;margin-top:4px}
.fb{display:block;font-size:.9rem;line-height:1.4;color:var(--bad);font-weight:700}
.fb.g{color:var(--good)}
.exst{font-weight:700;font-size:.9rem;margin-left:8px}
.done-box{background:var(--mint);border:3px solid var(--navy);border-radius:18px;padding:14px 16px;text-align:center}
.lockmsg{background:var(--yellow2);border:2px dashed var(--navy);border-radius:14px;padding:10px 14px;font-weight:600}
.pill{display:inline-block;border:2px solid var(--navy);border-radius:999px;padding:0 9px;font-size:.78rem;font-weight:700;background:var(--yellow2)}
</style>
</head>

<script>
const BOOKS=[{"id":"aesop","title":"Aesop's Fables","level":"A1–A2","author":"Aesop (ancient Greece)","color":"#2e9e6a","intro":["Eight famous fables by Aesop, a storyteller from ancient Greece, retold in very simple English (A1/A2). Each fable is short and ends with a <i>moral</i> — the lesson of the story. There are two fables in each part, and the exercises come after them."],"parts":[{"title":"The Tortoise and the Hare · The Lion and the Mouse","label":"Part 1","paras":["<b>1. The Tortoise and the Hare</b>","The Hare was very fast, and he always laughed at the Tortoise. \"You are so slow!\" he said. One day, the Tortoise said, \"Let's have a race.\" The Hare laughed. \"OK! I can win easily.\"","The race started. The Hare ran very fast, and soon the Tortoise was far behind. \"I have a lot of time,\" thought the Hare. \"I can sleep a little.\" He lay down under a tree and fell asleep.","The Tortoise walked slowly, but she never stopped. She walked past the sleeping Hare. When the Hare woke up, he ran very fast — but it was too late. The Tortoise was at the finish line. She won!","<b>Moral:</b> Slow and steady wins the race.","<b>2. The Lion and the Mouse</b>","A big Lion was sleeping. A little Mouse ran over his face, and the Lion woke up. He caught the Mouse with his paw. \"Please don't eat me!\" said the Mouse. \"Let me go, and one day I will help you.\" The Lion laughed. \"How can a little mouse help me?\" But he let the Mouse go.","Some days later, hunters caught the Lion in a big net. He couldn't move. The Mouse heard him and ran to him. She cut the net with her small, sharp teeth, and the Lion was free. \"You laughed at me,\" said the Mouse. \"But now you know: a little mouse can help a big lion.\"","<b>Moral:</b> Little friends can be great friends."],"quotes":[],"words":"<i>tortoise</i> (a slow animal with a hard shell) · <i>hare</i> (an animal like a big rabbit) · <i>net</i> (a thing made of strings to catch animals) · <i>steady</i> (always the same, without stopping)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Opposites. Match.","type":"match","left":["fast","big","sleep","win"],"opts":[["a","wake up"],["b","lose"],["c","slow"],["d","little"]],"ans":["c","d","a","b"]},{"id":"B","title":"B. Grammar: past simple.","instr":"Write the past form.","type":"type","items":[{"q":"The Hare (run) ___ very fast.","blanks":1,"ans":["ran"]},{"q":"He (fall) ___ asleep under a tree.","blanks":1,"ans":["fell"]},{"q":"The Tortoise (win) ___ the race.","blanks":1,"ans":["won"]},{"q":"The Lion (catch) ___ the Mouse.","blanks":1,"ans":["caught"]},{"q":"Hunters (catch) ___ the Lion in a net.","blanks":1,"ans":["caught"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The Hare stopped to sleep.","ans":"T","note":""},{"q":"The Tortoise stopped to sleep too.","ans":"F","note":""},{"q":"The Mouse helped the Lion with her teeth.","ans":"T","note":""}]}]},{"title":"The Fox and the Grapes · The Boy Who Cried Wolf","label":"Part 2","paras":["<b>3. The Fox and the Grapes</b>","One hot day, a hungry Fox saw some beautiful grapes. They were high up on a vine. \"Mmm, those grapes look sweet and juicy!\" he said.","He jumped, but he couldn't reach them. He jumped again and again, higher and higher. But the grapes were too high. Finally, the Fox was tired, and he walked away. \"I don't want those grapes,\" he said. \"They are sour. They aren't good.\"","<b>Moral:</b> It's easy to say you don't want something when you can't have it.","<b>4. The Boy Who Cried Wolf</b>","A young shepherd boy took care of the sheep near his village. He was bored. One day he shouted, \"Wolf! Wolf! A wolf is eating the sheep!\" The people from the village ran to help him. But there was no wolf. The boy laughed.","The next day, he did the same thing. \"Wolf! Wolf!\" The people ran to help again, and again there was no wolf. They were very angry.","Then one evening, a real wolf came. \"Wolf! Wolf! Please help!\" shouted the boy. But this time, nobody came. \"He's lying again,\" they said. And the wolf ate many of the sheep.","<b>Moral:</b> Nobody believes a liar, even when he tells the truth."],"quotes":[],"words":"<i>grapes</i> (small round fruit; we make wine with them) · <i>sour</i> (with a taste like a lemon) · <i>shepherd</i> (a person who takes care of sheep) · <i>liar</i> (a person who doesn't tell the truth)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>sour, liar, shepherd, reach</i>.","type":"bank","items":[{"q":"The grapes were too high. The Fox couldn't ___ them.","blanks":1,"ans":["reach"]},{"q":"\"They're ___,\" said the Fox.","blanks":1,"ans":["sour"]},{"q":"The boy took care of sheep. He was a ___.","blanks":1,"ans":["shepherd"]},{"q":"The boy didn't tell the truth. He was a ___.","blanks":1,"ans":["liar"]}],"bank":["sour","liar","shepherd","reach"]},{"id":"B","title":"B. Grammar: could / couldn't.","instr":"Complete with <i>could</i> or <i>couldn't</i>.","type":"bank","items":[{"q":"The Fox jumped, but he ___ reach the grapes.","blanks":1,"ans":["couldn't"]},{"q":"The people ___ hear the boy, but they didn't come.","blanks":1,"ans":["could"]},{"q":"The boy ___ stop the wolf alone.","blanks":1,"ans":["couldn't"]}],"bank":["could","couldn't"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did the Fox say the grapes were sour?","model":"Because he couldn't reach them."},{"q":"How many times did the boy lie?","model":"Two times."},{"q":"Why didn't the people come the last time?","model":"Because they thought he was lying again."}]}]},{"title":"The Ant and the Grasshopper · The Crow and the Pitcher","label":"Part 3","paras":["<b>5. The Ant and the Grasshopper</b>","It was summer. The Grasshopper sang and played all day in the sun. The Ant worked all day. She carried food to her home, again and again. \"Why do you work so hard?\" asked the Grasshopper. \"Come and sing with me!\" \"I'm saving food for the winter,\" said the Ant. \"You should do it too.\" But the Grasshopper only laughed.","Then winter came. It was cold, and there was snow everywhere. The Grasshopper had no food, and he was very hungry. He went to the Ant's house. \"Please give me some food,\" he said. \"What did you do all summer?\" asked the Ant. \"I sang,\" said the Grasshopper. \"Well,\" said the Ant, \"now you can dance!\"","<b>Moral:</b> Work today, and you will have what you need tomorrow.","<b>6. The Crow and the Pitcher</b>","It was a very hot day, and a Crow was very thirsty. She found a pitcher with a little water at the bottom. But her beak was too short, and she couldn't reach the water.","The Crow had an idea. She picked up a small stone and dropped it into the pitcher. Then another, and another. With every stone, the water came up a little. Finally, the water was at the top, and the Crow could drink.","<b>Moral:</b> When you need something, you can find a clever way to get it."],"quotes":[],"words":"<i>grasshopper</i> (a green insect that jumps and makes music) · <i>save</i> (to keep for later) · <i>pitcher</i> (a big container for water) · <i>thirsty</i> (wanting to drink)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>thirsty, save, clever, hungry</i>.","type":"bank","items":[{"q":"The Crow wanted water. She was ___.","blanks":1,"ans":["thirsty"]},{"q":"The Grasshopper had no food. He was ___.","blanks":1,"ans":["hungry"]},{"q":"The Ant wanted to ___ food for the winter.","blanks":1,"ans":["save"]},{"q":"The Crow had a good idea. She was ___.","blanks":1,"ans":["clever"]}],"bank":["thirsty","save","clever","hungry"]},{"id":"B","title":"B. Grammar: present simple vs past simple.","instr":"Choose.","type":"choose","items":[{"segs":["Every summer, the Ant ",["works","worked"]," all day."],"ans":[["works"]]},{"segs":["Last winter, the Grasshopper ",["has","had"]," no food."],"ans":[["had"]]},{"segs":["Crows ",["are","were"]," very intelligent birds."],"ans":[["are"]]},{"segs":["The Crow ",["drops","dropped"]," stones into the pitcher."],"ans":[["dropped"]]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The Grasshopper worked hard in the summer.","ans":"F","note":""},{"q":"The Ant gave food to the Grasshopper.","ans":"F","note":""},{"q":"The Crow used stones to get the water.","ans":"T","note":""}]}]},{"title":"The Town Mouse and the Country Mouse · The North Wind and the Sun","label":"Part 4","paras":["<b>7. The Town Mouse and the Country Mouse</b>","A Country Mouse invited her friend, the Town Mouse, to her home in the country. She gave him simple food: some bread, some corn and some cheese. \"This food is so boring!\" said the Town Mouse. \"Come to the city with me. I'll show you a better life.\"","In the city, the Town Mouse lived in a big house. There was a lot of delicious food on the table: cake, meat, fruit. The two mice started to eat. But suddenly, the door opened and a big dog ran in! Then a cat! The mice ran and hid in a small hole. They were very scared.","\"Goodbye, my friend,\" said the Country Mouse. \"You have nice food, but I prefer my simple food in peace.\"","<b>Moral:</b> A simple, quiet life is better than a rich life full of fear.","<b>8. The North Wind and the Sun</b>","The North Wind and the Sun had an argument. \"I'm stronger than you!\" said the Wind. \"No, I'm stronger!\" said the Sun. Then they saw a man walking on the road. He was wearing a coat. \"Let's see who can take the man's coat off,\" said the Sun.","The Wind went first. He blew and blew, very hard and very cold. But the man held his coat more and more tightly. Then it was the Sun's turn. The Sun came out and shone gently and warmly. The man got hot, and soon he took off his coat.","<b>Moral:</b> Kindness can do more than force."],"quotes":[],"words":"<i>country</i> (outside the city, with farms and fields) · <i>peace</i> (quiet, with no problems) · <i>blow</i> (what the wind does) · <i>kindness</i> (being nice and gentle)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"City or country? Choose.","type":"choose","items":[{"segs":["farms ",["city","country"],""],"ans":[["country"]]},{"segs":["big buildings ",["city","country"],""],"ans":[["city"]]},{"segs":["a lot of cars ",["city","country"],""],"ans":[["city"]]},{"segs":["fields and cows ",["city","country"],""],"ans":[["country"]]}]},{"id":"B","title":"B. Grammar: comparatives.","instr":"Complete.","type":"type","items":[{"q":"The Sun said, \"I'm (strong) ___ than you!\"","blanks":1,"ans":["stronger"]},{"q":"City food was (delicious) ___ than country food.","blanks":1,"ans":["more delicious"]},{"q":"Country life was (quiet) ___ than city life.","blanks":1,"ans":["quieter"]},{"q":"The Wind blew (hard) ___ and ___, but the man held his coat.","blanks":2,"ans":["harder","harder"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did the Country Mouse go home?","model":"Because life in the city was scary (the dog and the cat)."},{"q":"What did the Wind do to take off the man's coat?","model":"He blew very hard and cold."},{"q":"Who won, the Wind or the Sun? Why?","model":"The Sun, because it was warm and gentle."}]}]}]},{"id":"alice","title":"Alice in Wonderland","level":"A2","author":"Lewis Carroll (1865)","color":"#9ccfdc","intro":["An A2 version of <i>Alice's Adventures in Wonderland</i> (Lewis Carroll, 1865), in 12 short chapters of about 250 words each. The original text is in the public domain; this adaptation keeps the story and the famous moments, with short sentences, mostly past simple, and everyday words. Each chapter ends with a few new words."],"parts":[{"title":"Down the Rabbit Hole","label":"Chapter 1","paras":["It was a hot summer day. Alice was sitting by the river with her sister. Her sister was reading a book, but the book had no pictures. \"What is the use of a book without pictures?\" Alice thought. She was bored and sleepy.","Suddenly, a White Rabbit with pink eyes ran past her. That was not very strange. But then the Rabbit said, \"Oh dear! Oh dear! I'm going to be late!\" And he took a watch out of his pocket and looked at it. Alice jumped up. She never saw a rabbit with a pocket or a watch before!","She ran after him across the field. The Rabbit went down a big hole under a tree, and Alice went down after him. She didn't think about how to get out again.","The hole was very, very deep. Alice fell slowly, and she had time to look around. There were cupboards and bookshelves on the walls. \"Will I fall through the whole Earth?\" she thought. \"Maybe I will come out in Australia!\"","Then, bump! She landed on some dry leaves. She wasn't hurt. She saw the White Rabbit at the end of a long hall. \"Oh, my ears and whiskers, it's late!\" he said, and he disappeared.","Alice was in a long hall with many doors, but all the doors were locked. On a glass table, she found a tiny gold key. It opened a very small door, only 40 centimeters high. Behind the door, there was a beautiful garden with flowers and fountains. But Alice was too big to go through.","Then she saw a little bottle on the table. It said \"DRINK ME.\" Alice drank it, and she got smaller and smaller, until she was only 25 centimeters tall! But oh no — she forgot the key on the table, and now she was too small to reach it. Under the table, she found a little cake. It said \"EAT ME.\" So she ate it."],"quotes":[],"words":"<i>rabbit hole</i> (a hole where rabbits live) · <i>bored</i> (with nothing interesting to do) · <i>locked</i> (closed with a key) · <i>tiny</i> (very, very small)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>bored, tiny, locked, hole</i>.","type":"bank","items":[{"q":"The Rabbit went down a big ___ under a tree.","blanks":1,"ans":["hole"]},{"q":"Alice had nothing to do. She was ___.","blanks":1,"ans":["bored"]},{"q":"All the doors were ___. Alice couldn't open them.","blanks":1,"ans":["locked"]},{"q":"The gold key was very, very small. It was ___.","blanks":1,"ans":["tiny"]}],"bank":["bored","tiny","locked","hole"]},{"id":"B","title":"B. Grammar: past simple (irregular verbs).","instr":"Write the past form.","type":"type","items":[{"q":"Alice (see) ___ a White Rabbit.","blanks":1,"ans":["saw"]},{"q":"She (fall) ___ down the hole.","blanks":1,"ans":["fell"]},{"q":"She (find) ___ a little key.","blanks":1,"ans":["found"]},{"q":"She (drink) ___ from the bottle and she (eat) ___ the cake.","blanks":2,"ans":["drank","ate"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Alice's sister was reading a book with pictures.","ans":"F","note":""},{"q":"The Rabbit had a watch.","ans":"T","note":""},{"q":"After she drank from the bottle, Alice was very big.","ans":"F","note":"she was very small"}]}]},{"title":"The Pool of Tears","label":"Chapter 2","paras":["\"Curiouser and curiouser!\" cried Alice. After she ate the cake, she started to grow. She grew and grew, until her head hit the ceiling. She was almost three meters tall! \"Goodbye, feet!\" she said, because her feet were very far away now.","She took the little gold key, but now she was much too big for the little door. She could only look at the garden with one eye. Alice sat down and started to cry. She cried and cried, and her big tears made a pool of water all around her.","Then the White Rabbit came back. He was wearing nice clothes, and he had a pair of white gloves and a fan in his hands. \"Oh! The Duchess, the Duchess!\" he said. \"She will be so angry if I'm late!\"","\"Excuse me, sir—\" said Alice. The Rabbit jumped, dropped his gloves and his fan, and ran away very fast.","Alice picked up the fan. It was very hot, so she used it. And while she used the fan, she started to get smaller again! She was soon very small, and she quickly put the fan down.","Then her foot slipped, and splash! She fell into the salty water. It was the pool of her own tears! \"I wish I didn't cry so much!\" said Alice, swimming.","Something was swimming near her. Was it a walrus? No, it was only a Mouse. \"Do you speak English, Mouse?\" asked Alice. She told him about her cat, Dinah. \"She's very good at catching mice!\" The Mouse was very angry. \"Cats! Don't talk about cats!\" he said. Alice said sorry.","The pool was full of animals now: a Duck, a Dodo, a Parrot and an Eagle. Alice and the animals all swam to the shore together."],"quotes":[],"words":"<i>grow</i> (to get bigger) · <i>tears</i> (water from your eyes when you cry) · <i>pool</i> (a small area of water) · <i>slip</i> (to fall because the floor is wet)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["grow","tears","slip","shore"],"opts":[["a","water from your eyes when you cry"],["b","the land next to the water"],["c","to get bigger"],["d","to fall because the floor is wet"]],"ans":["c","a","d","b"]},{"id":"B","title":"B. Grammar: too + adjective.","instr":"Complete with <i>too big</i> or <i>too small</i>.","type":"bank","items":[{"q":"Alice was almost three meters tall. She was ___ for the little door.","blanks":1,"ans":["too big"]},{"q":"After she used the fan, she was ___ to reach the key.","blanks":1,"ans":["too small"]},{"q":"In the pool, Alice was ___ to see over the water.","blanks":1,"ans":["too small"]}],"bank":["too big","too small"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Alice cry?","model":"She was too big for the door to the garden."},{"q":"What did the White Rabbit drop?","model":"His gloves and his fan."},{"q":"Why was the Mouse angry with Alice?","model":"Because Alice talked about her cat."}]}]},{"title":"A Race and a Long Tale","label":"Chapter 3","paras":["Alice and the animals sat on the shore. They were all wet and cold. \"How can we get dry?\" they asked.","\"The best thing to get dry,\" said the Dodo, \"is a Caucus-race.\" He drew a circle on the ground. \"What is a Caucus-race?\" asked Alice. \"The best way to explain it is to do it,\" said the Dodo.","There were no rules. Everybody started running when they wanted, and stopped when they wanted. After half an hour, they were all dry. \"The race is over!\" shouted the Dodo. \"But who won?\" asked the animals. The Dodo thought for a long time. Then he said, \"Everybody won, and everybody must get a prize!\"","\"But who will give the prizes?\" they asked. \"She will, of course,\" said the Dodo, and he pointed at Alice. Alice had a box of sweets in her pocket, so she gave one sweet to each animal. \"But she must have a prize too,\" said the Mouse. Alice only had a thimble in her pocket. The Dodo took it and gave it back to her very seriously: \"Please accept this beautiful thimble.\" Alice wanted to laugh, but everybody was so serious!","Then Alice asked the Mouse to tell his story. \"Mine is a long and sad tale,\" he said. \"It's a long tail, yes,\" said Alice, looking at his tail. She wasn't listening carefully, and the Mouse got angry and walked away.","\"I wish Dinah was here,\" said Alice. \"She can bring him back.\" \"Who is Dinah?\" asked the Parrot. \"My cat. She catches birds too!\" Oh no! All the birds were scared, and they quickly went home. Alice was alone again, and she felt very sad."],"quotes":[],"words":"<i>race</i> (a competition to see who is the fastest) · <i>prize</i> (something you get when you win) · <i>tale</i> (a story) · <i>tail</i> (the long part at the back of an animal)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"<i>Tale</i> or <i>tail</i>? Complete.","type":"bank","items":[{"q":"A mouse has a long ___.","blanks":1,"ans":["tail"]},{"q":"The Mouse told a long, sad ___.","blanks":1,"ans":["tale"]},{"q":"My grandmother tells me a ___ before I sleep.","blanks":1,"ans":["tale"]}],"bank":["Tale","tail"]},{"id":"B","title":"B. Grammar: past simple questions.","instr":"Make questions with <i>Did</i>.","type":"type","items":[{"q":"the animals / get dry? → <i>Did the animals get dry?</i>","blanks":1,"example":true},{"q":"Alice / give / the prizes? → ___","blanks":1,"ans":["Did Alice give the prizes?"]},{"q":"the Mouse / tell / his story? → ___","blanks":1,"ans":["Did the Mouse tell his story?"]},{"q":"the birds / stay / with Alice? → ___","blanks":1,"ans":["Did the birds stay with Alice?"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The Caucus-race had a lot of rules.","ans":"F","note":""},{"q":"Everybody won the race.","ans":"T","note":""},{"q":"The birds were happy to hear about Dinah.","ans":"F","note":""}]}]},{"title":"The White Rabbit's House","label":"Chapter 4","paras":["The White Rabbit came back. He was looking for something. \"The Duchess! Where are my gloves and my fan?\" Then he saw Alice. \"Mary Ann!\" he shouted. \"What are you doing here? Run home and get me a pair of gloves and a fan! Quick!\" He thought Alice was his housemaid. Alice was too surprised to say no, so she ran to his house.","It was a small, pretty house. In a bedroom, Alice found a fan and some gloves. Next to them, there was another little bottle. This one didn't say \"DRINK ME\", but Alice drank it anyway. \"Something interesting always happens when I eat or drink something,\" she thought.","She grew and grew and grew! Soon her head was touching the ceiling, one arm was out of the window and one foot was up the chimney. She couldn't move at all.","The Rabbit came home. \"Mary Ann! Where are my gloves?\" But he couldn't open the door, because Alice's arm was in the way. He called his gardener, Pat, and a lizard called Bill. They put a ladder on the house, and Bill went down the chimney. Alice gave a little kick, and Bill flew up into the sky!","Then the animals threw little stones through the window. But the stones turned into little cakes on the floor. \"If I eat one, maybe I'll get smaller,\" Alice thought. She ate a cake, and she got smaller. She ran out of the house and into the forest.","In the forest, she saw a giant puppy. It was very big, and she was very small! She played with it with a stick, and then she ran away. Then she saw a big mushroom. On top of the mushroom, a blue caterpillar was sitting."],"quotes":[],"words":"<i>housemaid</i> (a woman who cleans a house for a job) · <i>chimney</i> (the tube on a roof for smoke) · <i>ladder</i> (you climb it to go up) · <i>mushroom</i> (a plant that looks like a little umbrella)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>chimney, ladder, mushroom, window</i>.","type":"bank","items":[{"q":"Alice's arm was out of the ___.","blanks":1,"ans":["window"]},{"q":"Bill the lizard went down the ___.","blanks":1,"ans":["chimney"]},{"q":"They climbed up the house on a ___.","blanks":1,"ans":["ladder"]},{"q":"The Caterpillar was sitting on a big ___.","blanks":1,"ans":["mushroom"]}],"bank":["chimney","ladder","mushroom","window"]},{"id":"B","title":"B. Grammar: past continuous.","instr":"Complete with <i>was</i> or <i>were</i> + -ing.","type":"type","items":[{"q":"The White Rabbit ___ (look) for his gloves.","blanks":1,"ans":["was looking"]},{"q":"Alice ___ (stand) in the bedroom when she drank the bottle.","blanks":1,"ans":["was standing"]},{"q":"The animals ___ (throw) stones through the window.","blanks":1,"ans":["were throwing"]},{"q":"The Caterpillar ___ (sit) on a mushroom.","blanks":1,"ans":["was sitting"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Who did the Rabbit think Alice was?","model":"Mary Ann, his housemaid."},{"q":"What happened to the stones on the floor?","model":"They turned into little cakes."},{"q":"What did Alice see in the forest?","model":"A giant puppy (and a caterpillar on a mushroom)."}]}]},{"title":"The Caterpillar","label":"Chapter 5","paras":["The Caterpillar looked at Alice for a long time. Then he asked in a slow, sleepy voice, \"Who are you?\"","\"I… I don't really know, sir,\" said Alice. \"I knew who I was this morning, but I changed many times since then.\" \"Explain yourself!\" said the Caterpillar. \"I can't,\" said Alice. \"Being so many different sizes in one day is very confusing.\" \"It isn't,\" said the Caterpillar.","\"Well, maybe not for you,\" said Alice. \"But one day you'll turn into a butterfly. Won't that feel a little strange?\" \"Not at all,\" said the Caterpillar.","Alice tried to say a poem for him, but all the words came out wrong. \"That is not right,\" said the Caterpillar. \"It is wrong from beginning to end.\"","\"What size do you want to be?\" he asked. \"I don't mind,\" said Alice, \"but I don't like changing so often. And I'd like to be a little bigger. Eight centimeters is a terrible height.\" \"It is a very good height!\" said the Caterpillar angrily. He was exactly eight centimeters tall.","Then he got down from the mushroom and walked away into the grass. \"One side will make you taller, and the other side will make you shorter,\" he said. \"One side of what?\" Alice thought. \"Of the mushroom,\" said the Caterpillar, and he disappeared.","Alice took a piece from each side of the mushroom. She ate a little from one piece, and she got very small. She ate a little from the other piece, and her neck grew very, very long, like a snake! A bird flew at her. \"Snake! Snake!\" it cried. \"I'm not a snake!\" said Alice. Slowly, she ate a little from each piece, until she was her normal size again."],"quotes":[],"words":"<i>caterpillar</i> (a small animal that becomes a butterfly) · <i>confusing</i> (difficult to understand) · <i>height</i> (how tall you are) · <i>neck</i> (the part between your head and your body)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>confusing, height, neck, butterfly</i>.","type":"bank","items":[{"q":"One day, the Caterpillar will turn into a ___.","blanks":1,"ans":["butterfly"]},{"q":"Changing sizes all day is very ___.","blanks":1,"ans":["confusing"]},{"q":"Eight centimeters is a terrible ___ for Alice.","blanks":1,"ans":["height"]},{"q":"Alice's ___ grew very long, like a snake.","blanks":1,"ans":["neck"]}],"bank":["confusing","height","neck","butterfly"]},{"id":"B","title":"B. Grammar: comparatives.","instr":"Complete with the comparative form.","type":"type","items":[{"q":"Alice wanted to be a little (big) ___.","blanks":1,"ans":["bigger"]},{"q":"One side of the mushroom makes you (tall) ___.","blanks":1,"ans":["taller"]},{"q":"The other side makes you (short) ___.","blanks":1,"ans":["shorter"]},{"q":"Alice's neck was (long) ___ than a snake!","blanks":1,"ans":["longer"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Alice knew exactly who she was.","ans":"F","note":""},{"q":"The Caterpillar was eight centimeters tall.","ans":"T","note":""},{"q":"The bird thought Alice was a snake.","ans":"T","note":""}]}]},{"title":"The Duchess and the Cheshire Cat","label":"Chapter 6","paras":["Alice found a little house in the forest. A Fish was standing at the door with a letter. \"For the Duchess,\" he said to a Frog. \"An invitation from the Queen to play croquet.\"","Alice went into the house. The kitchen was full of smoke and pepper. Everybody was sneezing! The Duchess was sitting on a chair with a baby, and the cook was making soup with too much pepper. The baby was crying and sneezing. Only the cook and a big cat didn't sneeze. The cat was smiling from ear to ear.","\"Why is your cat smiling like that?\" asked Alice. \"It's a Cheshire cat,\" said the Duchess. \"That's why.\"","Suddenly, the cook started throwing plates and pans at the Duchess and the baby. Then the Duchess threw the baby to Alice. \"Here, you can hold it!\" she said. \"I must go and play croquet with the Queen.\"","Alice took the baby outside. But the baby was strange. Its nose was very small, and it was making funny noises. Alice looked again. It wasn't a baby. It was a pig! She put it down, and it walked happily into the forest.","Then Alice saw the Cheshire Cat in a tree, smiling. \"Which way should I go from here?\" she asked. \"That depends on where you want to go,\" said the Cat. \"I don't really care where—\" \"Then it doesn't matter which way you go,\" said the Cat.","\"The Hatter lives this way, and the March Hare lives that way,\" said the Cat. \"They're both mad. We're all mad here. I'm mad. You're mad.\" \"How do you know I'm mad?\" asked Alice. \"You must be,\" said the Cat, \"or you wouldn't come here.\"","Then the Cat slowly disappeared. First its tail disappeared, then its body, and the smile was the last thing to go. \"I often saw a cat without a smile,\" thought Alice, \"but never a smile without a cat!\""],"quotes":[],"words":"<i>sneeze</i> (\"Achoo!\" — what you do when you have pepper in your nose) · <i>invitation</i> (a letter that asks you to come to a party or event) · <i>mad</i> (crazy) · <i>disappear</i> (to go away so nobody can see you)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["sneeze","invitation","mad","disappear"],"opts":[["a","crazy"],["b","to go away so nobody can see you"],["c","\"Achoo!\""],["d","a letter that asks you to come"]],"ans":["c","d","a","b"]},{"id":"B","title":"B. Grammar: can / can't / could / couldn't.","instr":"Choose the right word.","type":"choose","items":[{"segs":["Everybody was sneezing. They ",["could","couldn't"]," stop."],"ans":[["couldn't"]]},{"segs":["\"",["Can","Could"]," you tell me which way to go?\" asked Alice."],"ans":[["Can","Could"]]},{"segs":["The Cat ",["can","can't"]," disappear. Only its smile stays!"],"ans":[["can"]]},{"segs":["Alice ",["could","couldn't"]," believe it. The baby was a pig!"],"ans":[["couldn't"]]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why was everybody in the kitchen sneezing?","model":"Because there was too much pepper."},{"q":"What happened to the baby?","model":"It turned into a pig."},{"q":"What was the last part of the Cat to disappear?","model":"Its smile."}]}]},{"title":"A Mad Tea Party","label":"Chapter 7","paras":["In front of the March Hare's house, there was a big table under a tree. The March Hare and the Hatter were having tea. A Dormouse was sleeping between them. The table was very big, but all three were sitting at one corner. \"No room! No room!\" they shouted when they saw Alice. \"There's a lot of room!\" said Alice, and she sat down in a big armchair.","\"Have some wine,\" said the March Hare. Alice looked at the table. There was only tea. \"I don't see any wine,\" she said. \"There isn't any,\" said the March Hare. \"Then it wasn't very polite of you to offer it,\" said Alice angrily.","The Hatter looked at Alice and asked, \"Why is a raven like a writing desk?\" \"I like riddles!\" thought Alice. \"I think I can answer that.\" But after some time she said, \"I give up. What's the answer?\" \"I have no idea,\" said the Hatter.","The Hatter took out his watch. \"What day is it?\" he asked. His watch didn't show the time; it showed the day of the month. It was two days wrong. \"I told you butter wasn't good for the watch!\" he said to the March Hare.","The Hatter explained that he and Time had an argument. Now, at his house, it was always six o'clock — always tea time! There was no time to wash the cups, so they moved around the table to clean places.","The Dormouse woke up and started a story about three sisters who lived at the bottom of a well. But the story didn't make sense, and the others were very rude. Finally, Alice stood up and left. \"That's the silliest tea party in all my life!\" she said. Then she saw a door in a tree. She went through it, and she was back in the long hall. This time, she used the key and the mushroom, and at last she walked into the beautiful garden."],"quotes":[],"words":"<i>tea party</i> (a meeting with friends to drink tea) · <i>polite</i> (nice and respectful) · <i>riddle</i> (a funny question that is difficult to answer) · <i>rude</i> (not polite)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>polite, rude, riddle, give up</i>.","type":"bank","items":[{"q":"It's ___ to interrupt people when they are talking.","blanks":1,"ans":["rude"]},{"q":"Say \"please\" and \"thank you\". Be ___!","blanks":1,"ans":["polite"]},{"q":"Here's a ___: what has hands but can't clap?","blanks":1,"ans":["riddle"]},{"q":"This puzzle is too difficult. I ___!","blanks":1,"ans":["give up"]}],"bank":["polite","rude","riddle","give up"]},{"id":"B","title":"B. Grammar: there is / there are / some / any.","instr":"Choose the right word.","type":"choose","items":[{"segs":["There ",["is","are"]," a big table under the tree."],"ans":[["is"]]},{"segs":["There ",["is","are"]," three friends at the table."],"ans":[["are"]]},{"segs":["\"Have ",["some","any"]," tea,\" said the Hatter."],"ans":[["some"]]},{"segs":["\"I don't see ",["some","any"]," wine,\" said Alice."],"ans":[["any"]]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"There was a lot of room at the table.","ans":"T","note":"but they said \"No room!\""},{"q":"The Hatter knew the answer to his riddle.","ans":"F","note":""},{"q":"At the Hatter's house, it was always six o'clock.","ans":"T","note":""}]}]},{"title":"The Queen's Croquet Game","label":"Chapter 8","paras":["In the garden, there was a big rose tree. The roses were white, but three gardeners were painting them red. They looked like playing cards: they were flat, with hands and feet at the corners. \"Why are you painting the roses?\" asked Alice. \"We planted white roses by mistake,\" said one gardener. \"The Queen wanted red ones. If she finds out, she will cut off our heads!\"","Just then, the Queen arrived with the King and lots of other cards. The White Rabbit was there too. The gardeners lay down on their faces. The Queen looked at the roses and screamed, \"Off with their heads!\" But Alice hid the gardeners in a big flowerpot.","\"Can you play croquet?\" shouted the Queen. \"Yes!\" said Alice. \"Then come on!\" It was the strangest croquet game in the world. The balls were hedgehogs, the mallets were flamingos, and the hoops were soldiers. The flamingos kept turning their heads to look at Alice. The hedgehogs kept walking away. Everybody played at the same time, and the Queen was angry all the time. \"Off with his head!\" \"Off with her head!\" she shouted, again and again.","Then Alice saw a smile in the air. It was the Cheshire Cat! Slowly, its head appeared, but not its body. \"How are you getting on?\" asked the Cat. \"I don't think they play fairly,\" said Alice quietly.","The King didn't like the Cat. \"It must go!\" he said. \"Off with its head!\" said the Queen. But how can you cut off a head when there's no body? Everybody argued about it. And while they were arguing, the Cat slowly disappeared."],"quotes":[],"words":"<i>paint</i> (to put color on something) · <i>scream</i> (to shout very loudly) · <i>hedgehog</i> (a small animal with spikes on its back) · <i>argue</i> (to talk angrily because you don't agree)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["paint","scream","hide","argue"],"opts":[["a","to put something where nobody can see it"],["b","to shout very loudly"],["c","to talk angrily because you don't agree"],["d","to put color on something"]],"ans":["d","b","a","c"]},{"id":"B","title":"B. Grammar: imperatives.","instr":"The Queen gives orders. Complete with: <i>come, paint, cut off, don't touch</i>.","type":"bank","items":[{"q":"\"___ the roses red!\"","blanks":1,"ans":["Paint"]},{"q":"\"___ my flamingo!\"","blanks":1,"ans":["Don't touch"]},{"q":"\"___ his head!\"","blanks":1,"ans":["Cut off"]},{"q":"\"___ on! Let's play!\"","blanks":1,"ans":["Come"]}],"bank":["come","paint","cut off","don't touch"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why were the gardeners painting the roses?","model":"Because they planted white roses by mistake."},{"q":"What did they use as balls in the croquet game?","model":"Hedgehogs."},{"q":"Why couldn't they cut off the Cat's head?","model":"Because there was no body."}]}]},{"title":"The Mock Turtle","label":"Chapter 9","paras":["The Duchess was at the croquet ground too. This time she was very friendly. She walked with Alice and held her arm. \"Everything has a moral, if you can find it,\" she said, again and again. Alice didn't like her very much, because her chin was very sharp and it hurt Alice's shoulder.","Then the Queen arrived, and the Duchess ran away. \"Have you seen the Mock Turtle?\" the Queen asked Alice. \"No,\" said Alice. \"I don't even know what a Mock Turtle is.\" \"Come on, then,\" said the Queen. \"He will tell you his story.\"","They found a Gryphon sleeping in the sun. A Gryphon is half eagle and half lion. \"Up, lazy thing!\" said the Queen. \"Take this young lady to the Mock Turtle.\" The Mock Turtle was sitting alone on a rock by the sea. He was very sad, and he was crying.","\"Once,\" said the Mock Turtle with a deep sigh, \"I was a real Turtle.\" Then he was quiet for a long time. Finally, he told Alice about his school under the sea. \"We went to school in the sea. Our teacher was an old Turtle. We called him Tortoise.\" \"Why did you call him Tortoise, if he wasn't one?\" asked Alice. \"We called him Tortoise because he taught us!\" said the Mock Turtle angrily.","He told her about his lessons: Reeling and Writhing, and different kinds of Arithmetic. \"And how many hours a day did you do lessons?\" asked Alice. \"Ten hours the first day,\" said the Mock Turtle, \"nine the next, and so on.\" \"What a strange plan!\" said Alice. \"That's why they're called lessons,\" said the Gryphon. \"Because they lessen from day to day.\""],"quotes":[],"words":"<i>friendly</i> (nice to other people) · <i>moral</i> (the lesson that a story teaches) · <i>lazy</i> (doesn't want to work) · <i>sigh</i> (a long, sad breath)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>friendly, lazy, sad, alone</i>.","type":"bank","items":[{"q":"The Mock Turtle was crying. He was very ___.","blanks":1,"ans":["sad"]},{"q":"Nobody was with him. He was sitting ___.","blanks":1,"ans":["alone"]},{"q":"The Gryphon was sleeping in the sun. The Queen said he was ___.","blanks":1,"ans":["lazy"]},{"q":"This time the Duchess was nice to Alice. She was very ___.","blanks":1,"ans":["friendly"]}],"bank":["friendly","lazy","sad","alone"]},{"id":"B","title":"B. Grammar: used to.","instr":"The Mock Turtle talks about his past. Make sentences with <i>used to</i>.","type":"type","items":[{"q":"I / be / a real Turtle → <i>I used to be a real Turtle.</i>","blanks":1,"example":true},{"q":"We / go / to school in the sea → ___","blanks":1,"ans":["We used to go to school in the sea"]},{"q":"Our teacher / be / an old Turtle → ___","blanks":1,"ans":["Our teacher used to be an old Turtle"]},{"q":"We / have / lessons every day → ___","blanks":1,"ans":["We used to have lessons every day"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The Duchess was friendly to Alice in this chapter.","ans":"T","note":""},{"q":"A Gryphon is half eagle and half lion.","ans":"T","note":""},{"q":"The Mock Turtle was very happy.","ans":"F","note":""}]}]},{"title":"The Lobster Dance","label":"Chapter 10","paras":["The Mock Turtle sighed again. \"You probably haven't lived much under the sea,\" he said. \"So you don't know about the Lobster Quadrille. It's a wonderful dance!\"","\"What kind of dance is it?\" asked Alice. The Gryphon explained: \"First, you make a line on the beach. Then you dance forward two times with a lobster. Then you change lobsters. Then you throw the lobsters into the sea, as far as you can! And then you swim after them!\"","\"Shall we show her?\" said the Mock Turtle. \"We can do it without lobsters.\" So the Gryphon and the Mock Turtle danced slowly around Alice. Sometimes they stepped on her feet. The Mock Turtle sang a sad song about a whiting and a snail.","\"Thank you, it's a very interesting dance,\" said Alice. She was happy that it was over.","Then the Gryphon said, \"Now tell us about your adventures.\" So Alice told them everything, from the moment she saw the White Rabbit. When she said that the poems always came out wrong, the Mock Turtle said, \"That's very curious.\" \"It's all very curious,\" said the Gryphon.","The Mock Turtle started another song, \"Beautiful Soup\". But then they heard a shout in the distance: \"The trial is beginning!\" \"Come on!\" cried the Gryphon. He took Alice by the hand and ran with her, without waiting for the end of the song."],"quotes":[],"words":"<i>beach</i> (the sand next to the sea) · <i>lobster</i> (a sea animal with big claws) · <i>adventure</i> (an exciting experience) · <i>trial</i> (when a judge decides if someone did something wrong)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["lobster","turtle","whiting","flamingo"],"ans":"flamingo","note":"not a sea animal"},{"opts":["dance","sing","song","swim"],"ans":"song","note":"not a verb"},{"opts":["beach","sea","sand","soup"],"ans":"soup","note":"not a place"}]},{"id":"B","title":"B. Grammar: sequence words.","instr":"Put the dance in order. Complete with: <i>first, then, after that, finally</i>.","type":"bank","items":[{"q":"___ you change lobsters.","blanks":1,"ans":["Then"]},{"q":"___ you make a line on the beach.","blanks":1,"ans":["First"]},{"q":"___ you swim after the lobsters.","blanks":1,"ans":["Finally"]},{"q":"___ you throw the lobsters into the sea.","blanks":1,"ans":["After that"]}],"bank":["first","then","after that","finally"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What did the Gryphon and the Mock Turtle use for the dance?","model":"Nothing — they danced without lobsters."},{"q":"What did Alice tell them about?","model":"Her adventures."},{"q":"Why did they stop the song?","model":"Because the trial was beginning."}]}]},{"title":"Who Stole the Tarts?","label":"Chapter 11","paras":["The King and Queen of Hearts were sitting on their thrones. All the animals and cards were there. In the middle of the room, there was a table with a big plate of tarts. They looked so good! The Knave of Hearts was standing in front of the King and Queen, with soldiers next to him.","The King was the judge. Twelve animals were the jury. They were writing their names on little boards, because they were afraid to forget them. Then the White Rabbit read the accusation: \"The Queen of Hearts made some tarts on a summer day. The Knave of Hearts stole those tarts and took them all away!\"","\"Call the first witness!\" said the King. The first witness was the Hatter. He came in with a teacup in one hand and some bread and butter in the other. \"Sorry, Your Majesty,\" he said. \"I didn't finish my tea when they called me.\" \"Take off your hat,\" said the King. \"It isn't mine,\" said the Hatter. \"I sell hats. I don't have any of my own.\"","The Hatter was very nervous. He couldn't answer the King's questions. While he was talking, Alice felt something strange. She was growing again!","The next witness was the Duchess's cook. She had a pepper pot in her hand, and everybody started to sneeze. \"What are tarts made of?\" asked the King. \"Pepper, mostly,\" said the cook. But then she disappeared.","The King looked at his list. \"Call the next witness!\" The White Rabbit looked at the list too and read in a loud voice: \"Alice!\""],"quotes":[],"words":"<i>steal / stole</i> (to take something that isn't yours) · <i>tarts</i> (small pies with fruit or jam) · <i>judge</i> (the person who decides in a trial) · <i>witness</i> (a person who saw something and tells the judge)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>judge, jury, witness, stole</i>.","type":"bank","items":[{"q":"The Knave of Hearts ___ the tarts.","blanks":1,"ans":["stole"]},{"q":"The King was the ___.","blanks":1,"ans":["judge"]},{"q":"Twelve animals were the ___.","blanks":1,"ans":["jury"]},{"q":"The Hatter was the first ___.","blanks":1,"ans":["witness"]}],"bank":["judge","jury","witness","stole"]},{"id":"B","title":"B. Grammar: wh- questions.","instr":"Write the question word: <i>who, what, where, why</i>.","type":"bank","items":[{"q":"___ stole the tarts? — The Knave of Hearts.","blanks":1,"ans":["Who"]},{"q":"___ were the tarts? — On a table in the middle of the room.","blanks":1,"ans":["Where"]},{"q":"___ are tarts made of? — Pepper, mostly!","blanks":1,"ans":["What"]},{"q":"___ was the Hatter late? — Because he didn't finish his tea.","blanks":1,"ans":["Why"]}],"bank":["who","what","where","why"]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The Hatter's hat was his own.","ans":"F","note":""},{"q":"Everybody sneezed when the cook came in.","ans":"T","note":""},{"q":"Alice was the third witness.","ans":"T","note":""}]}]},{"title":"Alice Wakes Up","label":"Chapter 12","paras":["\"Here!\" cried Alice. She forgot that she was very big now, and she stood up too quickly. Her skirt hit the jury box, and all the animals fell on the floor. \"Oh, I'm so sorry!\" she said, and she put them back.","\"What do you know about this?\" the King asked Alice. \"Nothing,\" said Alice. \"Nothing at all?\" \"Nothing at all.\" \"That's very important,\" said the King to the jury.","Then the King read from his book: \"Rule Forty-two. All persons more than a mile high must leave the court.\" Everybody looked at Alice. \"I'm not a mile high,\" said Alice. \"And you just invented that rule!\"","The White Rabbit found a letter. There was a poem in it, but the poem didn't say anything clear. \"It's the most important evidence!\" said the King. \"Now, let the jury decide.\" \"No, no!\" said the Queen. \"Sentence first — verdict afterwards!\"","\"That's nonsense!\" said Alice loudly. \"Hold your tongue!\" said the Queen. \"I won't!\" said Alice. \"Off with her head!\" screamed the Queen. Nobody moved.","Alice was her normal size again now. \"Who cares about you?\" she said. \"You're nothing but a pack of cards!\" Then all the cards flew up into the air and fell down on her. She screamed and tried to push them away…","…and she woke up. She was lying by the river, with her head on her sister's lap. Her sister was gently brushing some dry leaves from her face. \"Wake up, Alice dear!\" said her sister. \"What a long sleep you've had!\"","\"Oh, I had such a curious dream!\" said Alice. And she told her sister about all her strange adventures. Then she ran home for tea. Her sister stayed by the river and thought about little Alice, and about Wonderland."],"quotes":[],"words":"<i>court</i> (the place where a trial happens) · <i>rule</i> (something you must or mustn't do) · <i>nonsense</i> (something silly that doesn't make sense) · <i>dream</i> (the story you see when you sleep)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>dream, rule, nonsense, court</i>.","type":"bank","items":[{"q":"The trial happened in a ___.","blanks":1,"ans":["court"]},{"q":"\"All persons more than a mile high must leave\" is a ___.","blanks":1,"ans":["rule"]},{"q":"\"Sentence first, verdict afterwards\" is ___!","blanks":1,"ans":["nonsense"]},{"q":"Wonderland was only a ___.","blanks":1,"ans":["dream"]}],"bank":["dream","rule","nonsense","court"]},{"id":"B","title":"B. Grammar: was / were + past simple.","instr":"Put the verbs in the past.","type":"type","items":[{"q":"Alice (be) ___ very big now.","blanks":1,"ans":["was"]},{"q":"All the animals (fall) ___ on the floor.","blanks":1,"ans":["fell"]},{"q":"The cards (fly) ___ up into the air.","blanks":1,"ans":["flew"]},{"q":"Alice (wake) ___ up by the river.","blanks":1,"ans":["woke"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 2–3 sentences.","type":"open","items":[{"q":"What was your favorite part of the story? Why?"},{"q":"Do you remember a strange dream? What happened?"}]}]}]},{"id":"raven","title":"The Raven","level":"A2","author":"Edgar Allan Poe (1845)","color":"navy","intro":["An A2 prose version of <i>The Raven</i>, a poem by Edgar Allan Poe (1845, public domain), told in 4 short parts. The story is simple, but the poem is famous for its sad, dark feeling and for one word: <i>Nevermore</i>. A few lines from the original poem appear in the boxes, so you can see how Poe wrote them."],"parts":[{"title":"A Knock at the Door","label":"Part 1","paras":["It was midnight in December. It was cold and dark, and a young man was sitting alone in his room. He was very tired and very sad. He was reading old books, because he wanted to forget. A few months before, a beautiful woman called Lenore died. He loved her very much, and he couldn't stop thinking about her.","Suddenly, he heard a sound. Tap, tap, tap. Someone was knocking at his door. \"It's only a visitor,\" he said to himself. \"Only a visitor, nothing more.\"","The fire was almost dead, and the purple curtains moved in the dark. The man felt afraid. \"Sir, or Madam,\" he said, \"I'm sorry. I was sleeping, and you knocked so quietly.\" Then he opened the door. But there was nobody there. There was only darkness, nothing more.","He looked into the dark for a long time. Then he whispered one word: \"Lenore?\" And the darkness answered with an echo: \"Lenore!\" Nothing more."],"quotes":["<i>\"Once upon a midnight dreary, while I pondered, weak and weary…\"</i> (= One night at twelve o'clock, when I was sad, thinking and very tired…)"],"words":"<i>midnight</i> (twelve o'clock at night) · <i>knock</i> (to hit a door to say \"I'm here\") · <i>whisper</i> (to speak very quietly) · <i>echo</i> (a sound that comes back to you)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>midnight, knocked, whispered, alone</i>.","type":"bank","items":[{"q":"Nobody was with him. He was ___.","blanks":1,"ans":["alone"]},{"q":"It was twelve o'clock at night. It was ___.","blanks":1,"ans":["midnight"]},{"q":"Somebody ___ at the door.","blanks":1,"ans":["knocked"]},{"q":"He spoke very quietly. He ___ \"Lenore?\"","blanks":1,"ans":["whispered"]}],"bank":["midnight","knocked","whispered","alone"]},{"id":"B","title":"B. Grammar: past continuous vs past simple.","instr":"Choose the right form.","type":"choose","items":[{"segs":["He ",["read","was reading"]," a book when he ",["heard","was hearing"]," a sound."],"ans":[["was reading"],["heard"]]},{"segs":["The curtains ",["moved","were moving"]," in the dark."],"ans":[["were moving"]]},{"segs":["He ",["opened","was opening"]," the door, but nobody was there."],"ans":[["opened"]]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The story happens on a summer afternoon.","ans":"F","note":"a night in December"},{"q":"Lenore was the woman he loved.","ans":"T","note":""},{"q":"When he opened the door, he saw a visitor.","ans":"F","note":"there was nobody"}]}]},{"title":"The Raven Comes In","label":"Part 2","paras":["The man went back into his room. Then he heard the tapping again, a little louder. \"Maybe it's something at the window,\" he thought. \"It's only the wind, nothing more.\"","He opened the window. A big black bird flew into the room. It was a raven, an old and serious bird. It didn't say hello. It didn't stop. It flew up and sat on a white statue over the door, the statue of Pallas, the goddess of wisdom. And it sat there, and nothing more.","The man looked at the bird, and he almost smiled. The raven looked so serious and so important! \"You look very sad and very old,\" he said. \"What is your name?\"","And the raven answered with one word: \"Nevermore.\"","The man was very surprised. A bird that can talk! But the answer didn't mean very much. Who has a bird with the name \"Nevermore\" sitting over their door?"],"quotes":["<i>\"Quoth the Raven, 'Nevermore.'\"</i> (= The Raven said, \"Never again.\")"],"words":"<i>raven</i> (a big black bird) · <i>statue</i> (a person made of stone) · <i>wisdom</i> (being very intelligent and knowing a lot) · <i>serious</i> (not funny, not smiling)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["raven","statue","serious","nevermore"],"opts":[["a","never again"],["b","not funny"],["c","a big black bird"],["d","a person made of stone"]],"ans":["c","d","b","a"]},{"id":"B","title":"B. Grammar: object pronouns.","instr":"Complete with <i>it, him, her</i>.","type":"bank","items":[{"q":"The man opened the window, and the raven flew past ___.","blanks":1,"ans":["him"]},{"q":"The man looked at the raven and asked ___ its name.","blanks":1,"ans":["it"]},{"q":"He loved Lenore, and he couldn't forget ___.","blanks":1,"ans":["her"]}],"bank":["it","him","her"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Where did the tapping come from this time?","model":"The window."},{"q":"Where did the raven sit?","model":"On the statue of Pallas, over the door."},{"q":"What did the raven say?","model":"\"Nevermore.\""}]}]},{"title":"Nevermore","label":"Part 3","paras":["The raven didn't say anything else. The man spoke quietly: \"Other friends left me before. Tomorrow, this bird will leave me too.\" And the bird said, \"Nevermore.\"","\"Maybe that's the only word it knows,\" he thought. \"Its old owner probably was a very sad person, and the bird learned this one word from him.\"","The man sat down in front of the bird and looked at its fiery eyes. He thought about the raven, and about Lenore. The air felt heavy, and he started to imagine angels in the room. He started to ask the raven questions, and his questions got more and more desperate.","\"Prophet!\" he said. \"Bird or devil! Tell me: is there any hope for me? Will my sad heart get better?\" And the raven said, \"Nevermore.\"","\"Tell me,\" he cried, \"will I see Lenore again, in heaven?\" And the raven said, \"Nevermore.\""],"quotes":["<i>\"Take thy beak from out my heart, and take thy form from off my door!\"</i> (= Take your beak out of my heart, and go away from my door!)"],"words":"<i>owner</i> (the person who has something) · <i>hope</i> (a feeling that good things can happen) · <i>heaven</i> (where good people go after they die, in some religions) · <i>desperate</i> (with no hope)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>hope, owner, heaven, desperate</i>.","type":"bank","items":[{"q":"The bird's old ___ was a sad person.","blanks":1,"ans":["owner"]},{"q":"\"Is there any ___ for me?\" he asked.","blanks":1,"ans":["hope"]},{"q":"He wanted to see Lenore again in ___.","blanks":1,"ans":["heaven"]},{"q":"He had no hope. He was ___.","blanks":1,"ans":["desperate"]}],"bank":["hope","owner","heaven","desperate"]},{"id":"B","title":"B. Grammar: will (future).","instr":"Make questions with <i>will</i>.","type":"type","items":[{"q":"I / see / Lenore again? → <i>Will I see Lenore again?</i>","blanks":1,"example":true},{"q":"my heart / get / better? → ___","blanks":1,"ans":["Will my heart get better?"]},{"q":"the bird / leave / tomorrow? → ___","blanks":1,"ans":["Will the bird leave tomorrow?"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The raven knew a lot of words.","ans":"F","note":""},{"q":"The man asked the raven about Lenore.","ans":"T","note":""},{"q":"The raven gave him good news.","ans":"F","note":""}]}]},{"title":"The Shadow on the Floor","label":"Part 4","paras":["The man was very angry now. He stood up and shouted at the bird. \"Go! Go back to the night and the storm! Don't leave one black feather here! Leave me alone!\" And the raven said, \"Nevermore.\"","But the raven didn't go. It is still sitting there today, on the white statue over the door. Its eyes look like the eyes of a demon who is dreaming. The light from the lamp makes the raven's shadow fall on the floor.","And the man's soul is in that shadow. It is lying there on the floor, and it will never get up again. Never again. Nevermore."],"quotes":["<i>\"And my soul from out that shadow that lies floating on the floor / Shall be lifted—nevermore!\"</i> (= And my soul will never come out of that shadow on the floor. Never again!)"],"words":"<i>storm</i> (very bad weather, with wind and rain) · <i>feather</i> (birds have feathers on their bodies) · <i>shadow</i> (the dark shape that you make when you stand in the light) · <i>soul</i> (the part of a person that thinks and feels, not the body)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["raven","feather","beak","lamp"],"ans":"lamp","note":""},{"opts":["storm","rain","wind","statue"],"ans":"statue","note":""},{"opts":["sad","angry","desperate","floor"],"ans":"floor","note":""}]},{"id":"B","title":"B. Grammar: imperatives.","instr":"The man gives orders to the raven. Complete with: <i>go, leave, don't</i>.","type":"bank","items":[{"q":"\"___ back to the night!\"","blanks":1,"ans":["Go"]},{"q":"\"___ leave a black feather here!\"","blanks":1,"ans":["Don't"]},{"q":"\"___ me alone!\"","blanks":1,"ans":["Leave"]}],"bank":["go","leave","don't"]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 2–3 sentences.","type":"open","items":[{"q":"Why do you think the raven only says \"Nevermore\"?"},{"q":"How does the man feel at the end? How do you know?"},{"q":"Do you know any other scary stories or poems?"}]}]}]},{"id":"manifesto","title":"The Communist Manifesto","level":"A2","author":"Karl Marx and Friedrich Engels (1848)","color":"#d0284b","intro":["An A2 version of <i>The Communist Manifesto</i> by Karl Marx and Friedrich Engels (1848), based on the English translation by Samuel Moore (1888, public domain). It explains the main ideas of the book in 5 short parts, with simple words. The quotes in the boxes are from the original translation."],"parts":[{"title":"A Ghost in Europe","label":"Part 1","paras":["In 1848, two German writers, Karl Marx and Friedrich Engels, wrote a short book. It was called <i>The Communist Manifesto</i>. A manifesto is a text that explains what a group thinks and what it wants.","At that time, many people in Europe were afraid of communism. Kings, priests, politicians and the police all wanted to stop it. Marx and Engels said that communism was like a ghost: everybody was talking about it, but nobody really knew what it was.","So they decided to write the manifesto. They wanted to explain the ideas of the communists clearly, in their own words, and to show them to the whole world."],"quotes":["<i>\"A spectre is haunting Europe — the spectre of communism.\"</i> (= A ghost is walking around Europe — the ghost of communism.)"],"words":"<i>manifesto</i> (a text that explains what a group thinks and wants) · <i>ghost / spectre</i> (a dead person that some people believe they can see) · <i>afraid of</i> (scared of) · <i>explain</i> (to say something clearly so people understand)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>manifesto, ghost, afraid, explain</i>.","type":"bank","items":[{"q":"Marx and Engels wanted to ___ their ideas.","blanks":1,"ans":["explain"]},{"q":"A ___ is a text that says what a group wants.","blanks":1,"ans":["manifesto"]},{"q":"Many people were ___ of communism.","blanks":1,"ans":["afraid"]},{"q":"They said communism was like a ___.","blanks":1,"ans":["ghost"]}],"bank":["manifesto","ghost","afraid","explain"]},{"id":"B","title":"B. Grammar: past simple.","instr":"Write the past form.","type":"type","items":[{"q":"Marx and Engels (write) ___ a short book.","blanks":1,"ans":["wrote"]},{"q":"Many people (be) ___ afraid of communism.","blanks":1,"ans":["were"]},{"q":"They (decide) ___ to explain their ideas.","blanks":1,"ans":["decided"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Marx and Engels were French.","ans":"F","note":"German"},{"q":"The manifesto was published in 1848.","ans":"T","note":""},{"q":"Kings and the police liked communism.","ans":"F","note":""}]}]},{"title":"Rich and Poor in History","label":"Part 2","paras":["Marx and Engels start with a big idea. In all of history, they say, there were always two groups of people fighting each other: one group with power, and one group without power. In ancient Rome, there were free men and slaves. In the Middle Ages, there were lords who had the land, and serfs who worked on it.","In their time, the 1800s, there were two new groups. The first group was the <i>bourgeoisie</i>: the people who owned the factories, the machines and the money. The second group was the <i>proletariat</i>: the workers. They didn't own anything, so they had to sell their work to live.","The bourgeoisie changed the world very fast. They built factories, railways and big cities. They sold their products in every country. Marx and Engels said that the bourgeoisie made more things in 100 years than all the people before them. But they also said that the bourgeoisie turned everything into money, even people's relationships."],"quotes":["<i>\"The history of all hitherto existing society is the history of class struggles.\"</i> (= The history of all societies until now is the history of fights between social classes.)"],"words":"<i>power</i> (the ability to control people and things) · <i>slave</i> (a person who is owned by another person) · <i>own</i> (to have something that is yours) · <i>factory</i> (a building where people make products with machines)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["own","factory","slave","power"],"opts":[["a","a building where people make things"],["b","to have something that is yours"],["c","the ability to control people"],["d","a person owned by another person"]],"ans":["b","a","d","c"]},{"id":"B","title":"B. Grammar: there was / there were.","instr":"Complete.","type":"type","items":[{"q":"In ancient Rome, ___ free men and slaves.","blanks":1,"ans":["there were"]},{"q":"In the 1800s, ___ a lot of new factories.","blanks":1,"ans":["there were"]},{"q":"___ a big change in the cities.","blanks":1,"ans":["There was"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What are the two groups in the 1800s?","model":"The bourgeoisie and the proletariat."},{"q":"What did the bourgeoisie own?","model":"Factories, machines and money."},{"q":"What did the workers have to do to live?","model":"Sell their work."}]}]},{"title":"The Workers and the Factories","label":"Part 3","paras":["In the factories, life was hard for the workers. They worked many hours a day, and they got very little money. Men, women and even children worked there. The work was always the same, so the workers became like a part of the machine.","When the factories grew, more and more people became workers. Small shop owners and farmers lost their businesses, and they had to go and work in the factories too. Now there were millions of workers living together in big cities.","At first, the workers fought alone, or in small groups. Sometimes they broke machines. But with time, they started to organize. They created unions to fight together for better pay. Trains and newspapers helped workers from different cities talk to each other.","Marx and Engels said that the bourgeoisie created the workers, and that one day the workers would end the power of the bourgeoisie."],"quotes":["<i>\"What the bourgeoisie, therefore, produces, above all, is its own grave-diggers.\"</i> (= So, more than anything, the bourgeoisie makes the people who will end it.)"],"words":"<i>pay</i> (the money you get for your work) · <i>business</i> (a shop or company) · <i>organize</i> (to plan and work together as a group) · <i>union</i> (a group of workers who fight for their rights)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>pay, union, business, organize</i>.","type":"bank","items":[{"q":"The workers created a ___ to fight together.","blanks":1,"ans":["union"]},{"q":"They wanted better ___ for their work.","blanks":1,"ans":["pay"]},{"q":"The farmer lost his ___ and went to the city.","blanks":1,"ans":["business"]},{"q":"The workers started to ___ and plan together.","blanks":1,"ans":["organize"]}],"bank":["pay","union","business","organize"]},{"id":"B","title":"B. Grammar: comparatives with more and more.","instr":"Complete.","type":"type","items":[{"q":"___ people became workers. (more)","blanks":1,"ans":["More and more"]},{"q":"The cities got ___ and ___. (big)","blanks":2,"ans":["bigger","bigger"]},{"q":"Life in the factories was ___ than life on the farm. (hard)","blanks":1,"ans":["harder"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Workers in the factories got a lot of money.","ans":"F","note":""},{"q":"Children also worked in the factories.","ans":"T","note":""},{"q":"Trains and newspapers helped workers talk to each other.","ans":"T","note":""}]}]},{"title":"What Do Communists Want?","label":"Part 4","paras":["In Chapter II, Marx and Engels explain the ideas of the communists. They say that communists are not a separate group: they are part of the workers' movement, in every country.","Their main idea is to end private property — but not every kind. They don't mean your clothes or your house. They mean the factories, the land and the machines that the bourgeoisie owns and uses to make money from other people's work.","The bourgeoisie answered, \"Communists want to destroy freedom, family and culture!\" Marx and Engels replied that, for most workers, these things didn't really exist. Workers had no free time, children worked in factories, and only the rich had a real education.","The manifesto lists some changes. For example: free education for all children in public schools, no more child labor in factories, a high tax for rich people, and a national bank."],"quotes":["<i>\"The working men have no country.\"</i> (= Workers in different countries have the same problems, so they are on the same side.)"],"words":"<i>private property</i> (things that belong to one person, not to everybody) · <i>freedom</i> (being free to do what you want) · <i>tax</i> (money you pay to the government) · <i>child labor</i> (when children work like adults)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>tax, freedom, child labor, education</i>.","type":"bank","items":[{"q":"In the 1800s, a lot of children worked in factories. This is ___.","blanks":1,"ans":["child labor"]},{"q":"The manifesto wanted free ___ for all children.","blanks":1,"ans":["education"]},{"q":"Rich people should pay a high ___.","blanks":1,"ans":["tax"]},{"q":"The bourgeoisie said communists wanted to destroy ___.","blanks":1,"ans":["freedom"]}],"bank":["tax","freedom","child labor","education"]},{"id":"B","title":"B. Grammar: want + to / want + noun.","instr":"Choose the right form.","type":"choose","items":[{"segs":["Communists want ",["end","to end"]," private property."],"ans":[["to end"]]},{"segs":["They want ",["free education","to free education"]," for all children."],"ans":[["free education"]]},{"segs":["The workers want ",["to have","have"]," better lives."],"ans":[["to have"]]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What kind of private property do communists want to end?","model":"Factories, land and machines (the things used to make money from other people's work)."},{"q":"What did the bourgeoisie say about communists?","model":"That they wanted to destroy freedom, family and culture."},{"q":"Name two changes from the list in the manifesto.","model":"For example: free public education, no child labor, high tax for the rich, a national bank."}]}]},{"title":"Other Ideas and the Final Words","label":"Part 5","paras":["In Chapter III, Marx and Engels talk about other socialist groups of their time. Some of them, they say, only wanted to go back to the past. Others wanted to help the poor a little, but without changing the system. And some had beautiful dreams of perfect societies, but they didn't have a real plan to get there.","In Chapter IV, the last chapter, they explain that communists support every movement against the system in each country. And they finish the manifesto with very famous words. They say that the workers have nothing to lose and a whole world to win. Then they call all the workers of the world to come together.","The manifesto is one of the most read political books in history. Today, people still discuss and disagree about its ideas."],"quotes":["<i>\"The proletarians have nothing to lose but their chains. They have a world to win. Working men of all countries, unite!\"</i> (= The workers can only lose their chains. They can win the world. Workers of all countries, come together!)"],"words":"<i>support</i> (to help and agree with someone) · <i>chains</i> (metal rings that keep a prisoner) · <i>unite</i> (to come together as one group) · <i>disagree</i> (to have a different opinion)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["unite","together","join","alone"],"ans":"alone","note":""},{"opts":["chains","prisoner","free","lock"],"ans":"free","note":""},{"opts":["agree","support","help","disagree"],"ans":"disagree","note":""}]},{"id":"B","title":"B. Grammar: can / can't.","instr":"Complete with <i>can</i> or <i>can't</i>.","type":"bank","items":[{"q":"The workers ___ only lose their chains.","blanks":1,"ans":["can"]},{"q":"They ___ win the whole world.","blanks":1,"ans":["can"]},{"q":"One worker alone ___ change the system.","blanks":1,"ans":["can't"]}],"bank":["can","can't"]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 2–3 sentences.","type":"open","items":[{"q":"Which idea from the manifesto is the most interesting for you? Why?"},{"q":"Are workers' lives today different from the 1800s? How?"},{"q":"Do you agree or disagree with the final words? Why?"}]}]}]},{"id":"peterpan","title":"Peter Pan","level":"A2","author":"J. M. Barrie (1911)","color":"#7cc47f","intro":["An A2 version of <i>Peter and Wendy</i> by J. M. Barrie (1911), the book about Peter Pan, in 5 short parts. The original text is in the public domain. This adaptation follows the book, not the films."],"parts":[{"title":"The Boy at the Window","label":"Part 1","paras":["All children grow up, except one. His name is Peter Pan.","The Darling family lived in London. There were Mr. and Mrs. Darling and their three children: Wendy, John and Michael. Their nanny was a big dog called Nana. Every night, Nana gave the children their medicine and put them to bed.","One night, Mrs. Darling was sitting in the children's bedroom. Suddenly, the window opened, and a strange boy came in. He was wearing clothes made of leaves. A small light was flying with him. Mrs. Darling screamed, and Nana jumped at the boy. The boy escaped through the window, but Nana closed it quickly and caught his shadow!","A week later, Mr. and Mrs. Darling went to a party. That night, the boy came back to look for his shadow. He tried to stick it on with soap, but it didn't work. He started to cry, and Wendy woke up. \"Boy, why are you crying?\" she asked. \"What's your name?\" \"Peter Pan,\" he said. Wendy sewed the shadow onto his feet with a needle and thread."],"quotes":["<i>\"All children, except one, grow up.\"</i>"],"words":"<i>grow up</i> (to become an adult) · <i>nanny</i> (a person who takes care of children) · <i>escape</i> (to get away) · <i>sew</i> (to join things with a needle and
