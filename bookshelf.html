 thread)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>nanny, shadow, grow up, sewed</i>.","type":"bank","items":[{"q":"Peter Pan never wants to ___.","blanks":1,"ans":["grow up"]},{"q":"Nana was the children's ___.","blanks":1,"ans":["nanny"]},{"q":"Nana caught Peter's ___.","blanks":1,"ans":["shadow"]},{"q":"Wendy ___ the shadow onto his feet.","blanks":1,"ans":["sewed"]}],"bank":["nanny","shadow","grow up","sewed"]},{"id":"B","title":"B. Grammar: there was / there were.","instr":"Complete.","type":"type","items":[{"q":"___ three children in the Darling family.","blanks":1,"ans":["There were"]},{"q":"___ a big dog in the house.","blanks":1,"ans":["There was"]},{"q":"___ a small light with Peter.","blanks":1,"ans":["There was"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The Darling family lived in Paris.","ans":"F","note":"London"},{"q":"Nana was a dog.","ans":"T","note":""},{"q":"Peter used soap to stick on his shadow.","ans":"T","note":""}]}]},{"title":"Flying to Neverland","label":"Part 2","paras":["The small light was a fairy called Tinker Bell. She spoke with the sound of little bells. Peter told Wendy that he lived in Neverland with the Lost Boys. \"Lost Boys are children who fell out of their baby carriages,\" he explained. \"Nobody came to find them, so they came to Neverland.\"","\"We have no mother,\" said Peter. \"Come with me, Wendy! You can tell us stories and be our mother.\" Wendy was excited. She woke up John and Michael.","\"But we can't fly!\" said John. Peter taught them. \"You think lovely, wonderful thoughts,\" he said, \"and they lift you up into the air.\" He also put a little fairy dust on them. Soon they were all flying around the room!","They flew out of the window, over the houses of London. When Mr. and Mrs. Darling came home, the bedroom was empty. The children were gone. They flew for many days and nights. \"Second star to the right, and straight on till morning,\" said Peter. And finally, they saw an island: Neverland."],"quotes":["<i>\"Second to the right, and straight on till morning.\"</i>"],"words":"<i>fairy</i> (a very small magic person with wings) · <i>lost</i> (not able to find your way home) · <i>fairy dust</i> (magic powder that helps you fly) · <i>island</i> (land with water all around it)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["fairy","lost","island","lift"],"opts":[["a","to move something up"],["b","land with water around it"],["c","a small magic person with wings"],["d","not able to find your way home"]],"ans":["c","d","b","a"]},{"id":"B","title":"B. Grammar: can / can't.","instr":"Complete with <i>can</i> or <i>can't</i>.","type":"bank","items":[{"q":"\"We ___ fly!\" said John.","blanks":1,"ans":["can't"]},{"q":"With fairy dust, the children ___ fly.","blanks":1,"ans":["can"]},{"q":"Tinker Bell ___ speak with words, only with bells.","blanks":1,"ans":["can't"]}],"bank":["can","can't"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Who are the Lost Boys?","model":"Children who fell out of their baby carriages."},{"q":"Why did Peter want Wendy to come?","model":"To tell stories and be their mother."},{"q":"How did the children learn to fly?","model":"With wonderful thoughts and fairy dust."}]}]},{"title":"Life in Neverland","label":"Part 3","paras":["Neverland was full of adventures. There were mermaids in the lagoon, wild animals in the forest, and pirates on a big ship. Tinker Bell was jealous of Wendy, because she wanted Peter only for herself. She told the Lost Boys, \"Peter wants you to shoot the Wendy bird!\" One of the boys shot an arrow, and Wendy fell from the sky. But she wasn't dead! A button stopped the arrow. Peter was very angry with Tinker Bell.","The Lost Boys built a little house around Wendy. Then they all lived together in a home under the ground. They went into it through holes in hollow trees.","Wendy became a mother for everyone. Every night she told stories, she made dinner and she sewed their clothes. Peter was like the father. The boys had fun all day. They fought pirates, swam with mermaids and had picnics.","But after some time, John and Michael started to forget their real home and their real parents. Wendy felt worried. \"We must go home,\" she thought. \"Our mother is waiting for us.\""],"quotes":[],"words":"<i>mermaid</i> (half woman, half fish) · <i>lagoon</i> (a small lake near the sea) · <i>jealous</i> (unhappy because someone has what you want) · <i>worried</i> (thinking that something bad can happen)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>jealous, mermaids, worried, pirates</i>.","type":"bank","items":[{"q":"There were ___ in the lagoon.","blanks":1,"ans":["mermaids"]},{"q":"Bad men on a ship are ___.","blanks":1,"ans":["pirates"]},{"q":"Tinker Bell was ___ of Wendy.","blanks":1,"ans":["jealous"]},{"q":"Wendy was ___ about her parents.","blanks":1,"ans":["worried"]}],"bank":["jealous","mermaids","worried","pirates"]},{"id":"B","title":"B. Grammar: past simple (negatives).","instr":"Make the sentences negative.","type":"type","items":[{"q":"Wendy died. → <i>Wendy didn't die.</i>","blanks":1,"example":true},{"q":"Peter was happy with Tinker Bell. → ___","blanks":1,"ans":["Peter wasn't happy with Tinker Bell"]},{"q":"The boys lived in a normal house. → ___","blanks":1,"ans":["The boys didn't live in a normal house"]},{"q":"John remembered his parents. → ___","blanks":1,"ans":["John didn't remember his parents"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Tinker Bell liked Wendy very much.","ans":"F","note":""},{"q":"A button saved Wendy.","ans":"T","note":""},{"q":"Wendy wanted to stay in Neverland forever.","ans":"F","note":""}]}]},{"title":"Captain Hook","label":"Part 4","paras":["The captain of the pirates was James Hook. He had long black hair and a hook instead of a right hand. Years before, Peter cut off his hand in a fight and threw it to a crocodile. The crocodile liked the taste, and since then it followed Hook everywhere. It also swallowed a clock, so it went \"tick tock, tick tock.\" When Hook heard \"tick tock,\" he was very scared.","Hook hated Peter more than anything. One night, the pirates attacked. They caught Wendy and all the Lost Boys and took them to the ship. Peter was sleeping at home. Hook went into the house secretly and put poison in Peter's medicine.","Tinker Bell saw it. When Peter wanted to drink the medicine, she drank it first to save him. Her light became weaker and weaker. \"Fairies can live,\" said Peter, \"if children believe in them.\" He shouted to all the children in the world: \"Do you believe in fairies? If you believe, clap your hands!\" Many children clapped, and Tinker Bell was saved!"],"quotes":["<i>\"Do you believe in fairies? If you believe, clap your hands!\"</i>"],"words":"<i>hook</i> (a curved piece of metal) · <i>swallow</i> (to eat something without chewing) · <i>poison</i> (something that can kill you if you drink or eat it) · <i>clap</i> (to hit your hands together)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>poison, clap, hook, swallowed</i>.","type":"bank","items":[{"q":"Captain Hook had a ___ instead of a hand.","blanks":1,"ans":["hook"]},{"q":"The crocodile ___ a clock.","blanks":1,"ans":["swallowed"]},{"q":"Hook put ___ in Peter's medicine.","blanks":1,"ans":["poison"]},{"q":"\"If you believe, ___ your hands!\"","blanks":1,"ans":["clap"]}],"bank":["poison","clap","hook","swallowed"]},{"id":"B","title":"B. Grammar: first conditional.","instr":"Match the halves.","type":"match","left":["If you believe in fairies,","If Hook hears \"tick tock,\"","If Peter drinks the medicine,"],"opts":[["a","he will die."],["b","clap your hands."],["c","he will be scared."]],"ans":["b","c","a"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did the crocodile follow Hook?","model":"Because it liked the taste of his hand."},{"q":"Who drank the poison?","model":"Tinker Bell."},{"q":"How did the children save Tinker Bell?","model":"They clapped their hands."}]}]},{"title":"Going Home","label":"Part 5","paras":["Peter flew to the pirate ship. He made a \"tick tock\" sound like the crocodile, and the pirates were very scared. Then he fought Hook with his sword, and the Lost Boys fought the pirates. Finally, Hook fell into the sea — and the crocodile was waiting for him!","Now it was time to go home. Wendy, John, Michael and the Lost Boys flew back to London. Mrs. Darling always kept the window open for them. When she saw her children in their beds, she was so happy! Mr. and Mrs. Darling adopted all the Lost Boys too.","\"Stay, Peter,\" said Mrs. Darling. \"You can go to school and become a man.\" \"No,\" said Peter. \"I don't want to go to school and learn serious things. I want to always be a little boy and have fun.\" So he flew back to Neverland alone. He promised to come back every spring to take Wendy for spring cleaning.","The years passed. Wendy grew up and had a daughter, Jane. One night, Peter came back to the window. He didn't understand. Wendy was a woman now! Then Jane flew away with Peter to Neverland. And when Jane grows up, her daughter will go with Peter. And it will go on like this, as long as children are happy and innocent."],"quotes":[],"words":"<i>sword</i> (a long, sharp metal weapon) · <i>adopt</i> (to take a child into your family as your own) · <i>promise</i> (to say that you will really do something) · <i>innocent</i> (pure, without bad thoughts)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["sword","pirate","ship","bed"],"ans":"bed","note":""},{"opts":["mother","daughter","captain","father"],"ans":"captain","note":""},{"opts":["fly","fight","sword","swim"],"ans":"sword","note":"not a verb"}]},{"id":"B","title":"B. Grammar: want to / don't want to.","instr":"Complete with Peter's words. Use: <i>want to, don't want to</i>.","type":"bank","items":[{"q":"I ___ go to school.","blanks":1,"ans":["don't want to"]},{"q":"I ___ be a little boy forever.","blanks":1,"ans":["want to"]},{"q":"I ___ become a man.","blanks":1,"ans":["don't want to"]}],"bank":["want to","don't want to"]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 2–3 sentences.","type":"open","items":[{"q":"Would you like to live in Neverland? Why or why not?"},{"q":"Is it good to never grow up? Why?"},{"q":"What's your favorite memory from when you were a child?"}]}]}]},{"id":"oz","title":"The Wonderful Wizard of Oz","level":"A2","author":"L. Frank Baum (1900)","color":"#fbf06a","intro":["An A2 version of <i>The Wonderful Wizard of Oz</i> by L. Frank Baum (1900, public domain), in 5 short parts. It follows the book, not the 1939 film — for example, Dorothy's magic shoes are silver, not red."],"parts":[{"title":"The Cyclone","label":"Part 1","paras":["Dorothy was a little girl. She lived in Kansas, in the middle of a big gray prairie, with Uncle Henry, Aunt Em and her little black dog, Toto. Their house was very small. It had only one room. Everything around them was gray: the grass, the house, and even Uncle Henry and Aunt Em. Only Toto made Dorothy laugh.","One day, a cyclone came. Uncle Henry and Aunt Em ran to a hole in the ground to hide. But Toto ran under the bed, and Dorothy went to get him. Then the wind lifted the whole house up into the air, with Dorothy and Toto inside!","The house flew for hours and hours. Finally, it came down with a bump. Dorothy opened the door. She saw a beautiful country with green grass, colorful flowers and a river. Some small people came to her. They were the Munchkins. \"Thank you!\" they said. \"You killed the Wicked Witch of the East!\" Dorothy's house fell on the witch! Only her silver shoes were still there.","The Good Witch of the North gave Dorothy the silver shoes. \"I want to go home to Kansas,\" Dorothy said. \"Only the great Wizard of Oz can help you,\" said the Good Witch. \"He lives in the Emerald City. Follow the yellow brick road.\""],"quotes":[],"words":"<i>cyclone</i> (a very strong wind that turns around) · <i>prairie</i> (a big flat land with grass) · <i>wicked</i> (very bad) · <i>brick</i> (a block used to build walls and roads)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>cyclone, wicked, prairie, bricks</i>.","type":"bank","items":[{"q":"Dorothy lived on a big gray ___.","blanks":1,"ans":["prairie"]},{"q":"A ___ lifted the house into the air.","blanks":1,"ans":["cyclone"]},{"q":"The witch of the East was ___.","blanks":1,"ans":["wicked"]},{"q":"The road was made of yellow ___.","blanks":1,"ans":["bricks"]}],"bank":["cyclone","wicked","prairie","bricks"]},{"id":"B","title":"B. Grammar: adjectives.","instr":"Write the opposite.","type":"type","items":[{"q":"gray ↔ ___ (with many colors)","blanks":1,"ans":["colorful"]},{"q":"small ↔ ___","blanks":1,"ans":["big"]},{"q":"good ↔ ___","blanks":1,"ans":["bad / wicked"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Dorothy lived with her parents.","ans":"F","note":"uncle and aunt"},{"q":"The house fell on a witch.","ans":"T","note":""},{"q":"Dorothy got red shoes.","ans":"F","note":"silver"}]}]},{"title":"New Friends on the Yellow Brick Road","label":"Part 2","paras":["Dorothy and Toto started to walk on the yellow brick road. In a cornfield, they saw a Scarecrow. To her surprise, he talked! \"I don't have a brain,\" he said. \"My head is full of straw. Do you think Oz can give me some brains?\" \"Come with me and ask him!\" said Dorothy.","In the forest, they found a man made of tin. He couldn't move, because he was rusty. Dorothy put some oil on his joints, and he could move again. \"Thank you,\" said the Tin Woodman. \"I don't have a heart. I want to love again.\" So he went with them too.","Then a big Lion jumped onto the road and roared. He tried to bite Toto, but Dorothy hit him on the nose. The Lion started to cry. \"I'm a coward,\" he said. \"I'm afraid of everything. I want courage.\" And he joined them too.","Together, the four friends had many adventures. They crossed big holes and a dangerous river. They walked through a field of poppies, red flowers that made Dorothy and the Lion fall asleep. But they helped each other, and finally they saw a green light in the sky: the Emerald City."],"quotes":[],"words":"<i>scarecrow</i> (a figure in a field that scares birds) · <i>brain</i> (the part in your head that you think with) · <i>rusty</i> (old metal, orange and hard to move) · <i>coward</i> (a person who is afraid of everything)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Who wants what? Match.","type":"match","left":["the Scarecrow","the Tin Woodman","the Lion","Dorothy"],"opts":[["a","courage"],["b","to go home"],["c","a brain"],["d","a heart"]],"ans":["c","d","a","b"]},{"id":"B","title":"B. Grammar: have / don't have, has / doesn't have.","instr":"Complete.","type":"type","items":[{"q":"The Scarecrow ___ a brain.","blanks":1,"ans":["doesn't have"]},{"q":"The Tin Woodman ___ a heart.","blanks":1,"ans":["doesn't have"]},{"q":"\"I ___ courage,\" said the Lion.","blanks":1,"ans":["don't have"]},{"q":"Dorothy ___ a little dog.","blanks":1,"ans":["has"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why couldn't the Tin Woodman move?","model":"Because he was rusty."},{"q":"What did Dorothy do when the Lion tried to bite Toto?","model":"She hit him on the nose."},{"q":"What happened in the field of poppies?","model":"Dorothy and the Lion fell asleep."}]}]},{"title":"The Emerald City","label":"Part 3","paras":["At the gate of the Emerald City, a guardian gave everyone green glasses. \"The city is very bright,\" he said. \"You must wear these.\" Inside, everything was green: the houses, the streets, the clothes, and even the sky.","The Wizard of Oz saw his visitors one at a time, and he looked different for each of them. To Dorothy, he was a giant head. To the Scarecrow, he was a beautiful lady. To the Tin Woodman, he was a terrible beast. To the Lion, he was a ball of fire.","But he gave all of them the same answer. \"I will help you,\" he said, \"but first you must help me. Kill the Wicked Witch of the West.\" The friends were very sad. They didn't want to kill anyone, but they wanted their wishes. So they decided to go to the West."],"quotes":[],"words":"<i>gate</i> (a door in a wall or fence) · <i>guardian</i> (a person who protects something) · <i>beast</i> (a big, scary animal) · <i>wish</i> (something you really want)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>gate, beast, wish, bright</i>.","type":"bank","items":[{"q":"They waited at the ___ of the city.","blanks":1,"ans":["gate"]},{"q":"The city was very ___, so they wore glasses.","blanks":1,"ans":["bright"]},{"q":"The Tin Woodman saw a terrible ___.","blanks":1,"ans":["beast"]},{"q":"Dorothy's ___ was to go home.","blanks":1,"ans":["wish"]}],"bank":["gate","beast","wish","bright"]},{"id":"B","title":"B. Grammar: must / mustn't.","instr":"Complete with <i>must</i> or <i>mustn't</i>.","type":"bank","items":[{"q":"\"You ___ wear these glasses.\"","blanks":1,"ans":["must"]},{"q":"\"You ___ kill the Wicked Witch.\"","blanks":1,"ans":["must"]},{"q":"\"You ___ look at the city without glasses.\"","blanks":1,"ans":["mustn't"]}],"bank":["must","mustn't"]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Everything in the city was green.","ans":"T","note":""},{"q":"The Wizard looked the same for everyone.","ans":"F","note":""},{"q":"The Wizard helped them immediately.","ans":"F","note":""}]}]},{"title":"The Wicked Witch of the West","label":"Part 4","paras":["The Wicked Witch of the West had only one eye, but she could see very far, like a telescope. She saw the friends coming. She sent wolves, crows and bees to attack them, but the friends fought bravely. Then she used a magic cap to call the Winged Monkeys. The Monkeys broke the Tin Woodman, took the straw out of the Scarecrow, and carried Dorothy and the Lion to the Witch's castle.","The Witch made Dorothy her servant. Dorothy had to clean the kitchen all day. The Witch wanted Dorothy's silver shoes, because they were very powerful. One day, the Witch tricked Dorothy and took one of the shoes.","Dorothy was very angry. She picked up a bucket of water and threw it on the Witch. The Witch started to melt! \"Look what you've done!\" she screamed. \"In a minute I will melt away!\" And she disappeared, like brown sugar in water. Dorothy didn't know that water could kill her!","Now the Winkies, the Witch's servants, were free. They were very happy. They fixed the Tin Woodman and put new straw in the Scarecrow. Then the friends went back to the Emerald City."],"quotes":[],"words":"<i>castle</i> (a big, strong building where kings or witches live) · <i>servant</i> (a person who works for someone in their house) · <i>trick</i> (to make someone believe something false) · <i>melt</i> (to change from solid to liquid, like ice in the sun)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["melt","servant","castle","bravely"],"opts":[["a","a big building where kings live"],["b","without fear"],["c","to become liquid"],["d","a person who works in someone's house"]],"ans":["c","d","a","b"]},{"id":"B","title":"B. Grammar: had to.","instr":"Complete with <i>had to</i> + verb.","type":"type","items":[{"q":"Dorothy ___ (clean) the kitchen all day.","blanks":1,"ans":["had to clean"]},{"q":"The friends ___ (fight) the wolves and the bees.","blanks":1,"ans":["had to fight"]},{"q":"The Winkies ___ (work) for the Witch.","blanks":1,"ans":["had to work"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did the Witch want Dorothy's shoes?","model":"Because they were very powerful."},{"q":"What did Dorothy throw at the Witch?","model":"A bucket of water."},{"q":"What happened to the Witch?","model":"She melted."}]}]},{"title":"The Truth about Oz and Going Home","label":"Part 5","paras":["Back in the Emerald City, the friends went to see the Wizard. But Toto knocked over a screen in the corner — and behind it, there was a little old man! \"I am Oz, the Great and Terrible,\" he said in a small voice. \"But please don't tell anyone. I'm not really a wizard. I'm just a normal man from Omaha.\" Many years ago, he arrived in Oz in a hot-air balloon, and the people thought he was a great wizard.","But he gave the friends their wishes anyway. He gave the Scarecrow a brain made of bran and pins. He gave the Tin Woodman a silk heart. He gave the Lion a drink of \"courage.\" They were all very happy. The truth is, they already had what they wanted: the Scarecrow had good ideas, the Tin Woodman was kind, and the Lion was brave.","Oz tried to take Dorothy home in his balloon, but it flew away without her. Finally, Glinda, the Good Witch of the South, told Dorothy the secret. \"Your silver shoes can take you home. Just click your heels together three times.\"","Dorothy said goodbye to her friends. She held Toto, clicked her heels three times and said, \"Take me home to Aunt Em!\" In a second, she was in Kansas. The silver shoes fell off in the desert, but Dorothy was home. \"Oh, Aunt Em! I'm so glad to be at home again!\""],"quotes":[],"words":"<i>screen</i> (a flat thing that hides part of a room) · <i>balloon</i> (a big bag of hot air that can fly) · <i>heel</i> (the back part of your foot or shoe) · <i>glad</i> (happy)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>balloon, heels, glad, screen</i>.","type":"bank","items":[{"q":"Oz was hiding behind a ___.","blanks":1,"ans":["screen"]},{"q":"He came to Oz in a hot-air ___.","blanks":1,"ans":["balloon"]},{"q":"Dorothy clicked her ___ three times.","blanks":1,"ans":["heels"]},{"q":"\"I'm so ___ to be at home!\"","blanks":1,"ans":["glad"]}],"bank":["balloon","heels","glad","screen"]},{"id":"B","title":"B. Grammar: already.","instr":"Choose the right person.","type":"choose","items":[{"segs":["",["The Scarecrow","The Lion"]," already had good ideas."],"ans":[["The Scarecrow"]]},{"segs":["",["The Tin Woodman","Oz"]," was already kind."],"ans":[["The Tin Woodman"]]},{"segs":["",["The Lion","Dorothy"]," was already brave."],"ans":[["The Lion"]]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 2–3 sentences.","type":"open","items":[{"q":"What would you ask the Wizard for? Why?"},{"q":"Why do you think the friends already had what they wanted?"},{"q":"\"There's no place like home.\" Do you agree?"}]}]}]},{"id":"pooh","title":"Winnie-the-Pooh","level":"A2","author":"A. A. Milne (1926)","color":"#f6b98a","opens":"2027-01-01","intro":["An A2 version of <i>Winnie-the-Pooh</i> by A. A. Milne (1926), in 5 short parts. It follows the book, not the cartoons."],"parts":[{"title":"Pooh and the Bees","label":"Part 1","paras":["Winnie-the-Pooh was a bear. He lived in a forest, and his best friend was a boy called Christopher Robin. Pooh was not very clever — he was a \"Bear of Very Little Brain\" — but he was kind, and he loved honey more than anything.","One day, Pooh heard a buzzing noise at the top of a tree. \"Buzzing means bees,\" he thought. \"Bees make honey. And honey is for me to eat!\" So he climbed the tree. But a branch broke, and he fell into a bush.","Pooh had a new idea. He went to Christopher Robin. \"Do you have a balloon?\" he asked. Pooh rolled in mud, so he was all black, like a little cloud. Then he held the blue balloon and floated up into the sky, next to the bees' nest. \"Do I look like a small black cloud in a blue sky?\" he asked.","But the bees were suspicious. They started to buzz around him. \"Christopher Robin,\" said Pooh, \"I think the bees know that I'm not a cloud. Please shoot the balloon!\" Christopher Robin shot the balloon with his gun, and Pooh came down slowly. But his arms were stiff for a whole week from holding the string."],"quotes":[],"words":"<i>honey</i> (a sweet food that bees make) · <i>buzz</i> (the sound bees make) · <i>float</i> (to stay in the air or on water) · <i>suspicious</i> (thinking that something is wrong)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>honey, buzzing, floated, suspicious</i>.","type":"bank","items":[{"q":"Pooh loved ___ more than anything.","blanks":1,"ans":["honey"]},{"q":"He heard a ___ noise at the top of a tree.","blanks":1,"ans":["buzzing"]},{"q":"With the balloon, Pooh ___ up into the sky.","blanks":1,"ans":["floated"]},{"q":"The bees were ___. They knew he wasn't a cloud.","blanks":1,"ans":["suspicious"]}],"bank":["honey","buzzing","floated","suspicious"]},{"id":"B","title":"B. Grammar: because / so.","instr":"Choose.","type":"choose","items":[{"segs":["Pooh climbed the tree ",["because","so"]," he wanted honey."],"ans":[["because"]]},{"segs":["A branch broke, ",["because","so"]," Pooh fell."],"ans":[["so"]]},{"segs":["Pooh rolled in mud ",["because","so"]," he wanted to look like a cloud."],"ans":[["because"]]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Pooh was very clever.","ans":"F","note":""},{"q":"Pooh used a balloon to go up.","ans":"T","note":""},{"q":"The bees believed Pooh was a cloud.","ans":"F","note":""}]}]},{"title":"Pooh Gets Stuck","label":"Part 2","paras":["One morning, Pooh was walking in the forest, and he came to a hole in a sandy bank. \"That's Rabbit's house,\" he thought. \"Rabbit means company, and company means food!\" So he shouted into the hole, \"Is anybody at home?\"","Rabbit invited him in, and they had lunch together. Pooh ate a lot of honey and condensed milk. \"Would you like some more?\" asked Rabbit. \"Yes, please!\" said Pooh. When the food was finished, Pooh said goodbye and started to climb out of the hole.","But his head went out, then his arms… and then he got stuck! He ate too much, and now he was too fat for the door. \"Oh, help!\" said Pooh. \"I'd better go back.\" But he couldn't go back either.","Rabbit called Christopher Robin. \"There's only one thing we can do,\" said Christopher Robin. \"We must wait for you to get thin again.\" So Pooh stayed there for a whole week. Christopher Robin read him a book every day. Rabbit used Pooh's back legs to dry his towels. Finally, Pooh was thin enough. Christopher Robin and all the animals pulled and pulled… and POP! Pooh came out like a cork from a bottle."],"quotes":[],"words":"<i>company</i> (being with other people) · <i>stuck</i> (not able to move) · <i>thin</i> (not fat) · <i>pull</i> (to move something toward you)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Opposites. Match.","type":"match","left":["fat","pull","in","stuck"],"opts":[["a","out"],["b","push"],["c","free"],["d","thin"]],"ans":["d","b","a","c"]},{"id":"B","title":"B. Grammar: too + adjective / enough.","instr":"Complete with <i>too fat</i> or <i>thin enough</i>.","type":"bank","items":[{"q":"After lunch, Pooh was ___ to get out.","blanks":1,"ans":["too fat"]},{"q":"After a week, Pooh was ___ to get out.","blanks":1,"ans":["thin enough"]},{"q":"He couldn't move because he was ___.","blanks":1,"ans":["too fat"]}],"bank":["too fat","thin enough"]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Pooh visit Rabbit?","model":"Because he wanted company and food."},{"q":"Why did Pooh get stuck?","model":"Because he ate too much."},{"q":"What did Rabbit use Pooh's legs for?","model":"To dry his towels."}]}]},{"title":"Eeyore's Tail and Eeyore's Birthday","label":"Part 3","paras":["Eeyore was an old gray donkey. He was always a little sad. One day, Pooh found him by the river. \"Something is wrong,\" said Eeyore. \"My tail is gone!\" Pooh looked, and it was true. \"I will find your tail,\" said Pooh.","Pooh went to see Owl, because Owl was very wise. Owl had a nice bell-pull on his door. \"Where did you find that bell-pull?\" asked Pooh. \"I found it in the forest,\" said Owl. Pooh looked at it carefully. It was Eeyore's tail! Pooh took it back to Eeyore, and Christopher Robin nailed it on again. Eeyore was very happy.","Another day, Eeyore was sadder than usual. \"It's my birthday,\" he said. \"And nobody remembered.\" Pooh ran home to find a present. He took a pot of honey, but on the way he got hungry… and he ate all the honey! Now he only had an empty pot. Piglet wanted to give Eeyore a red balloon. But he fell, and the balloon popped.","Poor Pooh and Piglet! They gave Eeyore an empty pot and a little piece of balloon. But Eeyore was delighted. He put the balloon in the pot, and took it out, and put it in again. \"It's a Useful Pot,\" said Pooh. And Eeyore was as happy as he could be."],"quotes":[],"words":"<i>donkey</i> (an animal like a small horse with long ears) · <i>wise</i> (very intelligent, knowing a lot) · <i>present</i> (a gift) · <i>delighted</i> (very, very happy)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>present, wise, delighted, empty</i>.","type":"bank","items":[{"q":"Owl was very ___.","blanks":1,"ans":["wise"]},{"q":"Pooh ate the honey, so the pot was ___.","blanks":1,"ans":["empty"]},{"q":"Pooh wanted to give Eeyore a ___.","blanks":1,"ans":["present"]},{"q":"Eeyore loved his gifts. He was ___.","blanks":1,"ans":["delighted"]}],"bank":["present","wise","delighted","empty"]},{"id":"B","title":"B. Grammar: comparatives.","instr":"Complete.","type":"type","items":[{"q":"Eeyore was (sad) ___ than usual.","blanks":1,"ans":["sadder"]},{"q":"Owl was (wise) ___ than Pooh.","blanks":1,"ans":["wiser"]},{"q":"The pot was (useful) ___ than the balloon.","blanks":1,"ans":["more useful"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Owl took Eeyore's tail on purpose.","ans":"F","note":"he found it in the forest"},{"q":"Pooh ate the honey for Eeyore's birthday.","ans":"T","note":""},{"q":"Eeyore was happy with his presents.","ans":"T","note":""}]}]},{"title":"The Heffalump and the Flood","label":"Part 4","paras":["One day, Christopher Robin said, \"I saw a Heffalump today.\" Pooh and Piglet didn't know what a Heffalump was, but they decided to catch one. They dug a very deep hole and put a jar of honey in it as a trap.","That night, Pooh got hungry and went to the trap to eat the honey. He put his head in the jar to lick the bottom… and the jar got stuck on his head! In the morning, Piglet came to the trap. He saw a strange animal with a big jar for a head, making terrible noises. \"Help! Help! A Heffalump!\" he shouted, and he ran away. But it was only Pooh.","Later, it rained and rained for days. The water went up and up, and Piglet's house was surrounded by water. He was very small and very scared. He wrote a message, put it in a bottle and threw it into the water: \"HELP! PIGLET (ME)\".","Pooh found the bottle, but he couldn't read very well. He took it to Christopher Robin. They used Christopher Robin's umbrella as a boat. Pooh called it \"The Brain of Pooh.\" They sailed to Piglet's house and saved him. Christopher Robin said Pooh was a very clever bear."],"quotes":[],"words":"<i>trap</i> (something that catches animals) · <i>dig / dug</i> (to make a hole in the ground) · <i>surrounded</i> (with something all around) · <i>sail</i> (to travel on water in a boat)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["trap","dig","sail","message"],"opts":[["a","to travel on water"],["b","words you send to someone"],["c","something that catches animals"],["d","to make a hole"]],"ans":["c","d","a","b"]},{"id":"B","title":"B. Grammar: past continuous.","instr":"Complete with <i>was/were</i> + -ing.","type":"type","items":[{"q":"It ___ (rain) for days.","blanks":1,"ans":["was raining"]},{"q":"Pooh ___ (eat) honey when the jar got stuck.","blanks":1,"ans":["was eating"]},{"q":"Piglet ___ (wait) in his house.","blanks":1,"ans":["was waiting"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What was in the trap?","model":"A jar of honey."},{"q":"Who was the \"Heffalump\" that Piglet saw?","model":"Pooh, with a jar on his head."},{"q":"What did they use as a boat?","model":"Christopher Robin's umbrella."}]}]},{"title":"A Party for Pooh","label":"Part 5","paras":["Christopher Robin decided to have a party. \"It's a party for Pooh,\" he said, \"because he saved Piglet.\" Owl went to tell all the animals.","Everyone came: Rabbit and all his friends and relations, Kanga and her baby Roo, Eeyore, Piglet and Owl. They sat at a long table in the forest. Pooh was very surprised. \"A party for me?\" he said. \"How grand!\"","Christopher Robin gave Pooh a present: a special pencil case with pencils of different colors — blue, red and green — a rubber and a ruler. Pooh was very proud. Of course, Eeyore wasn't very happy. \"It's very nice,\" he said, \"but it's not for me.\"","After the party, Pooh and Piglet walked home together in the evening. \"When you wake up in the morning, Pooh,\" said Piglet, \"what's the first thing you say to yourself?\" \"What's for breakfast?\" said Pooh. \"What do you say, Piglet?\" \"I say, I wonder what exciting thing will happen today,\" said Piglet. Pooh nodded. \"It's the same thing,\" he said."],"quotes":[],"words":"<i>relations</i> (family members) · <i>grand</i> (great, important) · <i>proud</i> (happy about something good you have or did) · <i>wonder</i> (to think about something with curiosity)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["pencil","ruler","rubber","honey"],"ans":"honey","note":""},{"opts":["bear","pig","donkey","party"],"ans":"party","note":""},{"opts":["happy","proud","delighted","sad"],"ans":"sad","note":""}]},{"id":"B","title":"B. Grammar: questions in the present simple.","instr":"Make questions.","type":"type","items":[{"q":"What / you / say / in the morning? → <i>What do you say in the morning?</i>","blanks":1,"example":true},{"q":"What / Pooh / love? → ___","blanks":1,"ans":["What does Pooh love?"]},{"q":"Where / Pooh / live? → ___","blanks":1,"ans":["Where does Pooh live?"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 2–3 sentences.","type":"open","items":[{"q":"Which character are you most like? Pooh, Piglet, Eeyore, Rabbit or Owl? Why?"},{"q":"What is the first thing you think about in the morning?"},{"q":"What was the best party of your life?"}]}]}]},{"id":"sherlock","title":"The Adventures of Sherlock Holmes","level":"B1","author":"Arthur Conan Doyle (1892)","color":"#8a6d4c","intro":["Five famous cases from <i>The Adventures of Sherlock Holmes</i> by Arthur Conan Doyle (1892, public domain), retold in B1 English. The stories are told by Dr. John Watson, Holmes's friend, who lives with him at 221B Baker Street, London. Each part is a complete mystery. The quotes are from the original stories."],"parts":[{"title":"A Scandal in Bohemia","label":"Part 1","paras":["One evening, a tall man in a mask came to Baker Street. Holmes knew immediately who he was: the King of Bohemia. The King was going to marry a princess, but he had a problem. Years before, he had had a romance with an American singer, Irene Adler, and there was a photograph of the two of them together. Now Irene was threatening to send it to the princess's family. The King had tried everything to get it back: burglars had searched her house twice, but they found nothing.","Holmes accepted the case. The next day, he disguised himself as an old clergyman and waited outside Irene's house. In the street, a fight started — Holmes had paid some men to start it — and Holmes fell, pretending to be hurt. Irene kindly took him into her house. Then Watson threw a smoke bomb through the window, and everybody shouted, \"Fire!\"","Holmes watched Irene carefully. When people think their house is on fire, they run to save the thing they love most. Irene ran to a secret panel in the wall, where the photograph was hidden. Holmes now knew where it was.","But the next morning, when Holmes and the King arrived, Irene had gone. She had recognized Holmes, and she had left the country with her new husband. She left a letter and a different photograph: a picture of herself alone. She promised never to use the old photograph. The King was very happy, and he offered Holmes a valuable ring. But Holmes only asked for the picture of Irene. She was the only person who had ever beaten him."],"quotes":["<i>\"To Sherlock Holmes she is always the woman.\"</i>"],"words":"<i>mask</i> (something that covers your face) · <i>threaten</i> (to say you will do something bad) · <i>burglar</i> (a person who enters a house to steal) · <i>disguise</i> (to change your appearance so people don't recognize you) · <i>panel</i> (a flat piece of wood in a wall)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>mask, threatening, burglars, disguised, panel</i>.","type":"bank","items":[{"q":"The King wore a ___ over his face.","blanks":1,"ans":["mask"]},{"q":"Irene was ___ to send the photograph to the princess.","blanks":1,"ans":["threatening"]},{"q":"Two ___ searched her house, but they found nothing.","blanks":1,"ans":["burglars"]},{"q":"Holmes ___ himself as an old clergyman.","blanks":1,"ans":["disguised"]},{"q":"The photograph was behind a secret ___.","blanks":1,"ans":["panel"]}],"bank":["mask","threatening","burglars","disguised","panel"]},{"id":"B","title":"B. Grammar: past perfect.","instr":"Complete.","type":"type","items":[{"q":"The King ___ (have) a romance with Irene years before.","blanks":1,"ans":["had had"]},{"q":"When they arrived, Irene ___ (leave) the country.","blanks":1,"ans":["had left"]},{"q":"She was the only person who ___ (ever / beat) Holmes.","blanks":1,"ans":["had ever beaten"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The King wanted to buy a photograph.","ans":"F","note":"he wanted to get it back"},{"q":"Holmes used a fake fire to find the photograph.","ans":"T","note":""},{"q":"Holmes asked for a valuable ring as payment.","ans":"F","note":"he asked for Irene's picture"}]}]},{"title":"The Red-Headed League","label":"Part 2","paras":["Mr. Jabez Wilson had a small shop and very bright red hair. One day, his young assistant, Vincent Spaulding, showed him an advertisement in the newspaper: \"The Red-Headed League\" was offering a job to a red-haired man, for four pounds a week. The work was easy: copying the encyclopedia, from ten to two every day, in an office. Wilson got the job.","For eight weeks, Wilson copied the encyclopedia. He was very happy with the money. But one morning, he found a note on the office door: \"The Red-Headed League is dissolved.\" Nobody knew anything about it. Confused, Wilson went to Sherlock Holmes.","Holmes was very interested. \"It is quite a three pipe problem,\" he said, and he sat smoking for fifty minutes. Then he went to Wilson's shop. He knocked on the pavement in front of it with his stick, and he looked carefully at the assistant's trousers: the knees were dirty and worn.","Holmes explained everything to Watson. The assistant was really John Clay, a famous criminal. The League was a trick to get Wilson out of his shop every day. While Wilson was copying the encyclopedia, Clay was digging a tunnel from the shop's cellar to the bank next door. That night, Holmes, Watson and the police waited in the dark in the bank's cellar. At midnight, a stone in the floor moved, and a hand appeared. John Clay came out of the tunnel — and the police caught him."],"quotes":[],"words":"<i>advertisement</i> (a notice in a newspaper about a job or product) · <i>encyclopedia</i> (a big book with information about everything) · <i>dissolve</i> (to end an organization) · <i>pavement</i> (the path for people next to the street) · <i>cellar</i> (a room under a building)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["advertisement","encyclopedia","pavement","cellar","tunnel"],"opts":[["a","a room under a building"],["b","a path under the ground"],["c","a notice about a job"],["d","a book with information about everything"],["e","the path next to the street"]],"ans":["c","d","e","a","b"]},{"id":"B","title":"B. Grammar: past continuous (while).","instr":"Complete with the past continuous.","type":"type","items":[{"q":"While Wilson ___ (copy) the encyclopedia, Clay was digging.","blanks":1,"ans":["was copying"]},{"q":"Holmes and Watson ___ (wait) in the dark when the stone moved.","blanks":1,"ans":["were waiting"]},{"q":"Clay ___ (dig) a tunnel to the bank.","blanks":1,"ans":["was digging"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"What was the job at the Red-Headed League?","model":"Copying the encyclopedia, from ten to two every day."},{"q":"Why did Holmes look at the assistant's trousers?","model":"Because the dirty knees showed he was digging."},{"q":"What was the real reason for the League?","model":"To get Wilson out of his shop so Clay could dig a tunnel to the bank."}]}]},{"title":"The Speckled Band","label":"Part 3","paras":["Early one morning, a young woman came to Baker Street. She was shaking with fear. Her name was Helen Stoner, and she lived with her stepfather, Dr. Grimesby Roylott, a violent man who had lived in India. Two years before, her twin sister, Julia, had died mysteriously, two weeks before her wedding. In the night, Helen had heard a low whistle and then a terrible scream. Julia's last words were: \"It was the band! The speckled band!\"","Now Helen was going to marry, and she had to sleep in Julia's old bedroom. The night before, she had heard the same low whistle. She was terrified.","Holmes and Watson went to the house. In Julia's room, Holmes found some strange things. There was a bell-rope next to the bed, but it wasn't connected to any bell. Above it there was a small ventilator that connected the room to Dr. Roylott's room. And the bed was fixed to the floor, so nobody could move it.","That night, Holmes and Watson waited in the dark room. After hours of silence, they heard a soft whistle. Holmes lit a match and hit the bell-rope with his stick. A moment later, they heard a horrible cry from Dr. Roylott's room. They found him dead, with a strange yellow band with brown spots around his head. It was a snake — a deadly swamp adder from India! Roylott had trained it to go through the ventilator and down the rope when he whistled. He wanted to kill his stepdaughters to keep their money. When Holmes hit the snake, it went back and bit its owner."],"quotes":["<i>\"Violence does, in truth, recoil upon the violent.\"</i>"],"words":"<i>stepfather</i> (your mother's husband, but not your real father) · <i>whistle</i> (a high sound made by blowing through your lips) · <i>speckled</i> (with many small spots) · <i>ventilator</i> (a small opening to let air in) · <i>deadly</i> (able to kill)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>stepfather, whistle, speckled, ventilator, deadly</i>.","type":"bank","items":[{"q":"Dr. Roylott was Helen's ___.","blanks":1,"ans":["stepfather"]},{"q":"In the night, Helen heard a low ___.","blanks":1,"ans":["whistle"]},{"q":"The snake was yellow with brown spots. It was ___.","blanks":1,"ans":["speckled"]},{"q":"The snake came through a small ___.","blanks":1,"ans":["ventilator"]},{"q":"A swamp adder is a ___ snake.","blanks":1,"ans":["deadly"]}],"bank":["stepfather","whistle","speckled","ventilator","deadly"]},{"id":"B","title":"B. Grammar: modal verbs of deduction (must / might / can't).","instr":"Choose.","type":"choose","items":[{"segs":["The bell-rope isn't connected to a bell. It ",["must","can't"]," be for something else."],"ans":[["must"]]},{"segs":["The bed is fixed to the floor. Someone ",["must","can't"]," want it to stay in one place."],"ans":[["must"]]},{"segs":["Julia ",["can't","might"]," have seen the snake in the dark — she only said \"the band\"."],"ans":[["might"]]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Helen's sister died before her wedding.","ans":"T","note":""},{"q":"The \"speckled band\" was a scarf.","ans":"F","note":"it was a snake"},{"q":"Dr. Roylott was killed by his own snake.","ans":"T","note":""}]}]},{"title":"The Blue Carbuncle","label":"Part 4","paras":["Two days after Christmas, Watson visited Holmes. On a chair there was an old, dirty hat. A commissionaire called Peterson had found it in the street, together with a fat Christmas goose, after a man dropped them in a fight. A card on the goose said \"For Mrs. Henry Baker.\" Peterson took the goose home to cook it.","Suddenly, Peterson ran into the room. \"Look what my wife found inside the goose!\" In his hand was a beautiful blue stone. It was the Countess of Morcar's blue carbuncle, a famous jewel that someone had stolen from a hotel a few days before. The police had arrested a plumber, John Horner, for the crime.","Holmes followed the goose. Henry Baker, the owner of the hat, was an honest man who knew nothing. He had bought the goose at a pub, the Alpha. The pub owner had bought it from a man in the market, and that man had bought it from a woman who raised geese, Mrs. Oakshott. And while Holmes was asking questions at the market, a nervous little man appeared, asking about the same goose.","His name was James Ryder, and he worked at the hotel. He had stolen the jewel and hidden it by making a goose swallow it — but then he took the wrong goose! Ryder fell on his knees and cried. Holmes thought for a moment. Then he opened the door. \"Get out!\" he said, and Ryder ran away. Holmes would make sure the plumber was freed. \"It is the season of forgiveness,\" he told Watson."],"quotes":[],"words":"<i>goose</i> (a big white bird, like a large duck) · <i>jewel</i> (a valuable stone, like a diamond) · <i>arrest</i> (when the police take someone because of a crime) · <i>plumber</i> (a person who repairs water pipes) · <i>forgiveness</i> (stopping being angry with someone who did something wrong)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["goose","duck","chicken","jewel"],"ans":"jewel","note":""},{"opts":["diamond","carbuncle","jewel","hat"],"ans":"hat","note":""},{"opts":["plumber","commissionaire","countess","pub"],"ans":"pub","note":""}]},{"id":"B","title":"B. Grammar: passive (past simple).","instr":"Rewrite in the passive.","type":"type","items":[{"q":"Someone stole the jewel. → The jewel ___","blanks":1,"ans":["was stolen"]},{"q":"The police arrested a plumber. → A plumber ___","blanks":1,"ans":["was arrested"]},{"q":"Peterson's wife found the stone. → The stone ___","blanks":1,"ans":["was found by Peterson's wife"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Where did they find the blue carbuncle?","model":"Inside the Christmas goose."},{"q":"Why did Ryder put the jewel in a goose?","model":"To hide it, because he had stolen it."},{"q":"Why did Holmes let Ryder go?","model":"Because it was Christmas, the season of forgiveness (and the plumber would be freed)."}]}]},{"title":"The Man with the Twisted Lip","label":"Part 5","paras":["Mrs. St. Clair was worried. Her husband, Neville, a respectable businessman, had disappeared. On Monday, she was in a poor part of London when she saw him at a window on the second floor of a dark house. He looked terrified and then disappeared. She ran to the house, but a man stopped her. When she came back with the police, there was only one person in the room: Hugh Boone, a famous beggar with orange hair and an ugly face with a twisted lip. In the room they found Neville's clothes, and in the river behind the house, his coat, full of coins.","The police arrested Boone for murder. But then Mrs. St. Clair received a letter in her husband's handwriting: \"Don't worry. Everything will be all right.\" Was he alive?","Holmes sat up all night, smoking and thinking. In the morning, he took a sponge from the bathroom and went to the police station with Watson. Boone was sleeping in his cell, very dirty. Holmes wet the sponge and rubbed it hard on the beggar's face. The dirt, the orange hair and the twisted lip came off — and under them was the face of Neville St. Clair!","St. Clair explained. Years before, as a young journalist, he had dressed as a beggar for a newspaper article. He was surprised: in one day, he earned more money than in a week of work. So he started a double life. Every morning he left home as a businessman and became Hugh Boone; every evening he became Neville St. Clair again. He had never committed a crime, but he had lied to his family. Holmes promised to keep the secret — if Hugh Boone disappeared forever."],"quotes":["<i>\"You see, but you do not observe.\"</i> — Holmes, in <i>A Scandal in Bohemia</i>"],"words":"<i>respectable</i> (considered good and honest by society) · <i>beggar</i> (a person who asks for money in the street) · <i>twisted</i> (turned into a strange shape) · <i>sponge</i> (a soft thing used for washing) · <i>double life</i> (two secret, different lives)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>respectable, beggar, twisted, sponge, double life</i>.","type":"bank","items":[{"q":"Neville looked like a ___ businessman.","blanks":1,"ans":["respectable"]},{"q":"Hugh Boone was a ___ who asked for money.","blanks":1,"ans":["beggar"]},{"q":"Boone had a ___ lip.","blanks":1,"ans":["twisted"]},{"q":"Holmes washed Boone's face with a ___.","blanks":1,"ans":["sponge"]},{"q":"St. Clair had a ___: businessman and beggar.","blanks":1,"ans":["double life"]}],"bank":["respectable","beggar","twisted","sponge","double life"]},{"id":"B","title":"B. Grammar: used to / would.","instr":"Complete with <i>used to</i> + verb.","type":"type","items":[{"q":"Every morning, St. Clair ___ (leave) home as a businessman.","blanks":1,"ans":["used to leave"]},{"q":"He ___ (sit) in the street all day as Hugh Boone.","blanks":1,"ans":["used to sit"]},{"q":"He ___ (earn) more money as a beggar than as a journalist.","blanks":1,"ans":["used to earn"]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Which case did you like most? Why?"},{"q":"Holmes let Ryder go. Was it the right decision?"},{"q":"\"You see, but you do not observe.\" What is the difference?"}]}]}]},{"id":"anne","title":"Anne of Green Gables","level":"B1","author":"L. M. Montgomery (1908)","color":"#e07a3f","intro":["A B1 version of <i>Anne of Green Gables</i> by L. M. Montgomery (1908, public domain), in 5 parts. It takes place on Prince Edward Island, in Canada, in a small village called Avonlea. The quotes are from the original text.","<b>Who's who</b><br>• <b>Anne Shirley</b> — an 11-year-old orphan with red hair and a big imagination<br>• <b>Matthew Cuthbert</b> — a shy, gentle farmer, about 60<br>• <b>Marilla Cuthbert</b> — Matthew's sister; strict but fair<br>• <b>Diana Barry</b> — Anne's best friend<br>• <b>Gilbert Blythe</b> — a clever boy at school"],"parts":[{"title":"A Mistake at the Station","label":"Part 1","paras":["Matthew and Marilla Cuthbert were a brother and sister who lived together on their farm, Green Gables. They were getting old, and they needed help on the farm. So they decided to adopt a boy from an orphanage in Nova Scotia.","Matthew drove to the train station to get the boy. But on the platform, there was only a thin little girl, about eleven years old, with a big hat, two long red braids and a face full of freckles. She was holding an old bag. \"I suppose you are Mr. Matthew Cuthbert of Green Gables?\" she said. \"I was beginning to be afraid you weren't coming.\"","Matthew was too shy to tell her there was a mistake. On the way home, the girl talked and talked. She talked about the beautiful trees, the \"White Way of Delight,\" the \"Lake of Shining Waters\" — she gave new, romantic names to everything. Matthew, who was usually afraid of women and girls, found that he enjoyed listening to her.","At Green Gables, Marilla was shocked. \"Matthew Cuthbert, who's that? Where is the boy?\" When the girl understood that they had wanted a boy, she threw herself on the bed and cried. \"You don't want me because I'm not a boy!\" Her name was Anne — \"Anne spelled with an <i>e</i>,\" she insisted. That night, she cried herself to sleep."],"quotes":[],"words":"<i>adopt</i> (to take a child into your family as your own) · <i>orphanage</i> (a home for children without parents) · <i>braid</i> (hair crossed in three parts, like a rope) · <i>freckles</i> (small brown spots on the skin) · <i>insist</i> (to say something very firmly)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>adopt, orphanage, braids, freckles, insisted</i>.","type":"bank","items":[{"q":"The Cuthberts wanted to ___ a boy.","blanks":1,"ans":["adopt"]},{"q":"Anne came from an ___ in Nova Scotia.","blanks":1,"ans":["orphanage"]},{"q":"She had two long red ___.","blanks":1,"ans":["braids"]},{"q":"Her face was full of ___.","blanks":1,"ans":["freckles"]},{"q":"She ___ that her name was \"Anne with an <i>e</i>.\"","blanks":1,"ans":["insisted"]}],"bank":["adopt","orphanage","braids","freckles","insisted"]},{"id":"B","title":"B. Grammar: past simple vs past continuous.","instr":"Choose.","type":"choose","items":[{"segs":["When Matthew ",["arrived","was arriving"],", Anne ",["waited","was waiting"]," on the platform."],"ans":[["arrived"],["was waiting"]]},{"segs":["While they ",["drove","were driving"]," home, Anne ",["talked","was talking"]," all the time."],"ans":[["were driving"],["was talking"]]},{"segs":["Anne ",["cried","was crying"]," when she ",["understood","was understanding"]," the mistake."],"ans":[["cried"],["understood"]]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The Cuthberts wanted to adopt a girl.","ans":"F","note":"a boy"},{"q":"Matthew enjoyed listening to Anne.","ans":"T","note":""},{"q":"Anne was happy when she arrived at Green Gables.","ans":"F","note":""}]}]},{"title":"Anne Stays","label":"Part 2","paras":["The next morning, Marilla planned to send Anne back to the orphanage. But Matthew, very quietly, said, \"Well now, I suppose she's a real interesting little thing.\" Marilla was surprised. Then she found out that the only other option for Anne was to work for a hard, unkind woman with many children. Marilla couldn't do it. \"Well,\" she said, \"Matthew and I have decided to keep you.\" Anne cried again, this time with happiness.","Life at Green Gables was not always easy. Anne had a terrible temper. When a neighbor, Mrs. Rachel Lynde, said she was \"skinny and homely\" and her hair was \"red as carrots,\" Anne stamped her foot and shouted, \"I hate you!\" Marilla made her apologize. Anne did it — in such a dramatic way that Mrs. Lynde was charmed.","Anne also found a \"kindred spirit\": Diana Barry, a pretty girl with black hair who lived nearby. They promised to be best friends forever. Anne was full of joy. Everything was new and wonderful to her: the flowers, the apple trees, the little stream near the house.","Marilla, who had never shown her feelings much, began to love Anne, although she didn't say it. And Matthew already loved her completely."],"quotes":["<i>\"Kindred spirits are not so scarce as I used to think. It's splendid to find out there are so many of them in the world.\"</i> — Anne"],"words":"<i>temper</i> (the tendency to become angry quickly) · <i>apologize</i> (to say sorry) · <i>stamp</i> (to put your foot down hard on the floor) · <i>kindred spirit</i> (a person who thinks and feels like you) · <i>joy</i> (great happiness)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["temper","apologize","stamp","kindred spirit","joy"],"opts":[["a","to say sorry"],["b","great happiness"],["c","a person who feels like you"],["d","to put your foot down hard"],["e","the tendency to get angry quickly"]],"ans":["e","a","d","c","b"]},{"id":"B","title":"B. Grammar: make + person + verb.","instr":"Complete.","type":"type","items":[{"q":"Marilla made Anne ___ (apologize) to Mrs. Lynde.","blanks":1,"ans":["apologize"]},{"q":"Anne's stories made Matthew ___ (smile).","blanks":1,"ans":["smile"]},{"q":"Mrs. Lynde's words made Anne ___ (feel) angry.","blanks":1,"ans":["feel"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Marilla decide to keep Anne?","model":"Because the other option was to work for a hard, unkind woman."},{"q":"What did Mrs. Lynde say about Anne?","model":"That she was skinny and homely, with hair as red as carrots."},{"q":"Who was Diana Barry?","model":"Anne's best friend, her \"kindred spirit.\""}]}]},{"title":"Mistakes and Adventures","label":"Part 3","paras":["Anne was always getting into trouble, but her mistakes were never bad on purpose. One afternoon, Marilla let her invite Diana to tea. Anne offered Diana some raspberry cordial, a sweet drink. Diana liked it very much and drank three big glasses. When she got home, she was drunk! Anne had given her Marilla's homemade currant wine by mistake. Diana's mother was furious and didn't let Diana see Anne anymore. Anne was heartbroken.","But that winter, Diana's little sister became very ill with croup, and her parents weren't home. Anne knew what to do, because she had taken care of small children at her old homes. She worked all night and saved the baby's life. Mrs. Barry apologized, and the two friends were together again.","At school, there was a clever, handsome boy, Gilbert Blythe. On Anne's first day, he pulled one of her braids and called her \"Carrots!\" Anne broke her slate on his head. From that day, she refused to speak to him, even when he said sorry. Instead, she decided to be better than him in every subject.","There were other disasters. Anne put liniment instead of vanilla in a cake. She tried to dye her hair black, but it turned green, and Marilla had to cut it very short. \"Marilla,\" Anne said once, \"isn't it nice to think that tomorrow is a new day with no mistakes in it yet?\""],"quotes":["<i>\"Isn't it nice to think that tomorrow is a new day with no mistakes in it yet?\"</i> — Anne"],"words":"<i>on purpose</i> (intentionally, not by accident) · <i>drunk</i> (affected by too much alcohol) · <i>croup</i> (an illness that makes it hard for children to breathe) · <i>slate</i> (a small board for writing, used in old schools) · <i>dye</i> (to change the color of something)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>on purpose, drunk, croup, slate, dye</i>.","type":"bank","items":[{"q":"Anne never made mistakes ___.","blanks":1,"ans":["on purpose"]},{"q":"After three glasses of wine, Diana was ___.","blanks":1,"ans":["drunk"]},{"q":"Diana's sister was very ill with ___.","blanks":1,"ans":["croup"]},{"q":"Anne broke her ___ on Gilbert's head.","blanks":1,"ans":["slate"]},{"q":"Anne tried to ___ her hair black.","blanks":1,"ans":["dye"]}],"bank":["on purpose","drunk","croup","slate","dye"]},{"id":"B","title":"B. Grammar: should have / shouldn't have.","instr":"Complete.","type":"type","items":[{"q":"Anne ___ (check) the bottle before giving it to Diana.","blanks":1,"ans":["should have checked"]},{"q":"Gilbert ___ (call) Anne \"Carrots.\"","blanks":1,"ans":["shouldn't have called"]},{"q":"Anne ___ (dye) her hair.","blanks":1,"ans":["shouldn't have dyed"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Anne gave Diana wine on purpose.","ans":"F","note":""},{"q":"Anne saved Diana's little sister.","ans":"T","note":""},{"q":"Anne's hair turned green.","ans":"T","note":""}]}]},{"title":"Growing Up","label":"Part 4","paras":["The years passed, and Anne grew from a talkative little girl into a tall, intelligent young woman. She was still full of imagination, but she was calmer now. Her red hair had become a beautiful dark auburn, and some people even said she was pretty.","At school, a wonderful new teacher, Miss Stacy, encouraged Anne to study for the entrance exam to Queen's Academy, a college in the town where students trained to become teachers. Anne and Gilbert studied hard, still in silent competition. When the results came out, Anne and Gilbert had tied for first place among all the students on the island!","At Queen's, Anne worked harder than ever. At the end of the year, she won the Avery Scholarship, which meant she could go to university. Matthew was so proud of her. \"Well now, I'd rather have you than a dozen boys, Anne,\" he said, patting her hand. \"It wasn't a boy that took the Avery scholarship, was it? It was a girl — my girl — my girl that I'm proud of.\"","Marilla also told Anne how much she loved her — for the first time. Anne felt that her life was perfect."],"quotes":["<i>\"Well now, I'd rather have you than a dozen boys, Anne.\"</i> — Matthew"],"words":"<i>talkative</i> (talking a lot) · <i>encourage</i> (to give someone confidence to do something) · <i>entrance exam</i> (a test to enter a school) · <i>tie</i> (to have the same result as someone in a competition) · <i>scholarship</i> (money given to a good student to pay for studies)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["exam","test","scholarship","quiz"],"ans":"scholarship","note":""},{"opts":["talkative","shy","quiet","silent"],"ans":"talkative","note":""},{"opts":["teacher","student","school","farmer"],"ans":"farmer","note":""}]},{"id":"B","title":"B. Grammar: comparatives with \"than ever\" and \"more and more\".","instr":"Complete.","type":"type","items":[{"q":"At Queen's, Anne worked ___ (hard) than ever.","blanks":1,"ans":["harder"]},{"q":"Anne became ___ (calm) as she grew up.","blanks":1,"ans":["calmer"]},{"q":"Matthew was ___ (proud) than ever.","blanks":1,"ans":["prouder"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Who encouraged Anne to study for Queen's?","model":"Miss Stacy, the new teacher."},{"q":"What happened in the entrance exam?","model":"Anne and Gilbert tied for first place."},{"q":"What did the Avery Scholarship mean for Anne?","model":"That she could go to university."}]}]},{"title":"The Bend in the Road","label":"Part 5","paras":["But sad times came. One morning, Matthew received a letter: the bank where he and Marilla kept all their money had failed. The shock was too much for his weak heart, and he died. Anne was devastated. She had lost the person who had loved her first and best.","Then Anne learned that Marilla's eyes were getting worse, and that she might go blind. Marilla couldn't take care of the farm alone, so she decided to sell Green Gables. Anne made a difficult decision. She gave up the scholarship. \"I'm going to stay here with you,\" she told Marilla. \"I'll teach at a school nearby, and we'll keep Green Gables.\"","The school in Avonlea already had a teacher: Gilbert Blythe. But when Gilbert heard about Anne's decision, he gave her his job and took a school in another town, so she could stay close to Marilla. Anne went to thank him. \"I want to thank you for giving up the school for me,\" she said, and she gave him her hand. Gilbert smiled. \"We are going to be the best of friends,\" he said. Finally, after five years, they were.","Anne's future was different from her dreams, but she wasn't unhappy. \"When I left Queen's my future seemed to stretch out before me like a straight road,\" she told Marilla. \"Now there is a bend in it. I don't know what lies around the bend, but I'm going to believe that the best does.\" That night, Anne looked out of her window at the stars. \"God's in his heaven, all's right with the world,\" she whispered softly."],"quotes":[],"words":"<i>fail</i> (for a bank: to lose all its money and close) · <i>devastated</i> (extremely sad and shocked) · <i>blind</i> (not able to see) · <i>give up</i> (to stop having or doing something) · <i>bend</i> (a curve in a road)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>failed, devastated, blind, gave up, bend</i>.","type":"bank","items":[{"q":"The bank where they kept their money ___.","blanks":1,"ans":["failed"]},{"q":"When Matthew died, Anne was ___.","blanks":1,"ans":["devastated"]},{"q":"Marilla might go ___.","blanks":1,"ans":["blind"]},{"q":"Anne ___ her scholarship to stay with Marilla.","blanks":1,"ans":["gave up"]},{"q":"There was a ___ in Anne's road.","blanks":1,"ans":["bend"]}],"bank":["failed","devastated","blind","gave up","bend"]},{"id":"B","title":"B. Grammar: will / going to.","instr":"Choose.","type":"choose","items":[{"segs":["\"I'm ",["going to stay","will staying"]," here with you,\" said Anne."],"ans":[["going to stay"]]},{"segs":["\"We ",["will keep","keeping"]," Green Gables.\""],"ans":[["will keep"]]},{"segs":["\"We ",["are going to be","will being"]," the best of friends,\" said Gilbert."],"ans":[["are going to be"]]}]},{"id":"C","title":"C. Talk about it.","instr":"Answer in 3–4 sentences.","type":"open","items":[{"q":"Was Anne right to give up the scholarship? Why?"},{"q":"Who is your \"kindred spirit\"?"},{"q":"Have you ever had a \"bend in the road\" in your life?"}]}]}]},{"id":"littlewomen","title":"Little Women","level":"B1","author":"Louisa May Alcott (1868–1869)","color":"#b5525c","intro":["A B1 version of <i>Little Women</i> by Louisa May Alcott (1868–1869, public domain), in 5 parts. It follows the four March sisters as they grow up in a small town in Massachusetts, in the United States, during and after the Civil War. The quotes are from the original text.","<b>Who's who</b><br>• <b>Meg</b> — 16, the oldest; pretty and responsible<br>• <b>Jo</b> — 15, a tomboy who wants to be a writer<br>• <b>Beth</b> — 13, very shy, kind and musical<br>• <b>Amy</b> — 12, the youngest; artistic and a little vain<br>• <b>Marmee</b> — their mother<br>• <b>Laurie</b> — the rich boy who lives next door"],"parts":[{"title":"Christmas Without Presents","label":"Part 1","paras":["\"Christmas won't be Christmas without any presents,\" grumbled Jo, lying on the rug. It was a cold December evening, and the four March sisters were sitting by the fire. Their father was far away, working as a chaplain in the Civil War, and the family had lost most of its money. Meg had to work as a governess, and Jo spent her days with old Aunt March, who was rich and difficult.","Each girl had a dollar, and each one wanted to buy something for herself: Jo wanted a book, Beth wanted new music, Amy wanted drawing pencils. But then they had a better idea. They decided to use the money to buy presents for their mother, Marmee, who worked so hard for them.","On Christmas morning, Marmee came home with a request. A poor German family, the Hummels, lived nearby. The mother had a new baby, six children were in one bed to keep warm, and they had nothing to eat. \"My girls, will you give them your breakfast as a Christmas present?\" The girls were very hungry, but they agreed. They carried their breakfast to the Hummels' cold little house and fed the children. It was the happiest breakfast they had ever had.","That evening, there was a surprise: a table full of ice cream, cake, fruit and flowers. It was a gift from their rich old neighbor, Mr. Laurence, who had heard about their good action."],"quotes":["<i>\"Christmas won't be Christmas without any presents,\" grumbled Jo, lying on the rug.</i>"],"words":"<i>grumble</i> (to complain in a low voice) · <i>chaplain</i> (a priest who works with soldiers) · <i>governess</i> (a woman who teaches children in their home) · <i>request</i> (when you ask for something politely) · <i>feed / fed</i> (to give food to someone)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>grumbled, chaplain, governess, request, fed</i>.","type":"bank","items":[{"q":"\"No presents this year,\" Jo ___.","blanks":1,"ans":["grumbled"]},{"q":"Their father was a ___ in the war.","blanks":1,"ans":["chaplain"]},{"q":"Meg worked as a ___ for a rich family.","blanks":1,"ans":["governess"]},{"q":"Marmee came home with a ___.","blanks":1,"ans":["request"]},{"q":"The girls ___ the Hummel children.","blanks":1,"ans":["fed"]}],"bank":["grumbled","chaplain","governess","request","fed"]},{"id":"B","title":"B. Grammar: superlatives with present perfect.","instr":"Complete.","type":"type","items":[{"q":"It was the (happy) ___ breakfast they had ever had.","blanks":1,"ans":["happiest"]},{"q":"Mr. Laurence was the (rich) ___ man they knew.","blanks":1,"ans":["richest"]},{"q":"Aunt March was the (difficult) ___ person Jo had ever worked for.","blanks":1,"ans":["most difficult"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"The girls used their money to buy presents for themselves.","ans":"F","note":"they bought presents for Marmee"},{"q":"They gave their Christmas breakfast to a poor family.","ans":"T","note":""},{"q":"Mr. Laurence sent them a surprise dinner.","ans":"T","note":""}]}]},{"title":"The Boy Next Door","label":"Part 2","paras":["Next to the Marches lived old Mr. Laurence and his grandson, Laurie. Laurie was a lonely boy who had lost his parents. Jo met him at a party, where they both hid from the dancing, and they became friends immediately. Soon Laurie was like a brother to all the girls. He even joined their secret club, where they wrote a newspaper together.","Shy Beth was afraid of old Mr. Laurence. But when he heard that she loved music, he invited her to play his grand piano, which nobody used. Later, he gave her a little piano of her own. Beth was so grateful that she went to his house, knocked on his door and kissed him — the bravest thing she had ever done.","But the sisters were not perfect. One day, Amy wanted to go to the theater with Jo and Laurie, and Jo said no. To get revenge, Amy burned the book Jo had been writing for years. Jo was so angry that she couldn't forgive her. The next day, Jo and Laurie went skating on the river. Amy followed them, and Jo didn't warn her that the ice was thin in the middle. Amy fell through the ice into the freezing water. Laurie saved her. That night, Jo cried and told Marmee about her terrible temper. \"I am angry nearly every day of my life, Jo,\" Marmee answered, \"but I have learned not to show it.\""],"quotes":[],"words":"<i>lonely</i> (sad because you are alone) · <i>grateful</i> (feeling thankful) · <i>revenge</i> (hurting someone because they hurt you) · <i>skating</i> (moving on ice with special shoes) · <i>forgive</i> (to stop being angry with someone)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Match the word to the meaning.","type":"match","left":["lonely","grateful","revenge","skating","forgive"],"opts":[["a","feeling thankful"],["b","moving on ice"],["c","to stop being angry with someone"],["d","sad because you are alone"],["e","hurting someone who hurt you"]],"ans":["d","a","e","b","c"]},{"id":"B","title":"B. Grammar: past perfect continuous.","instr":"Complete.","type":"type","items":[{"q":"Jo ___ (write) her book for years when Amy burned it.","blanks":1,"ans":["had been writing"]},{"q":"The girls ___ (wait) for news from their father for months.","blanks":1,"ans":["had been waiting"]},{"q":"Laurie ___ (live) alone with his grandfather since his parents died.","blanks":1,"ans":["had been living"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Mr. Laurence give Beth a piano?","model":"Because she loved music."},{"q":"Why did Amy burn Jo's book?","model":"To get revenge because Jo didn't take her to the theater."},{"q":"What did Marmee tell Jo about anger?","model":"That she was angry nearly every day too, but she had learned not to show it."}]}]},{"title":"Hard Times","label":"Part 3","paras":["One cold November day, a telegram arrived: Mr. March was very ill in a hospital in Washington. Marmee had to go to him immediately, but the family didn't have enough money for the trip. That evening, Jo came home with twenty-five dollars. She took off her hat, and everyone screamed: her long, beautiful hair was gone. She had sold it. \"It will be good for my vanity,\" she joked. But that night, in bed, she cried quietly for her lost hair.","While Marmee was away, the sisters promised to continue helping the Hummels. But one by one, they forgot — except Beth. She went every day. The Hummel baby had scarlet fever, a dangerous illness, and it died in Beth's arms. Soon Beth got sick too. For days she had a high fever and didn't recognize anyone. Jo stayed by her bed day and night. They sent a telegram to Marmee, and she came home as fast as she could. On the night she arrived, Beth's fever broke, and she began to recover.","Meanwhile, Meg had a secret admirer: John Brooke, Laurie's tutor. He was poor, but he was kind and honest. When he asked Meg to marry him, Aunt March said that if Meg married a poor man, she would never give her a cent. But Meg chose love. Jo was upset — she didn't want her sister to leave — but at Christmas, Mr. March came home from the war, and the family was together again."],"quotes":[],"words":"<i>telegram</i> (a short message sent quickly by electric signals) · <i>vanity</i> (being too proud of how you look) · <i>scarlet fever</i> (a dangerous illness with a red rash) · <i>recover</i> (to become healthy again) · <i>tutor</i> (a private teacher)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>telegram, vanity, scarlet fever, recover, tutor</i>.","type":"bank","items":[{"q":"A ___ arrived with bad news about Mr. March.","blanks":1,"ans":["telegram"]},{"q":"Jo said losing her hair was good for her ___.","blanks":1,"ans":["vanity"]},{"q":"Beth caught ___ from the Hummel baby.","blanks":1,"ans":["scarlet fever"]},{"q":"Slowly, Beth began to ___.","blanks":1,"ans":["recover"]},{"q":"John Brooke was Laurie's ___.","blanks":1,"ans":["tutor"]}],"bank":["telegram","vanity","scarlet fever","recover","tutor"]},{"id":"B","title":"B. Grammar: if + would (second conditional).","instr":"Complete.","type":"type","items":[{"q":"If Meg married a poor man, Aunt March ___ (not give) her any money.","blanks":1,"ans":["wouldn't give"]},{"q":"If Jo ___ (not sell) her hair, Marmee couldn't have traveled.","blanks":1,"ans":["hadn't sold"]},{"q":"If I ___ (be) Meg, I would ___.","blanks":2,"ans":["were","*"]}]},{"id":"C","title":"C. Comprehension.","instr":"True or false?","type":"tf","items":[{"q":"Jo sold her hair to pay for her mother's trip.","ans":"T","note":""},{"q":"All the sisters visited the Hummels every day.","ans":"F","note":"only Beth"},{"q":"Meg chose to marry for love.","ans":"T","note":""}]}]},{"title":"Growing Up","label":"Part 4","paras":["Three years later, Meg married John Brooke in a simple wedding at home. Laurie went to college, and everyone thought he would marry Jo one day. But Jo saw him only as her best friend. When Laurie finally told her that he loved her, she said no. \"I can't love you as you want me to,\" she said. \"I've tried, but I can't change the feeling.\" Laurie was heartbroken, and he went to Europe to forget her.","Jo needed a change too. She went to New York to work as a governess and to write. She sold sensational stories to newspapers for good money. In her boarding house, she met Professor Friedrich Bhaer, a poor, older German teacher with a big beard and a kind heart. He told her that her sensational stories were not worthy of her talent. Jo stopped writing them and started to write more honestly.","Amy, meanwhile, traveled to Europe with Aunt Carrol to study art. In Paris and Nice, she grew into an elegant young woman. There she met Laurie, who was wasting his time and his money. Amy told him the truth: he was lazy and should do something useful with his life. Laurie was surprised, but he listened."],"quotes":["<i>\"I'm not afraid of storms, for I'm learning how to sail my ship.\"</i> — Amy"],"words":"<i>wedding</i> (the ceremony when two people marry) · <i>sensational</i> (exciting and shocking, but not serious) · <i>boarding house</i> (a house where you rent a room and eat meals) · <i>worthy of</i> (good enough for) · <i>waste</i> (to use something badly or for no reason)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Which word is different? Circle it.","type":"odd","items":[{"opts":["wedding","marriage","husband","piano"],"ans":"piano","note":""},{"opts":["Paris","Nice","Europe","Massachusetts"],"ans":"Massachusetts","note":""},{"opts":["lazy","useful","hard-working","busy"],"ans":"lazy","note":""}]},{"id":"B","title":"B. Grammar: reported speech.","instr":"Report what they said.","type":"type","items":[{"q":"Jo: \"I can't love you.\" → Jo said that she ___ love Laurie.","blanks":1,"ans":["couldn't"]},{"q":"Professor Bhaer: \"Your stories are not worthy of you.\" → He said that her stories ___ worthy of her.","blanks":1,"ans":["weren't"]},{"q":"Amy: \"You are lazy.\" → Amy said that Laurie ___ lazy.","blanks":1,"ans":["was"]}]},{"id":"C","title":"C. Comprehension.","instr":"Answer the questions.","type":"open","items":[{"q":"Why did Laurie go to Europe?","model":"To forget Jo, who had refused him."},{"q":"What did Professor Bhaer think about Jo's stories?","model":"That they were not worthy of her talent."},{"q":"What did Amy tell Laurie in Europe?","model":"That he was lazy and should do something useful."}]}]},{"title":"Beth, and New Beginnings","label":"Part 5","paras":["When Jo came home, she saw that Beth was very weak. She had never fully recovered from the scarlet fever. Jo took her to the beach, hoping the sea air would help. There, Beth told her quietly that she knew she was going to die. \"I'm not afraid,\" she said. In the spring, with her family around her, Beth died peacefully. Jo felt she had lost a part of herself.","Meanwhile, in Europe, Laurie and Amy fell in love. They married and came home together. Jo was happy for them, but she felt lonely. Then, one rainy day, Professor Bhaer appeared at the door. He had come to the town for work — and to see Jo. On a walk in the rain, under his umbrella, he told her he loved her, and Jo said yes. They were poor, but they didn't care.","When Aunt March died, she left her big house, Plumfield, to Jo. Jo and Friedrich turned it into a school for boys, especially poor and lonely boys who needed a home. Jo also started to write again, this time about her own life and her sisters.","Years later, at an apple harvest at Plumfield, the whole family was together: Marmee and Mr. March, Meg and John with their children, Amy and Laurie with their little daughter, Jo and Friedrich with their sons, and many happy students. Jo looked at them all and felt grateful. Her life was different from her childhood dreams — but it was full of love."],"quotes":[],"words":"<i>peacefully</i> (calmly, without pain or fear) · <i>umbrella</i> (you use it when it rains) · <i>harvest</i> (the time when you collect fruit or crops) · <i>crops</i> (plants grown on a farm for food) · <i>childhood</i> (the time when you are a child)","ex":[{"id":"A","title":"A. Vocabulary.","instr":"Complete with: <i>peacefully, umbrella, harvest, childhood, lonely</i>.","type":"bank","items":[{"q":"Beth died ___, with her family around her
