<style>
body{margin:0;font-family:'DM Sans',sans-serif;color:#1f2a5c;background:#f8e6f5;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.5px);background-size:16px 16px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 14px 60px;display:grid;grid-template-columns:540px 1fr;gap:18px;align-items:start}
h1{font-family:'Fraunces',serif;font-weight:900;margin:0 0 4px;font-size:2rem}
.card{background:#fffdf9;border:3px solid #1f2a5c;border-radius:20px;box-shadow:5px 5px 0 #1f2a5c;padding:14px}

.doll{position:absolute;left:197.8px;top:73.5px;width:107.5px;height:285.6px}

h2{font-family:'Fraunces',serif;font-size:1.1rem;margin:12px 0 6px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.it{all:unset;cursor:pointer;border:2px solid #1f2a5c;border-radius:14px;background:#fff;padding:6px;text-align:center;font-size:.8rem;font-weight:700}
.it.on{background:#fbf06a}
.it canvas{display:block;margin:0 auto 4px;image-rendering:pixelated;width:96px;height:96px}
.it small{display:block;font-weight:400;color:#4f5683}
.row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.btn{font-family:'Fraunces',serif;font-weight:800;border:2px solid #1f2a5c;border-radius:999px;padding:5px 14px;background:#fff;box-shadow:2px 2px 0 #1f2a5c;cursor:pointer}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}@media(max-width:560px){.scene{transform:scale(.68);transform-origin:top left;margin-bottom:-134px}}

let ON={},MOOD='happy';document.addEventListener('DOMContentLoaded',()=>{});
const ML={sleepy:'😴 sleepy',sad:'😢 sad',happy:'😄 happy',nailed:'😉 nailed it',notquite:'😬 not quite',wrong:'🙄 wrong'};
function draw(){const d=document.getElementById('doll');d.innerHTML='';
 ORDER.forEach(l=>{if(BASE[l]){const i=new Image();i.src=l==='head'?FACES[MOOD]:((l==='body'&&ON.dresses)?BASE.bodyDress:BASE[l]);d.appendChild(i);}
  ITEMS.forEach(it=>{if(it.cat===l&&ON[it.cat]===it.id){const i=new Image();i.src=it.src;d.appendChild(i);}})});
 document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',ON[b.dataset.cat]===b.dataset.id));}

Object.keys(CATS).forEach(c=>{const h=document.createElement('h2');h.textContent=CATS[c];L.appendChild(h);const g=document.createElement('div');g.className='grid';L.appendChild(g);
 ITEMS.filter(i=>i.cat===c).forEach(it=>{const b=document.createElement('button');b.className='it';b.dataset.id=it.id;b.dataset.cat=it.cat;
  const cv=document.createElement('canvas');cv.width=48;cv.height=48;const im=new Image();im.onload=()=>{const [x0,y0,x1,y1]=it.bb;const w=x1-x0,h=y1-y0,s=Math.min(46/w,46/h);const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(im,x0,y0,w,h,(48-w*s)/2,(48-h*s)/2,w*s,h*s);};im.src=it.src;
