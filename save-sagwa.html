      if(q.x<lo){q.x=lo;q.vx=Math.abs(q.vx)*.5+.6}if(q.x>hi){q.x=hi;q.vx=-Math.abs(q.vx)*.5-.6}}
    else if(q.y<F1+30){if(q.x<SP0+R){q.x=SP0+R;q.vx=.5}if(q.x>SP1-R){q.x=SP1-R;q.vx=-.5}}
    if(q.y>TGY){q.gone=true;S.absorbed[q.k]++;sPop();S.fx.push({x:W/2+(Math.random()-.5)*50,y:TGY-10,t:0,e:q.e});

  S.amb.forEach(a=>{a.y+=a.s*.6*dt;if(a.y>H)a.y=305})}
function outcome(ok){S.state=ok?'win':'lose';S.ot=S.t;const L=S.L,Q=S.Q,b=$('#blank');
  if(ok){sWin();b.textContent=Q[1];b.classList.add('good');
    if(S.r+1<L[5].length){$('#hint').innerHTML=`<span style="color:var(--good)">${esc(S.sc.win)}</span> 💡 ${esc(L[4])}`;
      setTimeout(()=>{if(S.state==='win'){S.r++;S.tries=0;setup()}},2600);return}
    const st=S.mis===0?3:S.mis<=2?2:1;if(st>(SV[LV]||0)){SV[LV]=st;save()}
    setTimeout(()=>{$('#obox').innerHTML=`<div class="fat" style="font-size:1.6rem">Level complete! 🎉</div><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
      <div class="full">${L[5].map(q=>esc(q[0]).replace('___','<b>'+esc(q[1])+'</b>')).join('<br>')}</div><div class="rule">💡 ${esc(L[4])}</div>
      ${NODES.some(n=>n.k==='r'+LV)?'<button class="btn" id="nx">📏 Rule check ▶</button>':LV+1<LEVELS.length?'<button class="btn" id="nx">Next level ▶</button>':''} <button class="btn alt" id="mp">Levels</button>`;
      $('#over').classList.remove('hidden');const nx=$('#nx');if(nx)nx.onclick=()=>{$('#over').classList.add('hidden');S=null;NODES.some(n=>n.k==='r'+LV)?startRule(LV):start(LV+1)};$('#mp').onclick=()=>{$('#over').classList.add('hidden');showMap()}},1700)}
  else{sLose();b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');S.tries++;S.mis++;
    $('#hint').innerHTML=`<span style="color:var(--bad)">${esc(S.sc.lose)}</span> Not <b>${esc(S.chosen.w)}</b>. Try again!`;
    setTimeout(()=>{if(S.state==='lose'){setup()}},2200)}}
/* ---------- drawing ---------- */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const BALLC=['#ebb3e6','#9ccfdc','#fbf06a'];
function emo(e,x,y,s){g.font=`${s}px ${EF}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y)}
function draw(){const sc=S.sc,st=S.state,ph=st==='win'?1:st==='lose'?2:0,tt=S.t;
  g.setTransform(SCL,0,0,SCL,0,0);g.clearRect(0,0,W,H);
  // ---- scene (bottom) ----
  g.fillStyle=sc.wall;g.fillRect(0,300,W,H-300);g.fillStyle=sc.floor;g.fillRect(0,560,W,60);
  if(sc.amb==='out'){g.fillStyle='#fff';[[60,380],[290,395]].forEach(([x,y])=>{g.beginPath();g.ellipse(x,y,30,11,0,0,7);g.fill()})}
  // prop
  const pe=sc.prop[ph];
  if(S.L[2]==='tree'){emo('🌳',W/2,470,150);}
  else if(S.L[2]==='window'){g.fillStyle='#fff';rr(W/2-60,395,120,100,8);g.fill();g.strokeStyle='#1f2a5c';g.lineWidth=4;g.stroke();g.fillStyle=ph===1?'#cfe7f7':'#9cc7e6';g.fillRect(W/2-54,401,108,88);
    if(ph!==1){g.fillStyle='#1f2a5c';g.beginPath();g.moveTo(W/2-10,420);g.lineTo(W/2+18,430);g.lineTo(W/2+6,455);g.lineTo(W/2-22,448);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(W/2-10,420);g.lineTo(W/2-40,405);g.moveTo(W/2+18,430);g.lineTo(W/2+50,418);g.stroke()}
    else emo('🪵',W/2+2,440,44)}
  else if(S.L[2]==='cold'){g.fillStyle='#b5523c';rr(W/2-62,420,124,140,6);g.fill();g.strokeStyle='#1f2a5c';g.lineWidth=3;g.stroke();g.fillStyle='#2a1a18';rr(W/2-38,460,76,100,30);g.fill();emo(ph===1?'🔥':ph===2?'❄️':'🪵',W/2,522,ph===1?54+Math.sin(tt*.3)*4:40)}
  else emo(pe,W/2+20,490,ph===1?96:84);
  if(S.L[2]==='dark'&&ph===1){g.fillStyle='rgba(255,240,150,.25)';g.beginPath();g.moveTo(W/2+20,490);g.lineTo(W,380);g.lineTo(W,600);g.closePath();g.fill()}
  // landing particles (fx)
  S.fx.forEach(f=>{g.globalAlpha=1-f.t/40;emo(f.e,f.x,f.y+f.t*.6,20);g.globalAlpha=1});
  // Maria (pose image depends on the scenario and the phase)
  const pz=sc.p[ph],mood=sc.m[ph],mi=IM['p_'+mood+'_'+pz];const shake=(ph===0&&sc.amb==='snow')||ph===2?Math.sin(tt*1.6)*1.5:0;
  const MX=-8,MY=372,MW=114,MH=242;
  if(mi&&mi.complete)g.drawImage(mi,MX+shake,MY,MW,MH);
  const ddy=pz.startsWith('kneel')?62:pz.startsWith('sit')?100:0;
  if(sc.bucket&&ph===0)emo('🪣',MX+MW/2+shake,MY+4,30);
  // Sagwa
  const ci=IM['cat_'+sc.c[ph]];g.imageSmoothingEnabled=false;
  let cx=280,cy=508,cs=96,inArms=sc.hug[ph]&&pz.endsWith('hug');
  if(inArms){cx=MX+MW/2+shake;cs=64;cy=MY+(118+ddy)*MH/340}
  else if(S.L[2]==='tree'&&ph!==1){cx=W/2+18;cy=388;cs=60}
  else if(S.L[2]==='window'&&ph===2){cx=W/2-28+Math.min(60,(tt-S.ot)*3);cy=410;cs=60}
  if(ci&&ci.complete){g.save();if(ph===2&&!inArms)g.translate(Math.sin(tt*2)*2,0);g.drawImage(IM[inArms?'cat_sit':'cat_'+sc.c[ph]],cx-cs/2,cy,cs,cs);g.restore()}
  if(inArms&&mi&&mi.complete){/* redraw the arms band over the cat so it looks hugged */g.drawImage(mi,0,(150+ddy),160,40,MX+shake,MY+(150+ddy)*MH/340,MW,40*MH/340)}
  g.imageSmoothingEnabled=true;
  // ambience
  if(sc.amb==='snow'&&ph!==1){g.fillStyle='rgba(255,255,255,.9)';S.amb.forEach(a=>{g.beginPath();g.arc(a.x,a.y,a.s,0,7);g.fill()})}
  if(sc.amb==='wind'&&ph!==1){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;S.amb.slice(0,8).forEach((a,i)=>{const x=(a.x+tt*3)%W;g.beginPath();g.moveTo(x,a.y);g.quadraticCurveTo(x+12,a.y-6,x+24,a.y);g.stroke()})}
  if(sc.amb==='water'){const lv=ph===1?0:ph===2?90:40+Math.sin(tt*.08)*4;g.fillStyle='rgba(80,160,220,.45)';g.fillRect(0,H-lv,W,lv)}
  if(sc.amb==='smoke'&&ph!==1){g.fillStyle='rgba(120,120,120,.25)';S.amb.slice(0,10).forEach(a=>{g.beginPath();g.arc((a.x+tt)%W,a.y-80,14+a.s*6,0,7);g.fill()})}
  if(sc.amb==='dark'&&ph!==1){g.fillStyle='rgba(10,10,30,.45)';g.fillRect(0,300,W,H-300)}
  // ---- glass + funnel (top) ----
  g.fillStyle='#f4f8ff';g.fillRect(0,0,W,300);
  g.fillStyle='rgba(180,215,240,.35)';rr(GX0,GY0,GX1-GX0,PINY-GY0+6,22);g.fill();
  g.beginPath();g.moveTo(GX0,PINY+6);g.lineTo(SP0,F1);g.lineTo(SP0,F1+26);g.lineTo(SP1,F1+26);g.lineTo(SP1,F1);g.lineTo(GX1,PINY+6);g.closePath();g.fill();
  g.strokeStyle='#1f2a5c';g.lineWidth=5;g.lineJoin='round';

    g.fillStyle='#f6c945';g.strokeStyle='#1f2a5c';g.lineWidth=2.5;rr(x0,PINY-6,x1-x0,12,6);g.fill();g.stroke();
    g.fillStyle='#ffe58a';g.fillRect(x0+4,PINY-4,x1-x0-8,3);

    g.font='800 17px Fraunces, Georgia, serif';const tw=Math.max(56,g.measureText(p.w).width+22),th=30,ty=PINY+10;
    g.fillStyle='rgba(31,42,92,.9)';rr(cx-tw/2+3,ty+3,tw,th,15);g.fill();g.fillStyle='#fffdf7';rr(cx-tw/2,ty,tw,th,15);g.fill();g.lineWidth=2.5;g.stroke();
    g.fillStyle='#1f2a5c';g.textAlign='center';g.textBaseline='middle';g.fillText(p.w,cx,ty+th/2+1);
    // little ring
    g.strokeStyle='#c99a1a';g.lineWidth=3;g.beginPath();g.arc(cx,ty-1,4,0,7);g.stroke();g.globalAlpha=1});
  if(S.state==='idle'&&S.t<200){const k=Math.floor(S.t/30)%S.n,p=S.pins[k];emo('👆',(p.x0+p.x1)/2+14,PINY+58+Math.sin(S.t*.25)*4,26)}}
let last=0;function loop(t){if(!running)return;const dt=Math.min(2,(t-(last||t))/16.67);last=t;step(dt);draw();requestAnimationFrame(loop)}

<script>
(function(){
