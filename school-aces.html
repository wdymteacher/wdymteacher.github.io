<style>
:root{--bg:#120c26;--navy:#1f2a5c;--white:#fffdf9;--pink:#ff5fa2;--yellow:#ffe14d;--cyan:#5ef0f0;--green:#3ddc84;--red:#ff5a7a;--lil:#b98cff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 20% 0%,#3a1d6a 0,transparent 55%),radial-gradient(ellipse at 90% 80%,#5a1d4a 0,transparent 50%),var(--bg);color:var(--white);font-family:'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:58px 14px 40px}
h1,h2,h3,.fat{font-family:'Fraunces',serif;font-weight:800;font-variation-settings:"SOFT" 100;margin:0}
.px{font-family:'Pixelify Sans',monospace}
.logo{font-size:2.5rem;line-height:1;text-align:center;color:var(--yellow);text-shadow:3px 3px 0 var(--pink),6px 6px 0 #000}
.tag{text-align:center;opacity:.85;margin:8px 0 16px}
.card{background:var(--white);color:var(--navy);border:3px solid var(--navy);border-radius:20px;box-shadow:5px 5px 0 #000;padding:14px;margin-bottom:14px}
.btn{font-family:'Fraunces',serif;font-weight:800;font-variation-settings:"SOFT" 100;font-size:1.05rem;border:2.5px solid var(--navy);border-radius:999px;padding:10px 20px;box-shadow:3px 3px 0 #000;cursor:pointer;background:var(--yellow);color:var(--navy)}
.btn.alt{background:#9fe7ff}.btn.pink{background:#ffb3d6}.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hidden{display:none!important}
.years{display:flex;gap:6px;margin:6px 0 10px}

.years button.on{background:var(--pink);color:#fff}
.tops{display:flex;flex-direction:column;gap:6px}
.tops label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.95rem;padding:7px 9px;border:2px solid #d9d0f0;border-radius:12px;cursor:pointer}

.tops small{margin-left:auto;font-size:.72rem;opacity:.7;white-space:nowrap}
.bar{height:7px;width:54px;border:1.5px solid var(--navy);border-radius:9px;overflow:hidden;background:#fff;flex:none}.bar i{display:block;height:100%;background:var(--green)}

.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:210px;overflow:auto}
.sugg button{font:700 .82rem 'DM Sans';border:2px solid #cfc4ee;border-radius:999px;padding:5px 10px;background:#f4f0ff;color:var(--navy);cursor:pointer}
.sugg button small{opacity:.6;margin-left:3px}.sugg .hd{width:100%;font-size:.78rem;font-weight:800;opacity:.7}
.found{font-size:.85rem;font-weight:700;margin:6px 2px;min-height:1.2em}
.avs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.avs button.on{background:var(--yellow);transform:translateY(-3px)}
canvas.doll{image-rendering:pixelated;width:40px;height:100px}
.msg{min-height:1.3em;font-weight:700;text-align:center;margin:8px 0}
/* game */
#game{max-width:640px;margin:0 auto;padding:54px 10px 12px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.9rem;margin-bottom:6px}
.top .rd{background:var(--white);color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:3px 10px;box-shadow:2px 2px 0 #000}

.pl{display:flex;flex-direction:column;align-items:center;font-size:.72rem;font-weight:800;width:68px;position:relative}
.pl canvas{width:28px;height:70px}
.pl .nm{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sc{color:var(--yellow)}
.pl .st{position:absolute;top:-4px;right:6px;font-size:.9rem}
.pl .played{position:absolute;top:22px;left:50%;transform:translateX(-50%);font:800 .7rem 'DM Sans';background:var(--white);color:var(--navy);border:2px solid var(--navy);border-radius:8px;padding:2px 5px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}

.table{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1d6a4a 0,#0f3f2c 70%);border:4px solid #3b2a14;border-radius:28px;box-shadow:inset 0 0 0 4px #5a4220,5px 5px 0 #000;padding:16px 10px;min-height:170px;position:relative;margin-top:6px}

.pc{width:calc((100% - 18px)/4);max-width:130px;min-height:88px;background:linear-gradient(160deg,#fff 0,#fff6dc 100%);color:var(--navy);border:3px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 #000;font:800 .95rem/1.15 'DM Sans';display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 4px;cursor:pointer;word-break:break-word;transition:transform .15s}

.pc.sel{transform:translateY(-14px);background:#fff3a0}
.pc.gone{opacity:.25;pointer-events:none}
.pc.ok{background:#c9f7dc}.pc.no{background:#ffd0da}
.pc:disabled{cursor:default}
.wr{display:flex;gap:8px;margin:12px 0 6px}
.wr .inp{flex:1}
.sp{display:flex;gap:6px;justify-content:center;margin:2px 0 4px;flex-wrap:wrap}
.sp button{font:800 .8rem 'DM Sans';border:2px solid var(--navy);border-radius:999px;padding:5px 10px;background:var(--lil);color:var(--navy);cursor:pointer;box-shadow:2px 2px 0 #000}
.sp button.on{background:var(--yellow)}
.sp button:disabled{opacity:.4}
.teach{display:flex;gap:10px;align-items:flex-end;margin-top:8px}
.teach canvas{width:40px;height:100px;flex:none}
.bubble{background:var(--white);color:var(--navy);border:3px solid var(--navy);border-radius:16px 16px 16px 4px;padding:10px 12px;font-weight:700;font-size:.95rem;box-shadow:3px 3px 0 #000;flex:1}
.bubble b{color:#c2187a}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--yellow);color:var(--navy);border:3px solid var(--navy);border-radius:14px;padding:8px 16px;font:800 1rem 'DM Sans';box-shadow:3px 3px 0 #000;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
.code{font:900 2.6rem 'Fraunces',serif;letter-spacing:.18em;text-align:center;margin:6px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.plist div{display:flex;justify-content:space-between;align-items:center;background:#f3eefc;border:2px solid var(--navy);border-radius:12px;padding:6px 10px;font-weight:700}
.plist button{border:2px solid var(--navy);border-radius:999px;background:#fff;cursor:pointer;font-weight:800;padding:0 8px}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0}
.pod div{display:flex;flex-direction:column;align-items:center;font-weight:800}
.pod .blk{width:74px;border:3px solid var(--navy);border-bottom:0;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:1.5rem;padding-top:4px}
.mist{border-top:1px dashed #b9b0d0;padding:8px 0;font-size:.92rem}
.mist:first-of-type{border-top:0}
.legal{text-align:center;font-size:.75rem;opacity:.6;margin-top:16px}
a.home{position:fixed;top:12px;left:12px;z-index:60;font:700 14px 'DM Sans',system-ui,sans-serif;color:#1f2a5c;background:#fffdf9;border:2px solid #1f2a5c;border-radius:999px;padding:5px 14px;text-decoration:none;box-shadow:2px 2px 0 #1f2a5c}
#snd{position:fixed;top:12px;right:12px;z-index:60;font:700 14px 'DM Sans';color:#1f2a5c;background:#fffdf9;border:2px solid #1f2a5c;border-radius:999px;padding:5px 12px;box-shadow:2px 2px 0 #1f2a5c;cursor:pointer}
@media (max-width:420px){.qcard{font-size:1.08rem}.pc{font-size:.82rem;min-height:80px}.logo{font-size:2.1rem}}
</style>

<script>
const T={"be": {"y": 6, "n": "Verbo to be", "k": ["to be", "verbo ser", "ser estar", "am is are", "be"], "it": [{"s": "I ___ 13 years old.", "a": "am", "w": ["is", "are", "have"], "e": "Com I usamos am. E idade em inglês é com to be: I am 13 (não \"I have 13\")."}, {"s": "My sister ___ a nurse.", "a": "is", "w": ["are", "am", "be"], "e": "My sister = she. Com he/she/it usamos is."}, {"s": "We ___ in the same class.", "a": "are", "w": ["is", "am", "be"], "e": "Com we/you/they usamos are."}, {"s": "___ you hungry?", "a": "Are", "w": ["Is", "Am", "Do"], "e": "Pergunta com to be: o verbo vai para o começo. You → Are you…?"}, {"s": "They ___ not at school today.", "a": "are", "w": ["is", "am", "do"], "e": "Negativa com to be: they are not (they aren't)."}, {"s": "It ___ cold today!", "a": "is", "w": ["are", "am", "has"], "e": "It (o tempo) usa is: It is cold."}, {"s": "The books ___ on the table.", "a": "are", "w": ["is", "am", "be"], "e": "The books = they (plural), então are."}, {"s": "___ your mom a teacher?", "a": "Is", "w": ["Are", "Does", "Am"], "e": "Your mom = she → Is she…? Pergunta com to be começa com o verbo."}, {"s": "I ___ not tired.", "a": "am", "w": ["is", "are", "don't"], "e": "Negativa com to be: I am not (I'm not). Não usamos don't com to be."}, {"s": "Where ___ my keys?", "a": "are", "w": ["is", "am", "be"], "e": "Keys é plural, então are."}]}, "ps3": {"y": 6, "n": "Present simple (he/she/it + -s)", "k": ["present simple", "presente simples", "simple present", "terceira pessoa", "he she it", "does", "doesn't", "rotina"], "it": [{"s": "My brother ___ soccer every Saturday.", "a": "plays", "w": ["play", "playing", "plaies"], "e": "Com he/she/it o verbo ganha -s: he plays."}, {"s": "She ___ English at night.", "a": "studies", "w": ["study", "studys", "studying"], "e": "Verbo terminado em consoante + y: troca y por -ies: studies."}, {"s": "He ___ TV after dinner.", "a": "watches", "w": ["watch", "watchs", "watching"], "e": "Verbos terminados em ch, sh, s, x, o ganham -es: watches."}, {"s": "My mom ___ to work by bus.", "a": "goes", "w": ["go", "gos", "going"], "e": "Go com he/she/it vira goes."}, {"s": "She ___ two cats.", "a": "has", "w": ["have", "haves", "having"], "e": "Have com he/she/it vira has."}, {"s": "My dad ___ (not) like coffee.", "a": "doesn't", "w": ["don't", "isn't", "not"], "e": "Negativa com he/she/it: doesn't + verbo sem -s (doesn't like)."}, {"s": "___ your sister live here?", "a": "Does", "w": ["Do", "Is", "Are"], "e": "Pergunta com he/she/it: Does + sujeito + verbo sem -s."}, {"s": "I ___ (not) eat meat.", "a": "don't", "w": ["doesn't", "am not", "not"], "e": "Com I/you/we/they a negativa é don't."}, {"s": "Does she ___ in São Paulo?", "a": "live", "w": ["lives", "living", "lived"], "e": "Depois de does o verbo volta para a forma normal, sem -s."}, {"s": "They ___ at 7 a.m. every day.", "a": "get up", "w": ["gets up", "getting up", "are get up"], "e": "Com they o verbo fica sem -s: they get up."}]}, "pc": {"y": 6, "n": "Present continuous (-ing)", "k": ["present continuous", "presente contínuo", "presente continuo", "ing", "agora", "now"], "it": [{"s": "Look! It ___.", "a": "is raining", "w": ["rains", "raining", "is rainning"], "e": "Agora (look!) = am/is/are + verbo com -ing: is raining."}, {"s": "I'm ___ to school right now.", "a": "driving", "w": ["drive", "drives", "driveing"], "e": "Depois de am/is/are vem o verbo com -ing. Drive perde o e: driving."}, {"s": "We ___ a movie at the moment.", "a": "are watching", "w": ["watch", "is watching", "are watch"], "e": "At the moment = agora: we are watching."}, {"s": "They're ___ in the pool.", "a": "swimming", "w": ["swiming", "swim", "swims"], "e": "Swim: consoante-vogal-consoante dobra a última letra: swimming."}, {"s": "She ___ (not) listening to me.", "a": "isn't", "w": ["doesn't", "don't", "not"], "e": "Negativa do present continuous: is not (isn't) + -ing."}, {"s": "What ___ you doing?", "a": "are", "w": ["do", "is", "does"], "e": "Pergunta: Are you doing…? O verbo to be vai para frente."}, {"s": "He's ___ on the sofa.", "a": "sitting", "w": ["siting", "sit", "sits"], "e": "Sit dobra o t: sitting."}, {"s": "I'm ___ a cake for my mom.", "a": "making", "w": ["makeing", "make", "makes"], "e": "Make perde o e antes do -ing: making."}, {"s": "Shh! The baby ___.", "a": "is sleeping", "w": ["sleeps", "sleeping", "is sleep"], "e": "Está acontecendo agora: is sleeping."}, {"s": "Why ___ you laughing?", "a": "are", "w": ["do", "is", "does"], "e": "Pergunta no present continuous: Why are you laughing?"}]}, "imp": {"y": 6, "n": "Imperativo", "k": ["imperativo", "imperative", "ordens", "comandos", "instruções"], "it": [{"s": "___ your books, please.", "a": "Open", "w": ["Opens", "Opening", "To open"], "e": "Imperativo = verbo na forma normal, sem sujeito: Open."}, {"s": "___ talk during the test!", "a": "Don't", "w": ["Not", "No", "Doesn't"], "e": "Imperativo negativo: Don't + verbo."}, {"s": "___ the door, please.", "a": "Close", "w": ["Closes", "Closing", "Closed"], "e": "Para dar instruções usamos o verbo puro: Close the door."}, {"s": "___ late for class!", "a": "Don't be", "w": ["Not be", "Don't", "Be not"], "e": "Negativo com to be: Don't be late."}, {"s": "___ quiet, please!", "a": "Be", "w": ["Is", "Are", "Being"], "e": "Imperativo com to be: Be quiet!"}, {"s": "___ your name on the paper.", "a": "Write", "w": ["Writes", "Writing", "To write"], "e": "Instrução: verbo puro, sem -s: Write."}, {"s": "___ run in the hallway.", "a": "Don't", "w": ["No", "Not", "Doesn't"], "e": "Proibição no imperativo: Don't run."}, {"s": "Please ___ the sentences.", "a": "read", "w": ["reads", "reading", "to read"], "e": "Depois de please vem o verbo puro: please read."}]}, "poss": {"y": 6, "n": "Possessivos e 's", "k": ["possessivo", "possessive", "genitivo", "'s", "my his her", "adjetivos possessivos"], "it": [{"s": "This is ___ bike. (Pedro)", "a": "Pedro's", "w": ["Pedros", "Pedro", "of Pedro"], "e": "Para dizer de quem é const BAD=/(fuck|shit|bitch|dick|cock|pussy|cunt|nigg|fag|porn|sex|puta|porra|caralho|merda|buceta|viado|foda|piroca|pinto|bosta|arrombad|vagabund|cuzao|desgraca|retardad|vadia|otario|idiota|burr)/i;

const ROUNDS=10,WRITTEN=[2,5,8];/* rounds 3, 6, 9 */
function buildDeck(tops,seed){const R=mulberry(seed);let pool=[];tops.forEach(t=>T[t].it.forEach((it,i)=>pool.push({t,i})));pool=shufR(pool,R);
  /* spread topics: round-robin */
  const by={};pool.forEach(p=>(by[p.t]=by[p.t]||[]).push(p));const ks=shufR(Object.keys(by),R),out=[];let k=0;while(out.length<ROUNDS&&ks.some(t=>by[t].length)){const t=ks[k%ks.length];if(by[t].length)out.push(by[t].shift());k++}
  while(out.length<ROUNDS)out.push(pool[out.length%pool.length]);
  /* 4 cards: the right one + its 3 wrong options (never cards from other sentences, which could also be right) */
  return out.map((p,r)=>{const it=T[p.t].it[p.i];return {t:p.t,it,hand:shufR([it.a,...it.w.slice(0,3)],R),written:WRITTEN.includes(r)}})}

const loadJS=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function getDB(){if(DB)return DB;if(!window.firebase){await loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');await loadJS('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js')}if(!firebase.apps.length)firebase.initializeApp(FBCFG);DB=firebase.database();return DB}
const pidOf=()=>{let p=LS('pid');if(!p){p='p'+Math.random().toString(36).slice(2,10);LS('pid',p)}return p};
const genCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];return c};
function friends(tops){app.innerHTML=`<div class="wrap"><div class="logo" style="font-size:2rem">👥 Com amigos</div>
  <div class="card"><button class="btn" id="create" style="width:100%">🏠 Criar uma sala</button><p style="font-size:.85rem;margin:6px 0 0;text-align:center">A sala usa os assuntos que você escolheu.</p></div>
  <div class="card"><p style="font-weight:700;margin:0 0 6px;text-align:center">Entrar na sala de um amigo</p><input class="inp" id="code" maxlength="5" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"><button class="btn alt" id="join" style="width:100%;margin-top:8px">🚪 Entrar</button><p class="msg" id="fmsg" style="color:#c2187a"></p></div>
  <div class="row"><button class="btn alt" id="back">Voltar</button></div></div>`;
  $('#back').onclick=()=>home();
  $('#create').onclick=async()=>{$('#fmsg').textContent='Criando a sala…';try{await createRoom(tops)}catch(e){$('#fmsg').textContent='Não consegui conectar. Confira sua internet.'}};
  $('#join').onclick=async()=>{const c=$('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==5){$('#fmsg').textContent='O código tem 5 letras/números.';return}$('#fmsg').textContent='Entrando…';try{await joinRoom(c)}catch(e){$('#fmsg').textContent='Não consegui conectar. Confira sua internet.'}}}
async function createRoom(tops){const db=await getDB(),pid=pidOf();let code=genCode();for(let k=0;k<5;k++){const s=await db.ref('rooms/'+code).once('value');if(!s.exists())break;code=genCode()}
  const ref=db.ref('rooms/'+code);await ref.set({game:'aces',host:pid,tops,seed:Math.floor(Math.random()*1e9),state:'lobby',r:0,phase:'play',created:Date.now(),players:{[pid]:{name:CFG.name,av:CFG.av,score:0}}});
  ref.onDisconnect().remove();listenRoom(code,pid,true)}
async function joinRoom(code){const db=await getDB(),pid=pidOf(),ref=db.ref('rooms/'+code),s=await ref.once('value');
  if(!s.exists()||s.val().game!=='aces'){$('#fmsg').textContent='Sala não encontrada. Confira o código.';return}const r=s.val();if(r.state!=='lobby'){$('#fmsg').textContent='Essa partida já começou. Peça para avisarem na próxima!';return}
  if(Object.keys(r.players||{}).length>=30){$('#fmsg').textContent='A sala está cheia.';return}
  await ref.child('players/'+pid).set({name:CFG.name,av:CFG.av,score:0});ref.child('players/'+pid).onDisconnect().remove();listenRoom(code,pid,false)}
function stopRoom(){if(RM&&RM.ref){try{RM.ref.off()}catch(e){}}RM=null;if(G&&G.mode==='online'){clearInterval(G.tmI);G=null}}
function leaveRoom(){if(!RM)return;const r=RM;stopRoom();if(r.host)r.ref.remove();else r.ref.child('players/'+r.pid).remove()}
function listenRoom(code,pid,host){const ref=DB.ref('rooms/'+code);RM={code,pid,host,ref,room:null,key:''};
  ref.on('value',s=>{if(!RM)return;const r=s.val();if(!r){const h=RM.host;stopRoom();if(!h)home('A sala foi fechada.');return}
    RM.room=r;if(!r.players||!r.players[RM.pid]){stopRoom();return home('Você saiu da sala.')}
    if(r.state==='lobby')return lobby();
    if(r.state==='end'){if(RM.key!=='end'){RM.key='end';if(G){G.players.forEach(p=>{const q=r.players[p.id];if(q&&p.id!==RM.pid)p.score=q.score});endGame()}}return}
    onlineSync(r)})}
function lobby(){RM.key='lobby';G=null;const r=RM.room,ps=Object.entries(r.players||{});
  app.innerHTML=`<div class="wrap"><div class="card" style="text-align:center"><p style="margin:0;font-weight:700">Código da sala — mande para os amigos!</p><div class="code">${RM.code}</div><p style="margin:0;font-size:.85rem">${r.tops.map(k=>esc(T[k].n)).join(' · ')}</p></div>
   <div class="card"><h3>Jogadores (${ps.length})</h3><div class="plist">${ps.map(([id,p])=>`<div><span>${id===r.host?'👑 ':''}${esc(p.name)}${id===RM.pid?' (você)':''}</span>${RM.host&&id!==RM.pid?`<button data-k="${id}" title="Remover">✕</button>`:''}</div>`).join('')}</div>
   ${RM.host?'<button class="btn" id="start" style="width:100%">🃏 Começar!</button>':'<p class="msg">Esperando o dono da sala começar… ⏳</p>'}</div>
   <div class="row"><button class="btn alt" id="lv">${RM.host?'Fechar a sala':'Sair'}</button></div></div>`;
  $('#lv').onclick=()=>{leaveRoom();home()};
  if(RM.host){$('#start').onclick=()=>RM.ref.update({state:'play',r:0,phase:'play',t0:Date.now()});app.querySelectorAll('.plist button').forEach(b=>b.onclick=()=>RM.ref.child('players/'+b.dataset.k).remove())}}
function onlineSync(r){const key=r.r+'-'+r.phase;
  if(!G||G.mode!=='online'||G.seed!==r.seed+'-'+(r.round||1)){const me=newPlayer(RM.pid,CFG.name,CFG.av,false);
    G={mode:'online',isHost:RM.host,host:RM.host,seed:r.seed+'-'+(r.round||1),tops:r.tops,deck:buildDeck(r.tops,r.seed+(r.round||1)),r:-1,players:[me],me,sp:[],mist:[],R:mulberry(r.seed+5)};
    G.next=()=>{if(!RM.host)return;const n=G.r+1;if(n>=ROUNDS)RM.ref.update({state:'end'});else RM.ref.update({r:n,phase:'play',t0:Date.now()})};
    G.onPlay=(ans,t)=>RM.ref.child('players/'+RM.pid+'/a/'+G.r).set({c:ans,t});
    G.check=()=>{};G.timeout=()=>{if(RM.host&&G.phase==='play')RM.ref.update({phase:'reveal'})}}
  if(RM.key!==key&&r.phase==='play')G.phase='play';
  /* players list from room */
  const P=r.players||{};const keep=G.players.reduce((m,p)=>(m[p.id]=p,m),{});
  G.players=Object.keys(P).map(id=>{const p=keep[id]||newPlayer(id,P[id].name,P[id].av,false);p.name=P[id].name;p.av=P[id].av;if(id!==RM.pid)p.score=P[id].score||0;const a=P[id].a&&P[id].a[r.r];if(G.phase!=='reveal'||id!==RM.pid){p.ans=a?a.c:null;p.t=a?a.t:0}return p});G.me=G.players.find(p=>p.id===RM.pid)||G.me;
  if(RM.key===key){renderPlayers();if(RM.host&&r.phase==='play'&&G.players.every(p=>p.ans!=null))RM.ref.update({phase:'reveal'});return}
  RM.key=key;
  if(r.phase==='play'){G.r=r.r;G.phase='play';G.t0=r.t0||Date.now();G.players.forEach(p=>{p.ok=null});if(G.me.ans==null&&[0,3,6].includes(G.r))setTimeout(()=>giveSpecial(G.R),400);gameScreen();
    if(G.me.ans!=null){app.querySelectorAll('.pc').forEach(b=>b.disabled=true)}startTimer(G.deck[G.r].written?40:25)}
  else if(r.phase==='reveal'){G.r=r.r;if(G.phase!=='reveal'){reveal();RM.ref.child('players/'+RM.pid+'/score').set(G.me.score)}}}
function roomAgain(){const r=RM.room,up={state:'lobby',round:(r.round||1)+1};Object.keys(r.players||{}).forEach(k=>{up['players/'+k+'/score']=0;up['players/'+k+'/a']=null});RM.key='';RM.ref.update(up)}
home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sa-sw.js').catch(()=>{});
</script>
