/* ---------- mole ---------- */
const MOLE=`<svg viewBox="0 0 100 104" aria-hidden="true">
<path d="M14 104 C10 50 26 14 50 14 C74 14 90 50 86 104 Z" fill="#8a5a3b" stroke="#1f2a5c" stroke-width="3"/>
<path d="M30 104 C28 74 38 62 50 62 C62 62 72 74 70 104 Z" fill="#c99872"/>
<ellipse cx="36" cy="42" rx="5" ry="6" fill="#1f2a5c"/><ellipse cx="64" cy="42" rx="5" ry="6" fill="#1f2a5c"/>
<circle cx="38" cy="40" r="1.8" fill="#fff"/><circle cx="66" cy="40" r="1.8" fill="#fff"/>
<ellipse cx="50" cy="56" rx="15" ry="11" fill="#e8bf9a" stroke="#1f2a5c" stroke-width="2"/>
<ellipse cx="50" cy="51" rx="7" ry="5" fill="#f08aa6" stroke="#1f2a5c" stroke-width="2"/>
<rect x="45" y="61" width="5" height="7" rx="1" fill="#fff" stroke="#1f2a5c" stroke-width="1.5"/><rect x="50" y="61" width="5" height="7" rx="1" fill="#fff" stroke="#1f2a5c" stroke-width="1.5"/>
<ellipse cx="27" cy="51" rx="5" ry="3" fill="#f2a7b8" opacity=".7"/><ellipse cx="73" cy="51" rx="5" ry="3" fill="#f2a7b8" opacity=".7"/>
<path d="M18 92 q8 -10 18 -2" fill="#f2c5a8" stroke="#1f2a5c" stroke-width="2.5"/><path d="M82 92 q-8 -10 -18 -2" fill="#f2c5a8" stroke="#1f2a5c" stroke-width="2.5"/>
</svg>`;
const HAMMER=`<svg class="swing" viewBox="0 0 48 48"><rect x="21" y="16" width="6" height="30" rx="2" fill="#d9a066" stroke="#1f2a5c" stroke-width="2"/><rect x="8" y="4" width="32" height="15" rx="4" fill="#e2385a" stroke="#1f2a5c" stroke-width="2"/></svg>`;

/* ---------- game ---------- */
let G=null,HOLES=[];
const QN=()=>window.WDYM_N?WDYM_N():10;
function buildGrid(){$('#grid').innerHTML='';HOLES=[];
  for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';h.innerHTML=`<div class="pit"></div><div class="win"><div class="mole">${MOLE}<div class="sign"></div></div></div><div class="lip"></div>`;
    $('#grid').appendChild(h);const m=h.querySelector('.mole');const H={el:h,m,up:false,label:'',t:0};
    m.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();whack(H,e)});HOLES.push(H)}}
function start(){
  const pool=D.BANK[CFG.lv];
  G={list:shuffle(pool).slice(0,QN()),i:0,miss:0,run:0,log:[]};
  $('#menu').classList.add('hidden');$('#end').classList.add('hidden');$('#game').classList.remove('hidden');
  buildGrid();next();$('#game').scrollIntoView({behavior:'smooth',block:'start'})}
function hud(){$('#hq').textContent=`🔨 ${G.i+1} / ${G.list.length}`;$('#hm').textContent=`❌ ${G.miss} mistake${G.miss===1?'':'s'}`;$('#hl').textContent=`${CFG.lv} · ${SPS[CFG.sp]}`}
function next(){
  if(G.i>=G.list.length)return end();
  const it=G.list[G.i];G.it=it;G.done=false;G.run++;const run=G.run;G.wrongLog=[];
  const [s,ans,mean,exc,base]=it;
  if(CFG.md==='gap'){
    G.ans=ans;const bad=new Set([ans,...(exc||[])]);G.opts=[ans,...shuffle(D.PARTICLES.filter(p=>!bad.has(p))).slice(0,3)];
    $('#sent').innerHTML=esc(s).replace('__','<span class="blank" id="blank">&nbsp;?&nbsp;</span>');$('#mean').innerHTML='';
  }else{
    G.ans=base;const others=shuffle(D.BANK[CFG.lv].filter(x=>x[4]!==base&&x[2]!==mean).map(x=>x[4]));const uniq=[...new Set(others)].slice(0,3);
    G.opts=[base,...uniq];
    $('#sent').innerHTML=`Which phrasal verb means <span class="blank" id="blank" style="min-width:0;border:0">“${esc(mean)}”</span>?`;$('#mean').innerHTML='';
  }
  hud();HOLES.forEach(down);G.sinceGood=0;
  setTimeout(()=>{if(run===G.run)loop(run)},500)}
function loop(run){if(!G||run!==G.run||G.done)return;
  const sp=SPEED[CFG.sp];const free=HOLES.filter(h=>!h.up);const upN=HOLES.filter(h=>h.up).length;
  if(free.length&&upN<3){const h=pick(free);
    const goodUp=HOLES.some(x=>x.up&&x.label===G.ans);
    let lab;if(!goodUp&&(G.sinceGood>=2||Math.random()<.42)){lab=G.ans;G.sinceGood=0}else{lab=pick(G.opts.filter(o=>o!==G.ans&&!HOLES.some(x=>x.up&&x.label===o)))||pick(G.opts.slice(1));G.sinceGood++}
    up(h,lab,sp.stay,run)}
  setTimeout(()=>loop(run),sp.gap*(.7+Math.random()*.6))}
function up(h,lab,stay,run){h.up=true;h.label=lab;h.m.className='mole';h.m.querySelector('.sign').textContent=lab;void h.m.offsetWidth;h.m.classList.add('up');sPop();
  const tok=++h.t;setTimeout(()=>{if(h.t===tok&&!h.hit)down(h)},stay)}
function down(h){h.t++;h.up=false;h.hit=false;h.m.classList.remove('up')}
function fxAt(e,txt){const f=$('#field'),r=f.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  const p=document.createElement('div');p.className='pop';p.textContent=txt;p.style.left=x+'px';p.style.top=(y-30)+'px';f.appendChild(p);setTimeout(()=>p.remove(),800);
  const w=document.createElement('div');w.innerHTML=HAMMER;const s=w.firstChild;s.style.left=x+'px';s.style.top=y+'px';f.appendChild(s);setTimeout(()=>s.remove(),260)}
function whack(h,e){if(!G||G.done||!h.up||h.hit)return;h.hit=true;h.t++;
  if(h.label===G.ans){G.done=true;h.m.classList.add('hit','good');sGood();fxAt(e,pick(['BONK!','Yes!','Great!','POW!']));
    const [s,ans,mean,,base]=G.it;const b=$('#blank');
    if(CFG.md==='gap'){b.textContent=ans;b.classList.add('good');$('#mean').innerHTML=`💡 <b>${esc(base)}</b> = ${esc(mean)}`}
    else{$('#sent').innerHTML=`<b style="color:var(--good)">${esc(base)}</b> = ${esc(mean)}`;$('#mean').innerHTML=esc(s).replace('__',`<b>${esc(ans)}</b>`)}
    G.log.push({it:G.it,wrong:G.wrongLog.slice()});
    setTimeout(()=>HOLES.forEach(x=>{if(x!==h)down(x)}),150);
    setTimeout(()=>{down(h);G.i++;next()},2300)}
  else{G.miss++;G.wrongLog.push(h.label);h.m.classList.add('hit','bad');sBad();fxAt(e,'Oops!');hud();
    const b=$('#blank');b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');
    setTimeout(()=>down(h),450)}}
function end(){G.done=true;G.run++;HOLES.forEach(down);
  const st=G.miss===0?3:G.miss<=2?2:1;const key=CFG.lv+'-'+CFG.md;if(st>(ST[key]||0)){ST[key]=st;save()}
  $('#game').classList.add('hidden');const e=$('#end');e.classList.remove('hidden');
  e.innerHTML=`<h2 class="fat" style="margin:0">Finished! 🎉</h2><p class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</p>
  <p>${G.miss===0?'Perfect! No mistakes.':G.miss+' mistake'+(G.miss>1?'s':'')+'.'}</p>
  <h3 style="margin:16px 0 4px;text-align:left">Review 📝</h3><ul class="review">${G.log.map(l=>{const [s,ans,mean,,base]=l.it;return `<li>${esc(s).replace('__',`<b>${esc(ans)}</b>`)}<br><i>${esc(base)} = ${esc(mean)}</i>${l.wrong.length?` <span style="color:var(--bad)">(you hit: ${l.wrong.map(esc).join(', ')})</span>`:''}</li>`}).join('')}</ul>
  <p><button class="btn" id="again">Play again</button> <button class="btn alt" id="tomenu">Change level</button></p>`;
  $('#again').onclick=start;$('#tomenu').onclick=menu;e.scrollIntoView({behavior:'smooth',block:'start'})}
menu();
</script>
<!-- wdym daily tracker -->
<script>
(function(){
  var K='wdym-daily',page=(location.pathname.split('/').pop()||'index.html').toLowerCase(),last=0,act=0;
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function poke(){last=Date.now()}
  ['pointerdown','keydown','touchstart','wheel'].forEach(function(e){addEventListener(e,poke,{passive:true,capture:true})});
  setInterval(function(){
    if(document.hidden||Date.now()-last>45000) return;
    act+=5;
    try{
      var s=JSON.parse(localStorage.getItem(K)||'{}'),d=today();s.days=s.days||{};
      var r=s.days[d]=s.days[d]||{};
      r[page]=(r[page]||0)+5;
      var ks=Object.keys(s.days).sort();while(ks.length>60){delete s.days[ks.shift()]}
      localStorage.setItem(K,JSON.stringify(s));
    }catch(e){}
  },5000);
})();
</script>

<style>
.wq{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font:600 .9rem/1.2 'DM Sans',system-ui,sans-serif;color:#1f2a5c;margin:8px 0}

<script>
/* wdym: let students choose how many questions (5 / 10 / 15). Add <span data-qcount></span> anywhere; read WDYM_N(). */
(function(){
  var KEY='wdym-qcount';
  function get(){var v=10;try{v=parseInt(localStorage.getItem(KEY),10)||10}catch(e){}return [5,10,15].indexOf(v)<0?10:v}
  window.WDYM_N=get;
  window.WDYM_TAKE=function(arr){var n=get();return arr.slice(0,Math.min(n,arr.length))};
  function render(el){
    var n=get();
    el.innerHTML='<span class="wq"><b>How many questions?</b> '+[5,10,15].map(function(k){return '<button type="button" data-n="'+k+'" class="'+(k===n?'on':'')+'" aria-pressed="'+(k===n)+'">'+k+'</button>'}).join('')+'</span>';
    el.querySelectorAll('button').forEach(function(b){b.onclick=function(e){e.stopPropagation();try{localStorage.setItem(KEY,b.dataset.n)}catch(_){}document.querySelectorAll('[data-qcount]').forEach(render);}});
    el.dataset.qdone='1';
  }
  function scan(){document.querySelectorAll('[data-qcount]:not([data-qdone])').forEach(render)}
  if(document.readyState!=='loading')scan();else document.addEventListener('DOMContentLoaded',scan);
  try{new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true})}catch(e){}
})();
</script>

<!-- wdym mute -->
<button id="wdymMute" aria-label="Sound on/off" title="Sound on/off" style="position:fixed;top:12px;right:12px;z-index:9999;font:700 14px 'DM Sans',system-ui,sans-serif;color:#1f2a5c;background:#fffdf9;border:2px solid #1f2a5c;border-radius:999px;padding:5px 12px;box-shadow:2px 2px 0 #1f2a5c;cursor:pointer">🔊 Sound on</button>
<script>
(function(){
  var K='wdym-mute',m=false;try{m=localStorage.getItem(K)==='1'}catch(e){}
  var allow=0,live=new Set(),btn=document.getElementById('wdymMute');
  /* when muted, audio only plays if the student taps a 🔊 / listen button */
  document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('button,[role=button],.show,.mcard');
    if(b&&b.id!=='wdymMute'&&(/🔊/.test(b.textContent)||b.matches('.speak,.spk,.ml,.show,[data-listen]')))allow=Date.now();},true);
  function ok(){return !m||Date.now()-allow<1500}
  var P=HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play=function(){if(!ok())return Promise.resolve();live.add(this);return P.apply(this,arguments)};
  if(window.speechSynthesis){var S=speechSynthesis.speak.bind(speechSynthesis);speechSynthesis.speak=function(u){if(ok())S(u)}}
  function ui(){btn.textContent=m?'🔇 Sound off':'🔊 Sound on';btn.style.background=m?'#ffd6df':'#fffdf9'}
  btn.onclick=function(){m=!m;try{localStorage.setItem(K,m?'1':'0')}catch(e){}
    if(m){live.forEach(function(a){try{a.pause()}catch(e){}});try{speechSynthesis.cancel()}catch(e){}}ui()};
  ui();
})();
</script>

<style id="wdym-mobile">
html,body{overflow-x:clip;max-width:100%}
@media (max-width:600px){
  html{scroll-padding-top:58px}
  [id],section{scroll-margin-top:58px}
  .wpan:has(>.wpan-sc>.wpan-el[style*="display: none"]){display:none}
  .wpan{position:relative;margin:0 0 14px}
  .wpan-sc{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;border-radius:18px}
  .wpan-sc::-webkit-scrollbar{display:none}
  .wpan-sc>.wpan-el{width:var(--wpw)!important;height:var(--wph)!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;margin:0!important;box-shadow:none!important}
  .wpan-sc>.wpan-el>svg{width:100%!important;height:100%!important;display:block}
  .wpan-arr{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:34px;height:34px;border-radius:50%;border:2px solid #1f2a5c;background:rgba(255,253,249,.92);color:#1f2a5c;font:800 22px/1 'DM Sans',system-ui,sans-serif;box-shadow:2px 2px 0 #1f2a5c;padding:0 0 3px;cursor:pointer;transition:opacity .2s}
  .wpan-arr.l{left:6px}.wpan-arr.r{right:6px}
  .wpan-arr[disabled]{opacity:0;pointer-events:none}
  .wpan-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:21;background:#1f2a5c;color:#fff;font:700 13px 'DM Sans',system-ui,sans-serif;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .5s}
  .wpan-hint.off{opacity:0}
}
</style>
<script id="wdym-mobile-js">
(function(){
  var mq=matchMedia('(max-width:600px)');
  window.WDYM_MOBILE=mq;
  /* faixa (tape) e topo: nunca embaixo dos botões fixos */
  var FIXTOP=window.WDYM_FIXTOP||'.tape';
  function fixTop(){
    var els=document.querySelectorAll(FIXTOP);
    els.forEach(function(t){t.style.marginTop=t.dataset.wmt||'';});
    if(!mq.matches)return;
    els.forEach(function(t){
      if(!t.offsetParent&&getComputedStyle(t).position!=='fixed')return;
      if(t.dataset.wmt===undefined)t.dataset.wmt=t.style.marginTop||'';
      var top=t.getBoundingClientRect().top+scrollY;
      if(top<54){var m=parseFloat(getComputedStyle(t).marginTop)||0;t.style.marginTop=(m+54-top)+'px';}
    });
  }
  window.wdymFixTop=fixTop;
  addEventListener('load',fixTop);addEventListener('resize',fixTop);
  document.addEventListener('click',function(){setTimeout(fixTop,60);setTimeout(fixTop,450);},true);
  document.addEventListener('DOMContentLoaded',fixTop);
  /* cenas largas: no celular em pé ficam grandes e o aluno arrasta para os lados */
  window.wdymPan=function(el,ratio,opt){
    opt=opt||{};
    if(!el)return;
    var w=el.closest('.wpan');
    if(!mq.matches){if(w)unpan(el);return;}
    if(w){size(w);return;}
    w=document.createElement('div');w.className='wpan';
    var sc=document.createElement('div');sc.className='wpan-sc';
    el.parentNode.insertBefore(w,el);w.appendChild(sc);sc.appendChild(el);el.classList.add('wpan-el');
    w._ratio=ratio;w._el=el;w._h=opt.h||.56;
    var l=document.createElement('button'),r=document.createElement('button');
    l.type=r.type='button';l.className='wpan-arr l';r.className='wpan-arr r';l.textContent='‹';r.textContent='›';
    l.setAttribute('aria-label','Look left');r.setAttribute('aria-label','Look right');
    l.onclick=function(e){e.stopPropagation();sc.scrollBy({left:-sc.clientWidth*.6,behavior:'smooth'});};
    r.onclick=function(e){e.stopPropagation();sc.scrollBy({left:sc.clientWidth*.6,behavior:'smooth'});};
    w.appendChild(l);w.appendChild(r);
    var hint=document.createElement('div');hint.className='wpan-hint';hint.textContent='👆 Swipe to look around';w.appendChild(hint);
    setTimeout(function(){hint.classList.add('off');setTimeout(function(){hint.remove();},600);},4000);
    function arrows(){var max=sc.scrollWidth-sc.clientWidth-2;l.disabled=sc.scrollLeft<=2;r.disabled=sc.scrollLeft>=max;}
    sc.addEventListener('scroll',arrows,{passive:true});w._arrows=arrows;
    size(w);
    if(opt.center)sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2;
    arrows();
    return w;
  };
  function size(w){
    var sc=w.firstChild,cw=sc.clientWidth||w.clientWidth;
    var h=Math.round(Math.max(window.innerHeight*w._h,cw/w._ratio+1));
    w._el.style.setProperty('--wph',h+'px');w._el.style.setProperty('--wpw',Math.round(h*w._ratio)+'px');
    if(w._arrows)w._arrows();
  }
  function unpan(el){var w=el.closest('.wpan');if(!w)return;el.classList.remove('wpan-el');w.parentNode.insertBefore(el,w);w.remove();}
  addEventListener('resize',function(){document.querySelectorAll('.wpan').forEach(function(w){if(mq.matches)size(w);else unpan(w._el);});});
})();
</script>
